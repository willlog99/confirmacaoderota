<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loglife - Motor de Localização</title>
</head>
<body>
    <script>
        const API = 'https://confirmacaoderota.willlog99.workers.dev';
        const { BackgroundGeolocation } = window.Capacitor?.Plugins || {};

        // Função principal do Motor de GPS
        async function ligarMotorGPS(nome) {
            console.log("[Motor] Iniciando rastreamento para:", nome);

            if (!BackgroundGeolocation) {
                console.warn("[Motor] Plugin GPS não encontrado.");
                return;
            }

            // Remove watchers antigos antes de iniciar um novo
            try { await BackgroundGeolocation.removeAllWatchers(); } catch(e) {}

            await BackgroundGeolocation.addWatcher({ 
                backgroundMessage: 'Loglife rastreando: ' + nome,
                backgroundTitle: 'Rastreio Ativo',
                distanceFilter: 15 // Atualiza a cada 15 metros
            }, async (pos, err) => {
                if (err || !pos) return;

                // Envia a localização para o servidor
                await fetch(API + '/localizacao', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        nome: nome, 
                        lat: pos.latitude, 
                        lng: pos.longitude, 
                        ts: Date.now() 
                    })
                });
            });
        }

        // Função para parar o rastreio
        async function pararMotorGPS() {
            if (BackgroundGeolocation) {
                await BackgroundGeolocation.removeAllWatchers();
                console.log("[Motor] Rastreamento parado.");
            }
        }

        // Escuta comandos vindos de fora (ex: do confirmar.html ou do app)
        window.addEventListener('message', async (e) => {
            if (e.data?.type === 'LIGAR_GPS') {
                ligarMotorGPS(e.data.nome);
            }
            if (e.data?.type === 'PARAR_GPS') {
                pararMotorGPS();
            }
        });
    </script>
</body>
</html>
