<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loglife — Minha Rota</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0F4F8;min-height:100vh;padding:0 0 6rem}

    .header{background:linear-gradient(135deg,#1E9FD9,#0F7BB0);padding:1.25rem 1.25rem 1.5rem;color:#fff}
    .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
    .back-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
    .header-logo{height:32px;width:auto;filter:brightness(0) invert(1)}
    .header-info{display:flex;align-items:center;gap:14px}
    .header-mascote{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,0.4);object-fit:cover;flex-shrink:0}
    .header-text h1{font-size:18px;font-weight:700;margin-bottom:2px}
    .header-text .sub{font-size:12px;opacity:.85}
    .rota-badge{display:inline-block;background:rgba(255,255,255,0.25);padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;margin-top:4px}

    .abas-rotas{display:flex;gap:8px;padding:1rem 1.25rem 0;overflow-x:auto;scroll-behavior:smooth;margin-bottom:.5rem}
    .aba-rota{padding:10px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.15);color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .3s}
    .aba-rota:hover{background:rgba(255,255,255,0.25)}
    .aba-rota.ativa{background:rgba(255,255,255,0.95);color:#0F7BB0;border-color:rgba(255,255,255,0.95)}

    .stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:1rem 1.25rem 0}
    .stat{background:#fff;border-radius:12px;padding:11px;text-align:center;box-shadow:0 1px 4px rgba(30,159,217,0.08)}
    .stat-val{font-size:22px;font-weight:700;color:#0F4C7A}
    .stat-val.primary{color:#1E9FD9}
    .stat-val.muted{color:#94A8B8}
    .stat-label{font-size:11px;color:#5A7A8F;margin-top:1px}

    .progress-wrap{padding:.75rem 1.25rem 0}
    .progress-bar{background:#D6E5EE;border-radius:99px;height:6px;overflow:hidden}
    .progress-fill{background:linear-gradient(90deg,#1E9FD9,#0F7BB0);height:100%;border-radius:99px;transition:width .4s ease}
    .progress-label{font-size:12px;color:#5A7A8F;text-align:right;margin-top:4px;font-weight:500}

    .toolbar{padding:.75rem 1.25rem 0;display:flex;gap:8px}
    .search-bar{flex:1;background:#fff;border-radius:10px;border:1.5px solid #D6E5EE;height:40px;padding:0 12px;font-size:14px;color:#111}
    .filter-btn{height:40px;padding:0 14px;border-radius:10px;border:1.5px solid #D6E5EE;background:#fff;font-size:13px;font-weight:500;color:#5A7A8F;cursor:pointer;white-space:nowrap}
    .filter-btn.active{background:#E8F4FB;color:#0F4C7A;border-color:#1E9FD9}

    .lista-container{perspective:1000px;position:relative;height:600px}
    .lista{padding:.75rem 1.25rem 0;animation:flipIn .6s ease forwards}
    .section-title{font-size:12px;font-weight:700;color:#94A8B8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.6rem;margin-top:.5rem}

    @keyframes flipIn{
      0%{opacity:0;transform:rotateY(90deg)}
      100%{opacity:1;transform:rotateY(0deg)}
    }

    .cliente-card{background:#fff;border-radius:14px;padding:.9rem 1rem;box-shadow:0 1px 4px rgba(30,159,217,0.08);margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:all .2s;cursor:pointer}
    .cliente-card.chegou{background:#FEF9EC;border:1.5px solid #F2CC70}
    .cliente-card.produtiva{background:#E8F4FB;border:1.5px solid #1E9FD9}
    .cliente-card.improdutiva{background:#F0F4F8;border:1.5px solid #94A8B8}
    .cliente-card.produtiva .cliente-nome,.cliente-card.improdutiva .cliente-nome{text-decoration:line-through;opacity:.7}
    .cliente-card.produtiva{cursor:default}
    .cliente-card.improdutiva{cursor:default}

    .check-btn{width:36px;height:36px;border-radius:10px;border:2px solid #D6E5EE;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;pointer-events:none}
    .check-btn.chegou{background:#F2CC70;border-color:#F2CC70;color:#5A4400}
    .check-btn.produtiva{background:#1E9FD9;border-color:#1E9FD9;color:#fff}
    .check-btn.improdutiva{background:#5A7A8F;border-color:#5A7A8F;color:#fff}

    .cliente-info{flex:1;min-width:0}
    .cliente-nome{font-size:17px;font-weight:700;color:#0F4C7A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cliente-meta{font-size:12px;color:#000;margin-top:2px;font-weight:500}
    .ts-info{font-size:11px;font-weight:500;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
    .ts-chegada{color:#92400E}
    .ts-saida{color:#1E9FD9}
    .ts-saida.improdutiva{color:#5A7A8F}
    .motivo-txt{font-size:11px;color:#5A7A8F;margin-top:2px;font-style:italic;font-weight:500}

    .horario-badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px;white-space:nowrap;flex-shrink:0}
    .horario-badge.normal{background:#F0F4F8;color:#0F4C7A}
    .horario-badge.chegou{background:#F2CC70;color:#5A4400}
    .horario-badge.produtiva{background:#1E9FD9;color:#fff}
    .horario-badge.improdutiva{background:#5A7A8F;color:#fff}
    .horario-badge.contra-pedido{background:#0F4C7A;color:#fff}
    .horario-badge.sob-demanda{background:#5A7A8F;color:#fff}

    .modal-overlay{position:fixed;inset:0;background:rgba(15,75,122,0.55);z-index:200;display:flex;align-items:flex-end;justify-content:center}
    .modal-overlay.hidden{display:none}
    .modal{background:#fff;border-radius:20px 20px 0 0;padding:1.75rem 1.5rem 2rem;width:100%;max-width:480px}
    .modal-cliente{font-size:13px;color:#94A8B8;margin-bottom:4px}
    .modal h2{font-size:18px;font-weight:700;color:#0F4C7A;margin-bottom:1.25rem}
    .modal-btns{display:flex;flex-direction:column;gap:10px}
    .btn-cheguei{padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none;background:linear-gradient(135deg,#F2A536,#B45309);color:#fff}
    .btn-produtiva{padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none;background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff}
    .btn-improdutiva{padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:1.5px solid #94A8B8;background:#F0F4F8;color:#5A7A8F}
    .btn-cancelar{padding:12px;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;border:1.5px solid #D6E5EE;background:#fff;color:#5A7A8F}
    .btn-confirmar-imp{padding:13px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none;background:#0F4C7A;color:#fff}

    textarea{width:100%;border-radius:10px;border:1.5px solid #D6E5EE;font-size:14px;font-family:inherit;padding:10px 12px;resize:none;height:90px;color:#111;margin-bottom:10px;background:#F7FBFD}

    .footer-bar{position:fixed;bottom:0;left:0;right:0;padding:1rem 1.25rem;background:#fff;box-shadow:0 -2px 12px rgba(30,159,217,0.12);z-index:100}
    .btn-finalizar{width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;border:none;background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 12px rgba(30,159,217,0.3)}
    .btn-finalizar:disabled{opacity:.5;cursor:not-allowed}

    .celebration{position:fixed;inset:0;background:rgba(15,75,122,0.7);z-index:300;display:flex;align-items:center;justify-content:center}
    .celebration.hidden{display:none}
    .celebration-box{background:#fff;border-radius:20px;padding:2rem 1.75rem;text-align:center;max-width:300px;margin:1rem}
    .celebration-mascote{width:110px;height:110px;border-radius:50%;margin:0 auto 1rem;object-fit:cover}
    .celebration h2{font-size:20px;font-weight:700;color:#0F4C7A;margin-bottom:6px}
    .celebration p{font-size:14px;color:#5A7A8F;margin-bottom:1.5rem}
    .celebration-btn{width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none;background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff}

    .empty{text-align:center;padding:3rem;color:#94A8B8;font-size:14px}
    .loading-msg{text-align:center;padding:3rem;color:#94A8B8;font-size:14px}
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <button class="back-btn" onclick="sair()">←</button>
    <img src="20050686-7618-4EE2-86F2-0E0E1EE012BE.png" alt="Loglife" class="header-logo"/>
    <div style="display:flex;gap:6px">
      <button class="back-btn" onclick="abrirChatRota()" title="Chat com admin" style="position:relative">💬
        <span id="chat-badge-rota" style="position:absolute;top:-3px;right:-3px;background:#DC2626;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;border:1.5px solid #1E9FD9">0</span>
      </button>
      <button class="back-btn" onclick="trocarRota()" title="Trocar de rota" id="btn-trocar-rota" style="display:none">🔄</button>
      <button class="back-btn" onclick="trocarUsuario()" title="Trocar de motoboy">👤</button>
    </div>
  </div>
  <div class="header-info">
    <img src="761B1410-BF55-4955-AD0E-BA388B9E6625.png" alt="" class="header-mascote"/>
    <div class="header-text">
      <h1 id="header-nome">Minha Rota</h1>
      <div class="sub" id="header-sub"></div>
      <div class="rota-badge" id="header-rota">—</div>
    </div>
  </div>

  <div class="abas-rotas" id="abas-rotas"></div>
</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-val" id="cnt-total">—</div><div class="stat-label">total</div></div>
  <div class="stat"><div class="stat-val primary" id="cnt-produtiva">—</div><div class="stat-label">produtivas</div></div>
  <div class="stat"><div class="stat-val muted" id="cnt-pendente">—</div><div class="stat-label">pendentes</div></div>
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="progress-label" id="progress-label">0%</div>
</div>

<div class="toolbar">
  <input class="search-bar" type="text" id="busca" placeholder="Buscar cliente..." oninput="renderizar()"/>
  <button class="filter-btn" id="filter-btn" onclick="toggleFiltro()">Pendentes</button>
</div>

<div class="lista-container">
  <div class="lista" id="lista"><div class="loading-msg">Carregando...</div></div>
</div>

<div class="footer-bar">
  <button class="btn-finalizar" id="btn-finalizar" onclick="abrirModalFinalizar()">🏁 Finalizar Rota</button>
</div>



<!-- MODAL PRODUTIVA / IMPRODUTIVA -->
<div class="modal-overlay hidden" id="modal-prod">
  <div class="modal">
    <div class="modal-cliente" id="modal-cliente-nome"></div>
    <h2>A coleta foi produtiva?</h2>
    <p style="font-size:13px;color:#5A7A8F;margin-bottom:1rem" id="modal-chegada-info"></p>
    <div class="modal-btns">
      <button class="btn-produtiva" onclick="confirmarTique('produtiva')">✓ Produtiva</button>
      <button class="btn-improdutiva" onclick="abrirModalMotivo()">✗ Improdutiva</button>
      <button class="btn-cancelar" onclick="cancelarTique()">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL MOTIVO -->
<div class="modal-overlay hidden" id="modal-motivo">
  <div class="modal">
    <div class="modal-cliente" id="modal-motivo-cliente"></div>
    <h2>Qual o motivo?</h2>
    <textarea id="motivo-texto" placeholder="Ex: Cliente fechado, sem material, endereço errado..."></textarea>
    <div class="modal-btns">
      <button class="btn-confirmar-imp" onclick="confirmarImprodutiva()">Confirmar improdutiva</button>
      <button class="btn-cancelar" onclick="voltarParaProd()">← Voltar</button>
    </div>
  </div>
</div>

<!-- MODAL TROCAR ROTA -->
<div class="modal-overlay hidden" id="modal-trocar-rota">
  <div class="modal">
    <h2>🔄 Trocar de rota</h2>
    <p style="font-size:13px;color:#5A7A8F;margin-bottom:1rem">Toque na rota para abrir:</p>
    <div id="lista-rotas-trocar" style="display:flex;flex-direction:column;gap:8px;margin-bottom:1rem"></div>
    <div class="modal-btns">
      <button class="btn-cancelar" onclick="fecharModal('modal-trocar-rota')">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL FINALIZAR -->
<div class="modal-overlay hidden" id="modal-fin">
  <div class="modal">
    <h2>Finalizar a rota?</h2>
    <p id="modal-fin-msg" style="font-size:14px;color:#5A7A8F;margin-bottom:1.25rem;line-height:1.5"></p>
    <div class="modal-btns">
      <button class="btn-produtiva" onclick="finalizarRota()">Sim, finalizar</button>
      <button class="btn-cancelar" onclick="document.getElementById('modal-fin').classList.add('hidden')">Cancelar</button>
    </div>
  </div>
</div>

<div class="celebration hidden" id="celebration">
  <div class="celebration-box">
    <img src="761B1410-BF55-4955-AD0E-BA388B9E6625.png" alt="" class="celebration-mascote"/>
    <h2>Rota finalizada! 🎉</h2>
    <p id="celebration-msg">Bom trabalho!</p>
    <button class="celebration-btn" onclick="aoFecharCelebracao()">Continuar</button>
  </div>
</div>

<script>
  const API  = 'https://confirmacaoderota.willlog99.workers.dev';
  const nome = localStorage.getItem('motoboy_nome');
  const rota = localStorage.getItem('motoboy_rota');
  const tel  = localStorage.getItem('motoboy_tel');

  if (!rota || !tel) window.location.href = 'index.html';

  document.getElementById('header-nome').textContent = nome || 'Minha Rota';
  document.getElementById('header-rota').textContent = rota || '—';
  document.getElementById('header-sub').textContent  = 'Olá, ' + (nome || '').split(' ')[0] + '!';

  // Verificar se precisa preencher checklist
  async function verificarChecklistPendente() {
    if (!tel) return;
    try {
      const r = await fetch(API + '/checklist-status?telefone=' + encodeURIComponent(tel));
      const d = await r.json();
      if (d.precisa) {
        mostrarModalChecklist();
      }
    } catch(e) {}
  }

  function mostrarModalChecklist() {
    if (document.getElementById('modal-checklist-pendente')) return;
    const modal = document.createElement('div');
    modal.id = 'modal-checklist-pendente';
    modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:999999;display:flex;align-items:center;justify-content:center;padding:1rem';
    modal.innerHTML = `
      <div style="background:#fff;border-radius:16px;padding:2rem;max-width:380px;width:100%;text-align:center">
        <div style="font-size:48px;margin-bottom:1rem">⚠️</div>
        <h2 style="color:#92400E;font-size:18px;font-weight:700;margin-bottom:10px">Checklist Obrigatório</h2>
        <p style="font-size:14px;color:#5A7A8F;margin-bottom:1.5rem;line-height:1.5">Você precisa preencher o checklist do veículo antes de continuar a rota.</p>
        <button onclick="window.location.href='confirmar.html?direto_checklist=1'" style="width:100%;padding:14px;background:linear-gradient(135deg,#F59E0B,#92400E);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(245,158,11,0.3)">📋 Preencher Checklist Agora</button>
      </div>
    `;
    document.body.appendChild(modal);
  }

  verificarChecklistPendente();
  setInterval(verificarChecklistPendente, 30000);

  let clientes = [];
  let somentePendentes = false;
  let clienteSelecionado = null;
  let todasAsRotas = [];
  let rotaAtualIdx = 0;

  function toggleFiltro() {
    somentePendentes = !somentePendentes;
    const btn = document.getElementById('filter-btn');
    btn.textContent = somentePendentes ? 'Todos' : 'Pendentes';
    btn.classList.toggle('active', somentePendentes);
    renderizar();
  }

  function fecharModal(id) { document.getElementById(id).classList.add('hidden'); clienteSelecionado = null; }

  async function carregar() {
    try {
      const r = await fetch(API + '/rota?rota=' + encodeURIComponent(rota));
      const d = await r.json();
      clientes = d.clientes || [];
      
      // Verificar se já tem coletas desse motoboy nessa rota hoje (significa que já finalizou)
      const hoje = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
      const dataFormatada = hoje.split('-').reverse().join('/');
      const historico = await fetch(API + '/historico?data=' + encodeURIComponent(dataFormatada));
      const histData = await historico.json();
      const jaFinalizou = histData.historico && histData.historico.some(h => 
        h.rota === rota && h.telefone_motoboy === tel
      );
      
      // Desabilitar botão se já finalizou
      const btnFin = document.getElementById('btn-finalizar');
      if (jaFinalizou) {
        btnFin.disabled = true;
        btnFin.textContent = '✓ Rota finalizada';
        btnFin.style.opacity = '0.5';
        btnFin.style.cursor = 'not-allowed';
      } else {
        btnFin.disabled = false;
        btnFin.textContent = '🏁 Finalizar Rota';
        btnFin.style.opacity = '1';
        btnFin.style.cursor = 'pointer';
      }
      
      renderizar();
    } catch(e) {
      document.getElementById('lista').innerHTML = `<p class="empty">Erro ao carregar.</p>`;
    }
  }





  function abrirModalProd(id) {
    const c = clientes.find(c => c.id === id);
    if (!c || c.status === 'entregue') return;
    clienteSelecionado = id;
    document.getElementById('modal-cliente-nome').textContent = c.nome;
    document.getElementById('modal-prod').classList.remove('hidden');
  }
  function cancelarTique() { clienteSelecionado = null; document.getElementById('modal-prod').classList.add('hidden'); }

  function abrirModalMotivo() {
    const c = clientes.find(c => c.id === clienteSelecionado);
    document.getElementById('modal-prod').classList.add('hidden');
    document.getElementById('modal-motivo-cliente').textContent = c ? c.nome : '';
    document.getElementById('motivo-texto').value = '';
    document.getElementById('modal-motivo').classList.remove('hidden');
    document.getElementById('motivo-texto').focus();
  }
  function voltarParaProd() { document.getElementById('modal-motivo').classList.add('hidden'); document.getElementById('modal-prod').classList.remove('hidden'); }

  async function confirmarTique(produtividade, motivo) {
    const id = clienteSelecionado;
    document.getElementById('modal-prod').classList.add('hidden');
    document.getElementById('modal-motivo').classList.add('hidden');
    clienteSelecionado = null;
    try {
      const r = await fetch(API + '/ticar', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, telefone_motoboy: tel, produtividade, motivo_improdutiva: motivo || '' })
      });
      const d = await r.json();
      if (d.status === 'ok') {
        const c = clientes.find(c => c.id === id);
        if (c) { c.status = 'entregue'; c.produtividade = produtividade; c.motivo_improdutiva = motivo || ''; c.horario_entrega = d.horario_entrega; }
        renderizar();
      }
    } catch(e) {}
  }

  async function confirmarImprodutiva() {
    const motivo = document.getElementById('motivo-texto').value.trim();
    if (!motivo) { document.getElementById('motivo-texto').style.borderColor = '#0F4C7A'; document.getElementById('motivo-texto').placeholder = 'Por favor, informe o motivo!'; return; }
    await confirmarTique('improdutiva', motivo);
  }

  function getTipoBadge(c) {
    const tipo = (c.tipo || 'normal').toLowerCase();
    if (c.status === 'entregue') {
      if (c.produtividade === 'produtiva') return `<span class="horario-badge produtiva">✓ Produtiva</span>`;
      if (c.produtividade === 'improdutiva') return `<span class="horario-badge improdutiva">✗ Improdutiva</span>`;
    }
    if (c.horario_chegada) return `<span class="horario-badge chegou">No local</span>`;
    if (tipo === 'contra pedido') return `<span class="horario-badge contra-pedido">Contra Pedido</span>`;
    if (tipo === 'sob demanda') return `<span class="horario-badge sob-demanda">Sob Demanda</span>`;
    return `<span class="horario-badge normal">${c.horario || '—'}</span>`;
  }

  function extrairHoraSaida(c) {
    if (!c.horario_entrega) return '';
    const partes = String(c.horario_entrega).split(' ');
    return partes[partes.length - 1];
  }

  function cardHTML(c) {
    const entregue = c.status === 'entregue';
    const prod = c.produtividade || '';

    let cardClass = '', btnClass = '', btnIcon = '';
    if (entregue) {
      cardClass = prod === 'improdutiva' ? 'improdutiva' : 'produtiva';
      btnClass = prod === 'improdutiva' ? 'improdutiva' : 'produtiva';
      btnIcon = prod === 'improdutiva' ? '✕' : '✓';
    }

    const horaSaida = extrairHoraSaida(c);

    return `
      <div class="cliente-card ${cardClass}" data-id="${c.id}">
        <div class="check-btn ${btnClass}">${btnIcon}</div>
        <div class="cliente-info">
          <div class="cliente-nome">${c.nome}</div>
          <div class="cliente-meta">Nº ${c.numero_cliente}</div>
          ${entregue && horaSaida ? `
            <div class="ts-info">
              <span class="ts-saida ${prod}">${prod === 'improdutiva' ? '🔘 Saída' : '🔵 Saída'}: ${horaSaida}</span>
            </div>
          ` : ''}
          ${entregue && prod === 'improdutiva' && c.motivo_improdutiva ? `<div class="motivo-txt">↳ ${c.motivo_improdutiva}</div>` : ''}
        </div>
        ${getTipoBadge(c)}
      </div>`;
  }

  function abrirModalFinalizar() {
    const pendentes = clientes.filter(c => c.status !== 'entregue').length;
    const total = clientes.length;
    if (total === 0) return;
    const msg = pendentes === 0
      ? `Todas as ${total} coletas foram registradas. Deseja finalizar a rota?`
      : `${total - pendentes} de ${total} registradas. Ainda há ${pendentes} pendente${pendentes>1?'s':''}. Ao finalizar a rota fica liberada.`;
    document.getElementById('modal-fin-msg').textContent = msg;
    document.getElementById('modal-fin').classList.remove('hidden');
  }

  async function finalizarRota() {
    document.getElementById('modal-fin').classList.add('hidden');
    const btn = document.getElementById('btn-finalizar');
    btn.disabled = true;
    btn.textContent = 'Finalizando...';
    const pendentes = clientes.filter(c => c.status !== 'entregue');
    for (const c of pendentes) {
      try {
        await fetch(API + '/ticar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id: c.id, telefone_motoboy: tel, produtividade: 'produtiva', motivo_improdutiva: '' }) });
        c.status = 'entregue'; c.produtividade = 'produtiva';
        c.horario_entrega = new Date().toLocaleString('pt-BR', { timeZone:'America/Sao_Paulo', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
      } catch(e) {}
    }
    try { await fetch(API + '/finalizar-rota', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ telefone: tel, rota }) }); } catch(e) {}
    renderizar();
    
    // Deixar botão permanentemente desabilitado
    btn.disabled = true;
    btn.textContent = '✓ Rota finalizada';
    btn.style.opacity = '0.5';
    btn.style.cursor = 'not-allowed';
    
    const total = clientes.length;
    document.getElementById('celebration-msg').textContent = `${total} coleta${total>1?'s':''} registrada${total>1?'s':''}. Rota liberada!`;
    document.getElementById('celebration').classList.remove('hidden');
  }

  function aoFecharCelebracao() {
    localStorage.removeItem('motoboy_nome');
    localStorage.removeItem('motoboy_rota');
    localStorage.removeItem('motoboy_tel');
    window.location.href = 'index.html';
  }

  function renderizar() {
    const busca = (document.getElementById('busca').value || '').toLowerCase();
    const entregues  = clientes.filter(c => c.status === 'entregue');
    const produtivas = clientes.filter(c => c.produtividade === 'produtiva');
    const pendentes  = clientes.filter(c => c.status !== 'entregue');
    document.getElementById('cnt-total').textContent     = clientes.length;
    document.getElementById('cnt-produtiva').textContent = produtivas.length;
    document.getElementById('cnt-pendente').textContent  = pendentes.length;
    const pct = clientes.length ? Math.round(entregues.length / clientes.length * 100) : 0;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-label').textContent = pct + '% concluído';
    const btnFin = document.getElementById('btn-finalizar');
    btnFin.innerHTML = pct === 100 ? '✓ Rota 100% — Finalizar' : `🏁 Finalizar Rota (${pendentes.length} pendente${pendentes.length!==1?'s':''})`;
    btnFin.disabled = clientes.length === 0;
    let fonte = somentePendentes ? pendentes : clientes;
    if (busca) fonte = fonte.filter(c => c.nome.toLowerCase().includes(busca) || c.numero_cliente.toLowerCase().includes(busca));
    if (fonte.length === 0) { document.getElementById('lista').innerHTML = `<p class="empty">${busca ? 'Nenhum cliente encontrado.' : somentePendentes ? '🎉 Todas as coletas registradas!' : 'Nenhum cliente nesta rota.'}</p>`; return; }
    const pendFiltrados = fonte.filter(c => c.status !== 'entregue');
    const entrFiltrados = fonte.filter(c => c.status === 'entregue');
    let html = '';
    if (pendFiltrados.length > 0) { if (!somentePendentes && entrFiltrados.length > 0) html += `<div class="section-title">Pendentes (${pendFiltrados.length})</div>`; html += pendFiltrados.map(c => cardHTML(c)).join(''); }
    if (entrFiltrados.length > 0) { html += `<div class="section-title">Registradas (${entrFiltrados.length})</div>`; html += entrFiltrados.map(c => cardHTML(c)).join(''); }
    document.getElementById('lista').innerHTML = html;

    document.querySelectorAll('.cliente-card').forEach(card => {
      card.addEventListener('click', () => {
        const id = parseInt(card.dataset.id);
        const c = clientes.find(c => c.id === id);
        if (!c || c.status === 'entregue') return;
        abrirModalProd(id);
      });
    });
  }

  async function sair() {
    if (!confirm('Sair desta rota? Ela continua reservada para você. Quando voltar, abre direto nela.')) return;
    window.location.href = 'index.html';
  }

  function trocarUsuario() {
    if (!confirm('Trocar de motoboy? Sua sessão será encerrada.')) return;
    localStorage.removeItem('motoboy_nome');
    localStorage.removeItem('motoboy_rota');
    localStorage.removeItem('motoboy_tel');
    window.location.href = 'index.html#trocar';
  }

  async function verificarOutrasRotas() {
    try {
      const r = await fetch(API + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telefone: tel })
      });
      const d = await r.json();
      if (d.status === 'ok') {
        todasAsRotas = (d.rotas_info || []).filter(r => r.status !== 'travada');
        if (todasAsRotas.length > 1) {
          document.getElementById('btn-trocar-rota').style.display = 'flex';
          renderizarAbas();
        }
      }
    } catch(e) {}
  }

  function renderizarAbas() {
    const abas = document.getElementById('abas-rotas');
    abas.innerHTML = todasAsRotas.map((r, idx) => {
      const ativa = r.rota === rota ? 'ativa' : '';
      return `<button class="aba-rota ${ativa}" onclick="mudarRota(${idx})">${r.rota}</button>`;
    }).join('');
  }

  let mudandoRota = false; // Flag para evitar múltiplos cliques simultâneos

  async function mudarRota(idx) {
    if (mudandoRota) return; // Impede múltiplos cliques
    if (idx === rotaAtualIdx) return;
    
    mudandoRota = true;
    rotaAtualIdx = idx;
    const novaRota = todasAsRotas[idx].rota;
    
    document.getElementById('lista').style.animation = 'none';
    setTimeout(() => {
      document.getElementById('lista').style.animation = 'flipIn .6s ease forwards';
    }, 10);
    
    localStorage.setItem('motoboy_rota', novaRota);
    document.getElementById('header-rota').textContent = novaRota;
    document.getElementById('lista').innerHTML = '<div class="loading-msg">Carregando...</div>';
    
    let tentativas = 0;
    const maxTentativas = 3;
    
    while (tentativas < maxTentativas) {
      try {
        const r = await fetch(API + '/rota?rota=' + encodeURIComponent(novaRota));
        if (!r.ok) throw new Error('Status ' + r.status);
        const d = await r.json();
        if (!d.clientes) throw new Error('Sem clientes');
        
        clientes = d.clientes || [];
        renderizar();
        
        // Renderizar abas sem erro
        try {
          renderizarAbas();
        } catch(e) {
          console.warn('Erro ao renderizar abas:', e);
        }
        
        mudandoRota = false;
        return;
      } catch(e) {
        tentativas++;
        if (tentativas < maxTentativas) {
          await new Promise(resolve => setTimeout(resolve, 500)); // Aguarda 500ms antes de retry
        }
      }
    }
    
    // Se falhar todas as tentativas
    document.getElementById('lista').innerHTML = '<p class="empty">Erro ao carregar rota. Tente novamente.</p>';
    mudandoRota = false;
  }

  async function trocarRota() {
    document.getElementById('modal-trocar-rota').classList.remove('hidden');
  }

  async function abrirOutraRota(novaRota) {
    document.getElementById('modal-trocar-rota').classList.add('hidden');
    const idx = todasAsRotas.findIndex(r => r.rota === novaRota);
    if (idx >= 0) mudarRota(idx);
  }

  async function verificarChecklistAoAbrir() {
    if (!nome) return;
    try {
      const r = await fetch(API + '/checklist/verificar?nome=' + encodeURIComponent(nome));
      const d = await r.json();
      if (d.precisa_preencher) {
        alert('⚠️ Você precisa preencher seu checklist antes de continuar!');
        window.location.href = 'confirmar.html?checklist_obrigatorio=true';
      }
    } catch(e) {}
  }

  // Chama ao carregar
  setTimeout(verificarChecklistAoAbrir, 1500);

  carregar();
  verificarOutrasRotas();

  // Auto-refresh a cada 8 segundos
  setInterval(() => {
    const algumModalAberto = 
      !document.getElementById('modal-prod').classList.contains('hidden') ||
      !document.getElementById('modal-motivo').classList.contains('hidden') ||
      !document.getElementById('modal-fin').classList.contains('hidden');
    if (!algumModalAberto) carregar();
  }, 2000);
</script>
<!-- CHAT OVERLAY ROTA -->
<div id="chat-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#F0F4F8;z-index:99999;flex-direction:column">
  <div style="background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px">
    <button onclick="fecharChatRota()" style="background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0 4px">←</button>
    <div>
      <div style="font-size:15px;font-weight:700">Admin Loglife</div>
      <div style="font-size:11px;opacity:.9">● Online</div>
    </div>
  </div>
  <div id="chat-rota-msgs" style="flex:1;overflow-y:auto;padding:14px;background:#F7FBFD;display:flex;flex-direction:column">
    <div style="margin:auto;text-align:center;color:#94A8B8;font-size:13px">Carregando...</div>
  </div>
  <div style="padding:10px;background:#fff;border-top:1px solid #EBF1F5;display:flex;gap:8px">
    <input id="chat-rota-input" placeholder="Mensagem..." style="flex:1;padding:10px 14px;border-radius:20px;border:1.5px solid #D6E5EE;font-size:14px;outline:none" onkeydown="if(event.key==='Enter') enviarChatRota()"/>
    <button onclick="enviarChatRota()" style="padding:0 18px;border-radius:20px;border:none;background:#1E9FD9;color:#fff;font-weight:600;cursor:pointer">➤</button>
  </div>
</div>

<script>
  let chatRotaInterval = null;
  let chatRotaTotal = 0;
  
  function tocarSomChatRota() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 520;
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      o.start(ctx.currentTime);
      o.stop(ctx.currentTime + 0.3);
    } catch(e) {}
  }
  chatRotaSom.volume = 0.5;
  
  async function carregarChatRota() {
    if (!tel) return;
    try {
      const r = await fetch(API + '/chat/mensagens?telefone=' + encodeURIComponent(tel));
      const d = await r.json();
      const msgs = d.mensagens || [];
      
      if (!msgs.length) {
        document.getElementById('chat-rota-msgs').innerHTML = '<div style="margin:auto;text-align:center;color:#94A8B8;font-size:13px">Envie uma mensagem para o admin</div>';
        return;
      }
      
      document.getElementById('chat-rota-msgs').innerHTML = msgs.map(m => {
        const eu = m.remetente === 'motoboy';
        const hora = new Date(m.timestamp).toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit' });
        return `<div style="margin-bottom:10px;display:flex;${eu ? 'justify-content:flex-end' : ''}">
          <div>
            <div style="max-width:75%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.4;${eu ? 'background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff;border-bottom-right-radius:4px' : 'background:#fff;color:#0F4C7A;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,0.06)'}">${m.mensagem.replace(/</g,'&lt;')}</div>
            <div style="font-size:10px;color:#94A8B8;margin-top:4px;${eu ? 'text-align:right' : ''}">${hora}</div>
          </div>
        </div>`;
      }).join('');
      
      const msgs_div = document.getElementById('chat-rota-msgs');
      msgs_div.scrollTop = msgs_div.scrollHeight;
    } catch(e) {}
  }
  
  async function enviarChatRota() {
    const input = document.getElementById('chat-rota-input');
    const texto = input.value.trim();
    if (!texto || !tel) return;
    input.value = '';
    
    try {
      await fetch(API + '/chat/enviar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          telefone_motoboy: tel,
          nome_motoboy: nome || '',
          remetente: 'motoboy',
          mensagem: texto
        })
      });
      await carregarChatRota();
    } catch(e) {
      input.value = texto;
    }
  }
  
  async function atualizarBadgeRota() {
    if (!tel) return;
    try {
      const r = await fetch(API + '/chat/nao-lidas?telefone=' + encodeURIComponent(tel));
      const d = await r.json();
      const total = d.total || 0;
      const badge = document.getElementById('chat-badge-rota');
      if (total > 0) {
        badge.textContent = total > 99 ? '99+' : total;
        badge.style.display = 'flex';
        
        if (total > chatRotaTotal && chatRotaTotal >= 0) {
          tocarSomChatRota();
        }
        chatRotaTotal = total;
      } else {
        badge.style.display = 'none';
        chatRotaTotal = 0;
      }
    } catch(e) {}
  }
  
  function abrirChatRota() {
    document.getElementById('chat-overlay').style.display = 'flex';
    carregarChatRota();
    
    // Marcar como lidas
    fetch(API + '/chat/marcar-lido', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ telefone_motoboy: tel, remetente: 'admin' })
    });
    
    if (!chatRotaInterval) {
      chatRotaInterval = setInterval(carregarChatRota, 5000);
    }
    setTimeout(atualizarBadgeRota, 500);
  }
  
  function fecharChatRota() {
    document.getElementById('chat-overlay').style.display = 'none';
    if (chatRotaInterval) {
      clearInterval(chatRotaInterval);
      chatRotaInterval = null;
    }
  }
  
  // Escuta sinal de refresh do admin
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data && e.data.type === 'RELOAD') {
        alert('🔄 O administrador enviou uma atualização. O app será recarregado.');
        window.location.reload();
      }
    });
  }
  try {
    const bc = new BroadcastChannel('loglife_refresh');
    bc.onmessage = e => {
      if (e.data && e.data.type === 'RELOAD') {
        alert('🔄 O administrador enviou uma atualização. O app será recarregado.');
        window.location.reload();
      }
    };
  } catch(e) {}

  // Verificar flag de refresh do admin a cada 10s
  let ultimaFlagVista = null;
  async function verificarRefreshFlag() {
    try {
      const r = await fetch(API + '/refresh-flag');
      const d = await r.json();
      if (!d.flag) return;
      if (ultimaFlagVista === null) {
        ultimaFlagVista = d.flag;
        return;
      }
      if (d.flag !== ultimaFlagVista) {
        ultimaFlagVista = d.flag;
        alert('🔄 O administrador enviou uma atualização. O app será recarregado.');
        await limparCacheERecarregar();
      }
    } catch(e) {}
  }

  async function limparCacheERecarregar() {
    try {
      // Limpar todos os caches
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
      // Desregistrar Service Workers
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
    } catch(e) {}
    window.location.reload(true);
  }

  setInterval(verificarRefreshFlag, 10000);
  setTimeout(verificarRefreshFlag, 2000);

  setInterval(atualizarBadgeRota, 10000);
  setTimeout(atualizarBadgeRota, 2000);
</script>
