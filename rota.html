<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minha Rota</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;padding:0 0 6rem}

    .header{background:linear-gradient(135deg,#1D9E75,#0d7a5a);padding:1.25rem 1.25rem 1.5rem;color:#fff}
    .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
    .back-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
    .header-info h1{font-size:19px;font-weight:700;margin-bottom:2px}
    .header-info .sub{font-size:13px;opacity:.8}
    .rota-badge{display:inline-block;background:rgba(255,255,255,0.2);padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600}

    .stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:1rem 1.25rem 0}
    .stat{background:#fff;border-radius:12px;padding:11px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
    .stat-val{font-size:22px;font-weight:700;color:#111}
    .stat-val.green{color:#0F6E56}
    .stat-val.orange{color:#B45309}
    .stat-label{font-size:11px;color:#888;margin-top:1px}

    .progress-wrap{padding:.75rem 1.25rem 0}
    .progress-bar{background:#e2e8f0;border-radius:99px;height:6px;overflow:hidden}
    .progress-fill{background:linear-gradient(90deg,#1D9E75,#0d7a5a);height:100%;border-radius:99px;transition:width .4s ease}
    .progress-label{font-size:12px;color:#888;text-align:right;margin-top:4px}

    .toolbar{padding:.75rem 1.25rem 0;display:flex;gap:8px}
    .search-bar{flex:1;background:#fff;border-radius:10px;border:1.5px solid #e2e8f0;height:40px;padding:0 12px;font-size:14px;color:#111}
    .search-bar:focus{outline:none;border-color:#1D9E75}
    .filter-btn{height:40px;padding:0 14px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;font-size:13px;font-weight:500;color:#666;cursor:pointer;white-space:nowrap}
    .filter-btn.active{background:#E1F5EE;color:#085041;border-color:#5DCAA5}

    .lista{padding:.75rem 1.25rem 0}
    .section-title{font-size:12px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.6rem;margin-top:.5rem}

    .cliente-card{background:#fff;border-radius:14px;padding:.9rem 1rem;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:all .2s}
    .cliente-card.produtiva{background:#f6fdf9;border:1.5px solid #b8edd6}
    .cliente-card.improdutiva{background:#fff8f8;border:1.5px solid #ffc5c5}
    .cliente-card.produtiva .cliente-nome,.cliente-card.improdutiva .cliente-nome{text-decoration:line-through;color:#aaa}

    .check-btn{width:36px;height:36px;border-radius:10px;border:2px solid #e2e8f0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .2s;font-size:18px}
    .check-btn:hover:not(.produtiva):not(.improdutiva){border-color:#1D9E75}
    .check-btn.produtiva{background:#1D9E75;border-color:#1D9E75;color:#fff;cursor:not-allowed}
    .check-btn.improdutiva{background:#EF4444;border-color:#EF4444;color:#fff;cursor:not-allowed}
    .check-btn.loading{opacity:.5;cursor:not-allowed;pointer-events:none}

    .cliente-info{flex:1;min-width:0}
    .cliente-nome{font-size:15px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cliente-meta{font-size:12px;color:#aaa;margin-top:2px}
    .entrega-ts{font-size:11px;font-weight:500;margin-top:3px}
    .entrega-ts.produtiva{color:#1D9E75}
    .entrega-ts.improdutiva{color:#EF4444}
    .motivo-txt{font-size:11px;color:#EF4444;margin-top:2px;font-style:italic}

    .horario-badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:7px;white-space:nowrap;flex-shrink:0}
    .horario-badge.normal{background:#f0f4f8;color:#555}
    .horario-badge.produtiva{background:#E1F5EE;color:#085041}
    .horario-badge.improdutiva{background:#FCEBEB;color:#791F1F}
    .horario-badge.contra-pedido{background:#EDE9FE;color:#5B21B6}
    .horario-badge.sob-demanda{background:#FEF3C7;color:#92400E}

    /* MODAIS */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
    .modal-overlay.hidden{display:none}
    .modal{background:#fff;border-radius:20px 20px 0 0;padding:1.75rem 1.5rem 2rem;width:100%;max-width:480px;animation:slideUp .25s ease}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(40px)}to{transform:translateY(0)}}
    .modal-cliente{font-size:13px;color:#aaa;margin-bottom:4px}
    .modal h2{font-size:18px;font-weight:700;color:#111;margin-bottom:1.25rem}
    .modal-btns{display:flex;flex-direction:column;gap:10px}
    .btn-produtiva{padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:1.5px solid #5DCAA5;background:#E1F5EE;color:#085041;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-produtiva:hover{background:#c8f0e0}
    .btn-improdutiva{padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:1.5px solid #F09595;background:#FCEBEB;color:#791F1F;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-improdutiva:hover{background:#fad5d5}
    .btn-cancelar{padding:12px;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;border:1.5px solid #e2e8f0;background:#fff;color:#888}
    .btn-confirmar-imp{padding:13px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none;background:#EF4444;color:#fff}
    .btn-confirmar-imp:disabled{opacity:.5;cursor:not-allowed}

    textarea{width:100%;border-radius:10px;border:1.5px solid #e2e8f0;font-size:14px;font-family:inherit;padding:10px 12px;resize:none;height:90px;color:#111;margin-bottom:10px}
    textarea:focus{outline:none;border-color:#EF4444}

    .footer-bar{position:fixed;bottom:0;left:0;right:0;padding:1rem 1.25rem;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,0.08);z-index:100}
    .btn-finalizar{width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;border:none;background:linear-gradient(135deg,#1D9E75,#0d7a5a);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s}
    .btn-finalizar:hover{opacity:.9}
    .btn-finalizar:disabled{opacity:.5;cursor:not-allowed}
    .btn-finalizar.concluida{background:linear-gradient(135deg,#6366f1,#4f46e5)}

    .celebration{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;display:flex;align-items:center;justify-content:center}
    .celebration.hidden{display:none}
    .celebration-box{background:#fff;border-radius:20px;padding:2rem 1.75rem;text-align:center;max-width:300px;margin:1rem}
    .celebration-icon{font-size:56px;margin-bottom:.75rem}
    .celebration h2{font-size:20px;font-weight:700;color:#111;margin-bottom:6px}
    .celebration p{font-size:14px;color:#777;margin-bottom:1.5rem}
    .celebration-btn{width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none;background:linear-gradient(135deg,#1D9E75,#0d7a5a);color:#fff}

    .empty{text-align:center;padding:3rem;color:#ccc;font-size:14px}
    .loading-msg{text-align:center;padding:3rem;color:#aaa;font-size:14px}
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <button class="back-btn" onclick="sair()">←</button>
    <div class="rota-badge" id="header-rota">—</div>
    <div style="width:36px"></div>
  </div>
  <div class="header-info">
    <h1 id="header-nome">Minha Rota</h1>
    <div class="sub" id="header-sub"></div>
  </div>
</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-val" id="cnt-total">—</div><div class="stat-label">total</div></div>
  <div class="stat"><div class="stat-val green" id="cnt-produtiva">—</div><div class="stat-label">produtivas</div></div>
  <div class="stat"><div class="stat-val orange" id="cnt-pendente">—</div><div class="stat-label">pendentes</div></div>
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="progress-label" id="progress-label">0%</div>
</div>

<div class="toolbar">
  <input class="search-bar" type="text" id="busca" placeholder="Buscar cliente..." oninput="renderizar()"/>
  <button class="filter-btn" id="filter-btn" onclick="toggleFiltro()">Pendentes</button>
</div>

<div class="lista" id="lista">
  <div class="loading-msg">Carregando...</div>
</div>

<div class="footer-bar">
  <button class="btn-finalizar" id="btn-finalizar" onclick="abrirModalFinalizar()">🏁 Finalizar Rota</button>
</div>

<!-- MODAL PRODUTIVIDADE -->
<div class="modal-overlay hidden" id="modal-prod">
  <div class="modal">
    <div class="modal-cliente" id="modal-cliente-nome"></div>
    <h2>A coleta foi produtiva?</h2>
    <div class="modal-btns">
      <button class="btn-produtiva" onclick="confirmarTique('produtiva')">✅ Produtiva</button>
      <button class="btn-improdutiva" onclick="abrirModalMotivo()">❌ Improdutiva</button>
      <button class="btn-cancelar" onclick="cancelarTique()">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL MOTIVO IMPRODUTIVA -->
<div class="modal-overlay hidden" id="modal-motivo">
  <div class="modal">
    <div class="modal-cliente" id="modal-motivo-cliente"></div>
    <h2>Qual o motivo?</h2>
    <textarea id="motivo-texto" placeholder="Ex: Cliente fechado, sem material, endereço errado..."></textarea>
    <div class="modal-btns">
      <button class="btn-confirmar-imp" id="btn-confirmar-imp" onclick="confirmarImprodutiva()">Confirmar improdutiva</button>
      <button class="btn-cancelar" onclick="voltarParaProd()">← Voltar</button>
    </div>
  </div>
</div>

<!-- MODAL FINALIZAR -->
<div class="modal-overlay hidden" id="modal-fin">
  <div class="modal">
    <h2>Finalizar a rota?</h2>
    <p id="modal-fin-msg"></p>
    <div class="modal-btns" style="margin-top:1.25rem">
      <button class="btn-produtiva" onclick="finalizarRota()">Sim, finalizar</button>
      <button class="btn-cancelar" onclick="document.getElementById('modal-fin').classList.add('hidden')">Cancelar</button>
    </div>
  </div>
</div>

<!-- CELEBRAÇÃO -->
<div class="celebration hidden" id="celebration">
  <div class="celebration-box">
    <div class="celebration-icon">🎉</div>
    <h2>Rota finalizada!</h2>
    <p id="celebration-msg">Bom trabalho!</p>
    <button class="celebration-btn" onclick="document.getElementById('celebration').classList.add('hidden')">Continuar</button>
  </div>
</div>

<script>
  const API  = 'https://confirmacaoderota.willlog99.workers.dev';
  const nome = localStorage.getItem('motoboy_nome');
  const rota = localStorage.getItem('motoboy_rota');
  const tel  = localStorage.getItem('motoboy_tel');

  if (!rota || !tel) window.location.href = 'index.html';

  document.getElementById('header-nome').textContent = nome || 'Minha Rota';
  document.getElementById('header-rota').textContent = rota || '—';
  document.getElementById('header-sub').textContent  = 'Olá, ' + (nome || '') + '!';

  let clientes = [];
  let somentePendentes = false;
  let clienteSelecionado = null;

  function toggleFiltro() {
    somentePendentes = !somentePendentes;
    const btn = document.getElementById('filter-btn');
    btn.textContent = somentePendentes ? 'Todos' : 'Pendentes';
    btn.classList.toggle('active', somentePendentes);
    renderizar();
  }

  async function carregar() {
    try {
      const r = await fetch(API + '/rota?rota=' + encodeURIComponent(rota));
      const d = await r.json();
      clientes = d.clientes || [];
      renderizar();
    } catch(e) {
      document.getElementById('lista').innerHTML = `<p class="empty">Erro ao carregar. Verifique sua conexão.</p>`;
    }
  }

  function abrirModalProd(id) {
    const c = clientes.find(c => c.id === id);
    if (!c || c.status === 'entregue') return;
    clienteSelecionado = id;
    document.getElementById('modal-cliente-nome').textContent = c.nome;
    document.getElementById('modal-prod').classList.remove('hidden');
  }

  function cancelarTique() {
    clienteSelecionado = null;
    document.getElementById('modal-prod').classList.add('hidden');
  }

  function abrirModalMotivo() {
    const c = clientes.find(c => c.id === clienteSelecionado);
    document.getElementById('modal-prod').classList.add('hidden');
    document.getElementById('modal-motivo-cliente').textContent = c ? c.nome : '';
    document.getElementById('motivo-texto').value = '';
    document.getElementById('modal-motivo').classList.remove('hidden');
    document.getElementById('motivo-texto').focus();
  }

  function voltarParaProd() {
    document.getElementById('modal-motivo').classList.add('hidden');
    document.getElementById('modal-prod').classList.remove('hidden');
  }

  async function confirmarTique(produtividade, motivo) {
    const id = clienteSelecionado;
    document.getElementById('modal-prod').classList.add('hidden');
    document.getElementById('modal-motivo').classList.add('hidden');
    clienteSelecionado = null;

    const btn = document.querySelector(`.check-btn[data-id="${id}"]`);
    if (btn) btn.classList.add('loading');

    try {
      const r = await fetch(API + '/ticar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, telefone_motoboy: tel, produtividade, motivo_improdutiva: motivo || '' })
      });
      const d = await r.json();
      if (d.status === 'ok') {
        const c = clientes.find(c => c.id === id);
        if (c) {
          c.status = 'entregue';
          c.produtividade = produtividade;
          c.motivo_improdutiva = motivo || '';
          c.horario_entrega = d.horario_entrega;
        }
        renderizar();
      }
    } catch(e) { if (btn) btn.classList.remove('loading'); }
  }

  async function confirmarImprodutiva() {
    const motivo = document.getElementById('motivo-texto').value.trim();
    if (!motivo) {
      document.getElementById('motivo-texto').style.borderColor = '#EF4444';
      document.getElementById('motivo-texto').placeholder = 'Por favor, informe o motivo!';
      return;
    }
    await confirmarTique('improdutiva', motivo);
  }

  function getTipoBadge(c) {
    const tipo = (c.tipo || 'normal').toLowerCase();
    if (c.status === 'entregue') {
      if (c.produtividade === 'produtiva')   return `<span class="horario-badge produtiva">✅ Produtiva</span>`;
      if (c.produtividade === 'improdutiva') return `<span class="horario-badge improdutiva">❌ Improdutiva</span>`;
    }
    if (tipo === 'contra pedido') return `<span class="horario-badge contra-pedido">Contra Pedido</span>`;
    if (tipo === 'sob demanda')   return `<span class="horario-badge sob-demanda">Sob Demanda</span>`;
    return `<span class="horario-badge normal">${c.horario || '—'}</span>`;
  }

  function cardHTML(c) {
    const entregue = c.status === 'entregue';
    const prod = c.produtividade || '';
    const cardClass = entregue ? (prod === 'improdutiva' ? 'improdutiva' : 'produtiva') : '';
    const btnClass  = entregue ? (prod === 'improdutiva' ? 'improdutiva' : 'produtiva') : '';
    const btnIcon   = entregue ? (prod === 'improdutiva' ? '✕' : '✓') : '';
    return `
      <div class="cliente-card ${cardClass}">
        <button class="check-btn ${btnClass}" data-id="${c.id}">${btnIcon}</button>
        <div class="cliente-info">
          <div class="cliente-nome">${c.nome}</div>
          <div class="cliente-meta">Nº ${c.numero_cliente}</div>
          ${entregue && c.horario_entrega ? `<div class="entrega-ts ${prod}">${prod === 'improdutiva' ? '❌ Improdutiva' : '✅ Produtiva'} às ${c.horario_entrega}</div>` : ''}
          ${entregue && prod === 'improdutiva' && c.motivo_improdutiva ? `<div class="motivo-txt">↳ ${c.motivo_improdutiva}</div>` : ''}
        </div>
        ${getTipoBadge(c)}
      </div>`;
  }

  function abrirModalFinalizar() {
    const pendentes = clientes.filter(c => c.status !== 'entregue').length;
    const total = clientes.length;
    if (total === 0) return;
    const msg = pendentes === 0
      ? `Todas as ${total} coletas foram registradas. Deseja finalizar a rota?`
      : `${total - pendentes} de ${total} registradas. Ainda há ${pendentes} pendente${pendentes>1?'s':''}. Deseja finalizar mesmo assim?`;
    document.getElementById('modal-fin-msg').textContent = msg;
    document.getElementById('modal-fin').classList.remove('hidden');
  }

  async function finalizarRota() {
    document.getElementById('modal-fin').classList.add('hidden');
    const btn = document.getElementById('btn-finalizar');
    btn.disabled = true;
    btn.textContent = 'Finalizando...';
    const pendentes = clientes.filter(c => c.status !== 'entregue');
    for (const c of pendentes) {
      try {
        await fetch(API + '/ticar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: c.id, telefone_motoboy: tel, produtividade: 'produtiva', motivo_improdutiva: '' })
        });
        c.status = 'entregue';
        c.produtividade = 'produtiva';
        c.horario_entrega = new Date().toLocaleString('pt-BR', { timeZone:'America/Sao_Paulo', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
      } catch(e) {}
    }
    renderizar();
    const total = clientes.length;
    document.getElementById('celebration-msg').textContent = `${total} coleta${total>1?'s':''} registrada${total>1?'s':''}. Bom trabalho!`;
    document.getElementById('celebration').classList.remove('hidden');
  }

  function renderizar() {
    const busca = (document.getElementById('busca').value || '').toLowerCase();
    const entregues  = clientes.filter(c => c.status === 'entregue');
    const produtivas = clientes.filter(c => c.produtividade === 'produtiva');
    const pendentes  = clientes.filter(c => c.status !== 'entregue');

    document.getElementById('cnt-total').textContent     = clientes.length;
    document.getElementById('cnt-produtiva').textContent = produtivas.length;
    document.getElementById('cnt-pendente').textContent  = pendentes.length;

    const pct = clientes.length ? Math.round(entregues.length / clientes.length * 100) : 0;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-label').textContent = pct + '% concluído';

    const btnFin = document.getElementById('btn-finalizar');
    if (pct === 100) {
      btnFin.classList.add('concluida');
      btnFin.innerHTML = '✅ Rota 100% — Finalizar';
    } else {
      btnFin.classList.remove('concluida');
      btnFin.innerHTML = `🏁 Finalizar Rota (${pendentes.length} pendente${pendentes.length!==1?'s':''})`;
    }
    btnFin.disabled = clientes.length === 0;

    let fonte = somentePendentes ? pendentes : clientes;
    if (busca) fonte = fonte.filter(c =>
      c.nome.toLowerCase().includes(busca) || c.numero_cliente.toLowerCase().includes(busca)
    );

    if (fonte.length === 0) {
      document.getElementById('lista').innerHTML = `<p class="empty">${busca ? 'Nenhum cliente encontrado.' : somentePendentes ? '🎉 Todas as coletas registradas!' : 'Nenhum cliente nesta rota.'}</p>`;
      return;
    }

    const pendFiltrados = fonte.filter(c => c.status !== 'entregue');
    const entrFiltrados = fonte.filter(c => c.status === 'entregue');
    let html = '';
    if (pendFiltrados.length > 0) {
      if (!somentePendentes && entrFiltrados.length > 0) html += `<div class="section-title">Pendentes (${pendFiltrados.length})</div>`;
      html += pendFiltrados.map(c => cardHTML(c)).join('');
    }
    if (entrFiltrados.length > 0) {
      html += `<div class="section-title">Registradas (${entrFiltrados.length})</div>`;
      html += entrFiltrados.map(c => cardHTML(c)).join('');
    }

    document.getElementById('lista').innerHTML = html;

    document.querySelectorAll('.check-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = parseInt(btn.dataset.id);
        const jaEntregue = btn.classList.contains('produtiva') || btn.classList.contains('improdutiva');
        if (!jaEntregue) abrirModalProd(id);
      });
    });
  }

  function sair() {
    if (!confirm('Deseja sair da rota? Você precisará fazer login novamente.')) return;
    localStorage.removeItem('motoboy_nome');
    localStorage.removeItem('motoboy_rota');
    localStorage.removeItem('motoboy_tel');
    window.location.href = 'index.html';
  }

  carregar();
</script>
</body>
</html>
