<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loglife — Exportar</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0F4F8;min-height:100vh;padding:2rem 1rem}
    .container{width:100%;max-width:700px;margin:0 auto}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#5A7A8F;cursor:pointer;margin-bottom:1.5rem;text-decoration:none;font-weight:500}
    .card{background:#fff;border-radius:16px;padding:2rem;box-shadow:0 4px 20px rgba(30,159,217,0.12);margin-bottom:1.5rem}
    h2{font-size:18px;font-weight:700;color:#0F4C7A;margin-bottom:.5rem}
    .subtitle{font-size:13px;color:#5A7A8F;margin-bottom:1.5rem}
    .field{margin-bottom:1.25rem}
    label{font-size:12px;color:#0F4C7A;font-weight:600;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
    select,input{width:100%;height:42px;border-radius:10px;border:1.5px solid #D6E5EE;font-size:14px;padding:0 12px;color:#111;background:#F7FBFD;cursor:pointer}
    select:focus,input:focus{outline:none;border-color:#1E9FD9;background:#fff}
    .btn{width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff;margin-bottom:8px;box-shadow:0 4px 12px rgba(30,159,217,0.2)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-pdf{background:linear-gradient(135deg,#DC2626,#991B1B)}
    .msg{border-radius:10px;padding:11px 14px;font-size:13px;text-align:center;margin-top:1rem;display:none;font-weight:500}
    .msg.success{background:#E1F5EE;color:#085041;border:1.5px solid #5DCAA5;display:block}
    .msg.error{background:#FCEBEB;color:#791F1F;border:1.5px solid #F09595;display:block}
    .msg.loading{background:#E8F4FB;color:#0F4C7A;border:1.5px solid #BFE0F0;display:block}
    .info{font-size:12px;color:#5A7A8F;padding:10px;background:#F7FBFD;border-radius:8px;border-left:3px solid #1E9FD9;margin-top:1rem;line-height:1.6}

    @media print {
      body { background: white; padding: 0; }
      .no-print { display: none !important; }
      .print-area { display: block !important; }
    }
    .print-area { display: none; }
  </style>
</head>
<body>
<div class="container no-print">
  <a class="back-link" href="painel.html">← Voltar</a>

  <!-- EXPORTAR IHP -->
  <div class="card">
    <h2>📊 Exportar Planilha IHP</h2>
    <p class="subtitle">Gere relatório com dados de coletas e atrasos</p>
    <div class="field">
      <label>Selecione o dia</label>
      <select id="sel-dia-ihp"><option value="">Carregando...</option></select>
    </div>
    <button class="btn" onclick="exportarIHP()">📥 Gerar planilha IHP</button>
    <div class="msg" id="msg-ihp"></div>
    <div class="info">ℹ️ Aba <strong>IHP</strong> — dados de coletas · Aba <strong>Atrasos</strong> — clientes em vermelho</div>
  </div>

  <!-- EXPORTAR CHECKLIST PDF -->
  <div class="card">
    <h2>📋 Exportar Checklist em PDF</h2>
    <p class="subtitle">Selecione a rota e o dia para baixar o checklist</p>
    <div class="field">
      <label>Rota</label>
      <select id="sel-rota-pdf"><option value="">Carregando...</option></select>
    </div>
    <div class="field">
      <label>Data</label>
      <input type="date" id="sel-data-pdf"/>
    </div>
    <button class="btn btn-pdf" onclick="exportarChecklistPDF()">📄 Gerar PDF do Checklist</button>
    <div class="msg" id="msg-pdf"></div>
  </div>
</div>

<!-- ÁREA DE IMPRESSÃO DO CHECKLIST -->
<div class="print-area" id="print-area"></div>

<script>
  const API = 'https://confirmacaoderota.willlog99.workers.dev';

  window.addEventListener('load', async () => {
    await carregarDias();
    await carregarRotas();
    // Data padrão = hoje
    const hoje = new Date().toISOString().split('T')[0];
    document.getElementById('sel-data-pdf').value = hoje;
  });

  async function carregarDias() {
    try {
      const sel = document.getElementById('sel-dia-ihp');
      const hoje = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
      
      // Gerar últimos 30 dias
      const dias = [];
      for (let i = 0; i < 30; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        dias.push(d.toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }));
      }
      
      sel.innerHTML = dias.map(d => `<option value="${d}"${d === hoje ? ' selected' : ''}>${d}</option>`).join('');
    } catch(e) {
      document.getElementById('sel-dia-ihp').innerHTML = '<option value="">Erro ao carregar</option>';
    }
  }

  async function carregarRotas() {
    try {
      const r = await fetch(API + '/rotas-disponiveis?todos_dias=1');
      const d = await r.json();
      const rotas = d.rotas || [];
      const sel = document.getElementById('sel-rota-pdf');
      sel.innerHTML = '<option value="">Todas as rotas</option>' + rotas.map(r => `<option value="${r.rota}">${r.rota}</option>`).join('');
    } catch(e) {
      document.getElementById('sel-rota-pdf').innerHTML = '<option value="">Erro ao carregar</option>';
    }
  }

  async function exportarIHP() {
    const dia = document.getElementById('sel-dia-ihp').value;
    if (!dia) { showMsg('msg-ihp', 'Selecione um dia.', 'error'); return; }
    
    // Converter data de YYYY-MM-DD para DD/MM/YYYY
    const [ano, mes, diaNum] = dia.split('-');
    const dataFormatada = `${diaNum}/${mes}/${ano}`;
    
    const btn = document.querySelector('.btn:not(.btn-pdf)');
    btn.disabled = true;
    showMsg('msg-ihp', 'Gerando planilha...', 'loading');
    try {
      const r = await fetch(API + '/historico?data=' + encodeURIComponent(dataFormatada));
      const d = await r.json();
      const historico = d.historico || [];
      
      // Carregar template
      const templateResp = await fetch('template_ihp.xlsx');
      const templateBuffer = await templateResp.arrayBuffer();
      const wb = XLSX.read(templateBuffer, { type: 'array' });
      
      const porRota = {};
      historico.forEach(h => { if (!porRota[h.rota]) porRota[h.rota] = []; porRota[h.rota].push(h); });

      // ABA IHP
      const dadosIHP = [];
      Object.keys(porRota).sort().forEach(rota => {
        porRota[rota].forEach(h => {
          dadosIHP.push({
            'Rota': rota, 'Cliente': h.nome_cliente, 'Nº': h.numero_cliente,
            'Horário': h.horario, 'Entrega': h.horario_entrega ? h.horario_entrega.split(' ').pop() : '—',
            'Status': h.produtividade === 'produtiva' ? 'Produtiva' : h.produtividade === 'improdutiva' ? 'Improdutiva' : 'Pendente',
            'Motivo': h.motivo_improdutiva || ''
          });
        });
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dadosIHP), 'IHP', true);

      // ABA ATRASOS
      const dadosAtrasos = [];
      Object.keys(porRota).sort().forEach(rota => {
        porRota[rota].forEach(h => {
          if (h.horario_entrega && h.horario) {
            const [hM, mM] = h.horario.split(':').map(Number);
            const partes = h.horario_entrega.split(' ');
            if (partes.length >= 2) {
              const [hE, mE] = partes[partes.length-1].split(':').map(Number);
              const minAtraso = (hE*60+mE) - (hM*60+mM);
              if (minAtraso > 30) {
                const horas = Math.floor(minAtraso/60);
                const mins = minAtraso%60;
                dadosAtrasos.push({
                  'Rota': rota, 'Cliente': h.nome_cliente, 'Nº': h.numero_cliente,
                  'Hora Marcada': h.horario, 'Hora Baixa': partes[partes.length-1],
                  'Atraso': horas > 0 ? `${horas}h ${mins}min` : `${mins}min`
                });
              }
            }
          }
        });
      });
      const wsAtrasos = XLSX.utils.json_to_sheet(dadosAtrasos);
      const range = XLSX.utils.decode_range(wsAtrasos['!ref'] || 'A1');
      for (let R = range.s.r; R <= range.e.r; ++R) {
        for (let C = range.s.c; C <= range.e.c; ++C) {
          const addr = XLSX.utils.encode_col(C) + XLSX.utils.encode_row(R+1);
          if (wsAtrasos[addr]) wsAtrasos[addr].s = { font: { color: { rgb: 'FFCC0000' }, bold: true } };
        }
      }
      XLSX.utils.book_append_sheet(wb, wsAtrasos, 'Atrasos', true);
      XLSX.writeFile(wb, `IHP_${dia}.xlsx`);
      showMsg('msg-ihp', '✓ Planilha gerada com sucesso!', 'success');
    } catch(e) {
      showMsg('msg-ihp', 'Erro: ' + e.message, 'error');
    }
    btn.disabled = false;
  }

  async function exportarChecklistPDF() {
    const rota = document.getElementById('sel-rota-pdf').value;
    const data = document.getElementById('sel-data-pdf').value;
    if (!data) { showMsg('msg-pdf', 'Selecione uma data.', 'error'); return; }

    showMsg('msg-pdf', 'Buscando checklists...', 'loading');
    try {
      // Converter data de YYYY-MM-DD para DD/MM/YYYY
      const [ano, mes, dia] = data.split('-');
      const dataFormatada = `${dia}/${mes}/${ano}`;
      
      let url = API + '/checklist?data=' + encodeURIComponent(dataFormatada);
      // Se selecionou uma rota específica, não filtra por biocondutor
      // A API vai retornar todos os checklists da data
      
      const r = await fetch(url);
      const d = await r.json();
      let lista = d.checklists || [];
      
      // Filtro local por rota se selecionado
      if (rota) {
        lista = lista.filter(c => c.rota === rota);
      }

      if (!lista.length) { showMsg('msg-pdf', 'Nenhum checklist encontrado.', 'error'); return; }

      const campos = [
        { key: 'placa', label: 'Placa do Veículo' },
        { key: 'conservacao_moto', label: 'Conservação da Moto' },
        { key: 'pneu_dianteiro', label: 'Pneu Dianteiro' },
        { key: 'pneu_traseiro', label: 'Pneu Traseiro' },
        { key: 'bolsa_limpeza', label: 'Bolsa Térmica — Limpeza' },
        { key: 'bolsa_estado', label: 'Bolsa Térmica — Estado Geral' },
        { key: 'bolsa_identificacao', label: 'Bolsa Térmica — Identificação' },
        { key: 'colete', label: 'Colete Refletivo' },
        { key: 'documento', label: 'Documento do Veículo' },
        { key: 'mata_cachorro', label: 'Mata Cachorro' },
        { key: 'caixa_refrigerada', label: 'Caixa Refrigerada' },
        { key: 'qtd_gelox', label: 'Quantidade de Gelox' },
        { key: 'qtd_gelo_seco', label: 'Quantidade de Gelo Seco' },
        { key: 'caixa_ambiente', label: 'Caixa Ambiente' },
        { key: 'caixa_identificacao', label: 'Caixa Térmica tem Identificação?' },
        { key: 'amostras_pendentes', label: 'Há amostras pendentes do dia anterior no cooler?' },
        { key: 'bau_cadeado', label: 'Baú com cadeado?' },
      ];

      const corValor = v => {
        if (!v) return '#666';
        if (['Conforme','Sim','Limpa','Dentro do padrão'].includes(String(v))) return '#085041';
        if (['Não Conforme','Não','Suja','Fora do padrão'].includes(String(v))) return '#991B1B';
        return '#0F4C7A';
      };

      const html = `
        <html><head><meta charset="UTF-8"/>
        <style>
          body{font-family:Arial,sans-serif;font-size:12px;color:#111;margin:20px}
          .page{max-width:700px;margin:0 auto;page-break-after:always}
          .page:last-child{page-break-after:auto}
          .header{text-align:center;border-bottom:3px solid #1E9FD9;padding-bottom:16px;margin-bottom:20px}
          .logo-svg{height:120px;width:auto}
          .info-row{display:flex;gap:0;margin-bottom:18px;border:1px solid #EBF1F5;border-radius:8px;overflow:hidden}
          .info-item{flex:1;padding:10px 14px;border-right:1px solid #EBF1F5;background:#F7FBFD}
          .info-item:last-child{border-right:none}
          .info-label{font-size:9px;font-weight:bold;color:#94A8B8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
          .info-valor{font-size:13px;font-weight:bold;color:#0F4C7A}
          table{width:100%;border-collapse:collapse}
          tr:nth-child(even){background:#F7FBFD}
          td{padding:7px 10px;border-bottom:1px solid #EBF1F5;font-size:12px}
          td:first-child{color:#5A7A8F;width:58%}
          td:last-child{font-weight:bold;text-align:right}
          .ok{color:#085041;background:#E1F5EE;padding:2px 8px;border-radius:5px}
          .nok{color:#991B1B;background:#FCEBEB;padding:2px 8px;border-radius:5px}
          .neu{color:#0F4C7A;background:#E8F4FB;padding:2px 8px;border-radius:5px}
          .footer{margin-top:20px;padding-top:10px;border-top:1px solid #EBF1F5;display:flex;justify-content:space-between;align-items:center}
          .footer-txt{font-size:10px;color:#94A8B8}
          .assinatura{border-top:1px solid #0F4C7A;width:180px;padding-top:4px;font-size:10px;color:#5A7A8F;text-align:center}
        </style></head><body>
        ${lista.map(c => `
          <div class="page">
            <div class="header">
              <img src="HERMES PARDINI.png" class="logo-svg" alt="Loglife Hermes Pardini"/>
            </div>
            <div class="info-row">
              <div class="info-item">
                <div class="info-label">Biocondutor</div>
                <div class="info-valor">${c.biocondutor}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Rota</div>
                <div class="info-valor">${c.rota || '—'}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Data</div>
                <div class="info-valor">${c.data_checklist || '—'}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Placa</div>
                <div class="info-valor">${c.placa || '—'}</div>
              </div>
            </div>
            <table>
              ${campos.map(f => {
                const v = c[f.key];
                const vStr = v !== null && v !== undefined && v !== '' ? String(v) : '—';
                const cls = ['Conforme','Sim','Limpa','Dentro do padrão'].includes(vStr) ? 'ok' :
                            ['Não Conforme','Não','Suja','Fora do padrão'].includes(vStr) ? 'nok' : 'neu';
                return `<tr><td>${f.label}</td><td class="${cls}">${vStr}</td></tr>`;
              }).join('')}
            </table>
            <div class="footer">
              <div class="footer-txt">Loglife — Operação Loglife/Pardini · ${new Date().toLocaleDateString('pt-BR')}</div>
              <div class="assinatura">Assinatura do Biocondutor</div>
            </div>
          </div>`).join('')}
        </body></html>`;

      const printWindow = window.open('', '_blank');
      printWindow.document.write(html);
      printWindow.document.close();
      printWindow.onload = () => { printWindow.print(); };
      showMsg('msg-pdf', '✓ PDF gerado! Verifique a janela de impressão.', 'success');
    } catch(e) {
      showMsg('msg-pdf', 'Erro: ' + e.message, 'error');
    }
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + type;
  }
</script>
</body>
</html>
