<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loglife — Baixar Base Atual</title>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0F4F8;min-height:100vh;padding:0 0 3rem;color:#0F4C7A}
    .header{background:linear-gradient(135deg,#1E9FD9,#0F7BB0);padding:1.5rem 1.25rem;color:#fff}
    .header-row{display:flex;align-items:center;gap:14px}
    .header-logo{height:36px;width:auto;filter:brightness(0) invert(1)}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#fff;opacity:.85;cursor:pointer;text-decoration:none;margin-bottom:8px}
    .container{padding:1.25rem;max-width:600px;margin:0 auto}
    .card{background:#fff;border-radius:16px;padding:1.5rem;box-shadow:0 1px 6px rgba(30,159,217,0.08);margin-bottom:1rem}
    .card-icon{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#E8F4FB,#BFE0F0);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:1rem}
    .card-title{font-size:18px;font-weight:700;color:#0F4C7A;margin-bottom:6px}
    .card-desc{font-size:14px;color:#5A7A8F;margin-bottom:1.25rem;line-height:1.5}
    .stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:1.25rem}
    .stat{background:#F7FBFD;border-radius:10px;padding:12px;text-align:center;border:1px solid #D6E5EE}
    .stat-val{font-size:24px;font-weight:700;color:#0F4C7A}
    .stat-label{font-size:11px;color:#5A7A8F;margin-top:2px}
    .btn-baixar{width:100%;padding:16px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;border:none;background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 12px rgba(30,159,217,0.25);margin-bottom:10px}
    .btn-csv{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:1.5px solid #1E9FD9;background:#fff;color:#1E9FD9;display:flex;align-items:center;justify-content:center;gap:8px}
    .msg{border-radius:11px;padding:12px 16px;font-size:14px;text-align:center;margin-top:14px;display:none;font-weight:500}
    .msg.success{background:#E8F4FB;color:#0F4C7A;border:1.5px solid #1E9FD9;display:block}
    .msg.error{background:#FCEBEB;color:#791F1F;border:1.5px solid #F09595;display:block}
  </style>
</head>
<body>

<div class="header">
  <a href="painel.html" class="back-link">← Voltar ao painel</a>
  <div class="header-row">
    <img src="20050686-7618-4EE2-86F2-0E0E1EE012BE.png" alt="Loglife" class="header-logo"/>
    <div>
      <h1 style="font-size:18px;font-weight:700">Base atual de clientes</h1>
      <div style="font-size:13px;opacity:.85">Exportar todos os clientes ativos</div>
    </div>
  </div>
</div>

<div class="container">
  <div class="card">
    <div class="card-icon">📋</div>
    <div class="card-title">Planilha de clientes ativos</div>
    <div class="card-desc">Baixe uma planilha com todos os clientes <strong>ativos</strong> do sistema agora. Clientes excluídos não aparecem aqui (mas continuam no histórico).</div>

    <div class="stat-row">
      <div class="stat"><div class="stat-val" id="s-total">—</div><div class="stat-label">clientes ativos</div></div>
      <div class="stat"><div class="stat-val" id="s-rotas">—</div><div class="stat-label">rotas</div></div>
    </div>

    <button class="btn-baixar" onclick="baixarXlsx()">📥 Baixar Excel (.xlsx)</button>
    <button class="btn-csv" onclick="baixarCsv()">⬇ Baixar CSV</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
  const API = 'https://confirmacaoderota.willlog99.workers.dev';
  let clientes = [];

  async function carregar() {
    try {
      const r = await fetch(API + '/clientes');
      const d = await r.json();
      clientes = d.clientes || [];
      document.getElementById('s-total').textContent = clientes.length;
      document.getElementById('s-rotas').textContent = new Set(clientes.map(c=>c.rota)).size;
    } catch(e) { showMsg('Erro ao carregar.', 'error'); }
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  async function baixarXlsx() {
    if (!clientes.length) { showMsg('Sem clientes.', 'error'); return; }
    try {
      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet('Clientes Ativos');
      ws.columns = [
        { header: 'NÚMERO', key: 'numero_cliente', width: 14 },
        { header: 'NOME', key: 'nome', width: 50 },
        { header: 'ROTA', key: 'rota', width: 18 },
        { header: 'HORÁRIO', key: 'horario', width: 12 },
        { header: 'TIPO', key: 'tipo', width: 16 }
      ];
      // Estilo do cabeçalho
      ws.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
      ws.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0F4C7A' } };
      ws.getRow(1).alignment = { vertical: 'middle', horizontal: 'left' };
      ws.getRow(1).height = 24;

      clientes.forEach(c => {
        ws.addRow({
          numero_cliente: c.numero_cliente,
          nome: c.nome,
          rota: c.rota,
          horario: c.horario,
          tipo: (c.tipo || 'normal').toUpperCase()
        });
      });

      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const data = new Date().toLocaleDateString('en-CA', { timeZone:'America/Sao_Paulo' });
      a.href = url; a.download = `base_clientes_${data}.xlsx`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showMsg(`✓ ${clientes.length} clientes exportados!`, 'success');
    } catch(e) { showMsg('Erro: ' + e.message, 'error'); }
  }

  function baixarCsv() {
    if (!clientes.length) { showMsg('Sem clientes.', 'error'); return; }
    const linhas = [['Numero','Nome','Rota','Horario','Tipo']];
    clientes.forEach(c => linhas.push([
      c.numero_cliente, c.nome, c.rota, c.horario, (c.tipo || 'normal').toUpperCase()
    ]));
    const csv = '\ufeff' + linhas.map(l => l.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const data = new Date().toLocaleDateString('en-CA', { timeZone:'America/Sao_Paulo' });
    a.href = url; a.download = `base_clientes_${data}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showMsg(`✓ ${clientes.length} clientes exportados!`, 'success');
  }

  carregar();
</script>
</body>
</html>
