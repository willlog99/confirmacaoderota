<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loglife — Rotas</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0F4F8;min-height:100vh;padding-bottom:3rem}
    .header{background:linear-gradient(135deg,#1E9FD9,#0F7BB0);padding:1.25rem 1.25rem 1.5rem;color:#fff;display:flex;align-items:center;gap:14px;margin-bottom:1.5rem}
    .back-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
    .header-logo{height:32px;width:auto;filter:brightness(0) invert(1)}
    .header h1{font-size:18px;font-weight:700;flex:1}

    .container{padding:0 1.25rem;max-width:800px;margin:0 auto}

    .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:1rem}
    .btn-atualizar{padding:8px 14px;border-radius:10px;border:1.5px solid #D6E5EE;background:#fff;font-size:13px;font-weight:600;color:#0F4C7A;cursor:pointer;display:flex;align-items:center;gap:6px}
    .btn-atualizar:hover{background:#E8F4FB;border-color:#1E9FD9}

    .rota-card{background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(30,159,217,0.08);margin-bottom:12px;overflow:hidden;border:1.5px solid #EBF1F5}
    .rota-header{padding:1rem 1.25rem;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .15s}
    .rota-header:hover{background:#F7FBFD}
    .rota-info{flex:1;min-width:0}
    .rota-nome{font-size:15px;font-weight:800;color:#0F4C7A}
    .rota-meta{font-size:12px;color:#5A7A8F;margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .dia-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#E8F4FB;color:#0F7BB0}
    .status-livre{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#E1F5EE;color:#085041}
    .status-andamento{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#FEF9EC;color:#92400E}
    .rota-expand-icon{font-size:14px;color:#94A8B8;transition:transform .2s;flex-shrink:0}
    .rota-card.open .rota-expand-icon{transform:rotate(180deg)}

    .rota-actions{display:flex;gap:6px;padding:0 1.25rem .75rem;flex-wrap:wrap}
    .btn-action{padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid;display:flex;align-items:center;gap:4px;transition:all .15s}
    .btn-trocar{background:#E8F4FB;color:#0F4C7A;border-color:#BFE0F0}
    .btn-trocar:hover{background:#D0EAF8}
    .btn-renomear{background:#FEF9EC;color:#92400E;border-color:#F2CC70}
    .btn-renomear:hover{background:#FEF3C7}
    .btn-excluir{background:#FCEBEB;color:#791F1F;border-color:#F09595}
    .btn-excluir:hover{background:#FAD5D5}
    .btn-editar{background:#E1F5EE;color:#085041;border-color:#5DCAA5}
    .btn-editar:hover{background:#C8F0E0}

    .rota-body{display:none;border-top:1px solid #EBF1F5}
    .rota-card.open .rota-body{display:block}

    .cli-lista-view{padding:.75rem 1.25rem}
    .cli-row{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:6px;border:1.5px solid #D6E5EE;display:flex;align-items:center;gap:10px}
    .cli-row.editing{background:#E8F4FB;border-color:#1E9FD9}
    .cli-pos{width:22px;height:22px;border-radius:50%;background:#E8F4FB;color:#1E9FD9;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .cli-nome{font-size:13px;font-weight:700;color:#0F4C7A;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cli-num{font-size:11px;color:#5A7A8F;flex-shrink:0}
    .cli-hora{font-size:13px;font-weight:700;color:#1E9FD9;flex-shrink:0}
    .cli-actions{display:flex;gap:4px;flex-shrink:0}
    .btn-cli{padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid;transition:all .1s}
    .btn-mover-cli{background:#E8F4FB;color:#0F4C7A;border-color:#BFE0F0}
    .btn-mover-cli:hover{background:#D0EAF8}
    .btn-hora-cli{background:#FEF9EC;color:#92400E;border-color:#F2CC70}
    .btn-hora-cli:hover{background:#FEF3C7}

    /* DRAG */
    .cli-drag-row{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:6px;border:1.5px solid #D6E5EE;display:flex;align-items:center;gap:10px;cursor:grab;user-select:none}
    .cli-drag-row:active{cursor:grabbing}
    .cli-drag-row.dragging{opacity:.4;border-color:#1E9FD9}
    .cli-drag-row.drag-over{border-color:#1E9FD9;background:#E8F4FB;transform:translateY(2px)}
    .drag-handle{color:#94A8B8;font-size:16px;flex-shrink:0}

    .edit-actions{padding:.75rem 1.25rem;border-top:1px solid #EBF1F5;display:flex;gap:8px}
    .btn-salvar{flex:1;padding:10px;border-radius:10px;background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff;font-size:13px;font-weight:700;cursor:pointer;border:none}
    .btn-cancelar-edit{flex:1;padding:10px;border-radius:10px;background:#fff;color:#5A7A8F;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid #D6E5EE}

    .empty{text-align:center;padding:2rem;color:#94A8B8;font-size:13px}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid #D6E5EE;border-top-color:#1E9FD9;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:4px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#0F4C7A;color:#fff;padding:10px 22px;border-radius:99px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(15,75,122,0.55);z-index:200;display:flex;align-items:flex-end;justify-content:center}
    .modal-overlay.hidden{display:none}
    .modal{background:#fff;border-radius:20px 20px 0 0;padding:1.5rem;width:100%;max-width:500px}
    .modal h2{font-size:16px;font-weight:700;color:#0F4C7A;margin-bottom:1rem}
    .modal-field{margin-bottom:1rem}
    .modal-field label{font-size:11px;font-weight:700;color:#5A7A8F;display:block;margin-bottom:4px;text-transform:uppercase}
    .modal-field input,.modal-field select{width:100%;height:42px;border-radius:10px;border:1.5px solid #D6E5EE;font-size:14px;padding:0 12px;color:#0F4C7A;background:#fff;outline:none}
    .modal-field input:focus,.modal-field select:focus{border-color:#1E9FD9}
    .modal-btns{display:flex;gap:8px;margin-top:1rem}
    .modal-btns button{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none}
    .modal-btn-primary{background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff}
    .modal-btn-secondary{background:#fff;color:#5A7A8F;border:1.5px solid #D6E5EE !important;border:none}
  </style>
</head>
<body>

<div class="header">
  <a href="painel.html" class="back-btn">←</a>
  <img src="20050686-7618-4EE2-86F2-0E0E1EE012BE.png" alt="Loglife" class="header-logo"/>
  <h1>Alterar Rotas</h1>
</div>

<div class="container">
  <div class="toolbar">
    <select id="filtro-dias" onchange="filtrarRotasPorDia(this.value)" style="height:40px;border-radius:8px;border:1.5px solid #D6E5EE;padding:0 12px;font-size:13px;font-weight:600;color:#0F4C7A;background:#fff;cursor:pointer">
      <option value="">📅 Todos os dias</option>
      <option value="seg-sex">📆 Segunda a Sexta</option>
      <option value="sabado">📆 Sábado</option>
      <option value="domingo">📆 Domingo</option>
    </select>
    <button class="btn-atualizar" onclick="carregarRotas()">🔄 Atualizar</button>
  </div>
  <div id="lista-rotas"><div class="empty"><span class="spinner"></span> Carregando...</div></div>
</div>

<div class="toast" id="toast"></div>

<!-- MODAL MOVER CLIENTE -->
<div class="modal-overlay hidden" id="modal-mover">
  <div class="modal">
    <h2>↔ Mover cliente</h2>
    <div class="modal-field">
      <label>Nova rota</label>
      <select id="sel-nova-rota"><option value="">Selecione...</option></select>
    </div>
    <div class="modal-btns">
      <button class="modal-btn-secondary" onclick="fecharModal('modal-mover')">Cancelar</button>
      <button class="modal-btn-primary" onclick="confirmarMover()">Mover</button>
    </div>
  </div>
</div>

<!-- MODAL ALTERAR HORÁRIO -->
<div class="modal-overlay hidden" id="modal-horario">
  <div class="modal">
    <h2>⏰ Alterar horário</h2>
    <div class="modal-field">
      <label>Cliente</label>
      <div id="modal-horario-nome" style="font-size:14px;font-weight:700;color:#0F4C7A;padding:8px 0"></div>
    </div>
    <div class="modal-field">
      <label>Novo horário</label>
      <input type="time" id="input-horario"/>
    </div>
    <div class="modal-btns">
      <button class="modal-btn-secondary" onclick="fecharModal('modal-horario')">Cancelar</button>
      <button class="modal-btn-primary" onclick="confirmarHorario()">Salvar</button>
    </div>
  </div>
</div>

<script>
  const API = 'https://confirmacaoderota.willlog99.workers.dev';
  let todasRotas = [];
  let clientesPorRota = {};
  let modoEditar = null;
  let dragSrc = null;
  let clienteParaMover = null;
  let clienteParaHorario = null;
  let rotaDeClienteParaMover = null;
  let filtroSelecionado = ''; // Filtro de dias

  const diaLabels = { 'seg-sex': 'Seg-Sex', 'sabado': 'Sábado', 'domingo': 'Domingo', 'sabado': 'Sábado' };
  
  function getDiaLabel(dia) {
    if (!dia) return '—';
    if (dia === 'seg-sex') return 'Seg-Sex';
    if (dia === 'sabado' || dia === 'sábado') return 'Sábado';
    if (dia === 'domingo') return 'Domingo';
    return dia;
  }

  function filtrarRotasPorDia(dia) {
    filtroSelecionado = dia;
    renderizarRotas();
  }

  async function carregarRotas() {
    document.getElementById('lista-rotas').innerHTML = '<div class="empty"><span class="spinner"></span> Carregando...</div>';
    try {
      const r = await fetch(API + '/rotas-disponiveis?todos_dias=1');
      const d = await r.json();
      todasRotas = d.rotas || [];
      renderizarRotas();
    } catch(e) {
      document.getElementById('lista-rotas').innerHTML = '<div class="empty" style="color:#A32D2D">Erro ao carregar</div>';
    }
  }

  function renderizarRotas() {
    const el = document.getElementById('lista-rotas');
    if (!todasRotas.length) { el.innerHTML = '<div class="empty">Nenhuma rota cadastrada</div>'; return; }
    
    // Filtrar rotas se necessário
    const rotasFiltradas = filtroSelecionado 
      ? todasRotas.filter(r => r.dia_semana === filtroSelecionado)
      : todasRotas;
    
    if (!rotasFiltradas.length) { 
      el.innerHTML = '<div class="empty">Nenhuma rota encontrada para este filtro</div>'; 
      return; 
    }
    
    el.innerHTML = rotasFiltradas.map((r, origIdx) => {
      const i = todasRotas.findIndex(rota => rota.rota === r.rota);
      return `
      <div class="rota-card" id="rota-card-${i}">
        <div class="rota-header" onclick="toggleRota(${i})">
          <div class="rota-info">
            <div class="rota-nome">${r.rota}</div>
            <div class="rota-meta">
              <span class="dia-badge">${getDiaLabel(r.dia_semana)}</span>
              ${r.motoboy_aberto ? `<span>🏍️ ${r.motoboy_aberto}</span>` : ''}
              <span class="${r.ativa ? 'status-andamento' : 'status-livre'}">${r.ativa ? '🔒 Em uso' : 'Livre'}</span>
            </div>
          </div>
          <div class="rota-expand-icon">▼</div>
        </div>
        <div class="rota-body" id="rota-body-${i}">
          <div class="rota-actions">
            <button class="btn-action btn-editar" onclick="editarOrdem(${i})">↕ Reordenar</button>
            <button class="btn-action btn-trocar" onclick="trocarMotorista('${r.rota.replace(/'/g,"\\'") }')">⇄ Motorista</button>
            <button class="btn-action btn-renomear" onclick="renomearRota('${r.rota.replace(/'/g,"\\'")}')">✎ Renomear</button>
            <button class="btn-action btn-editar" onclick="alterarDiaRota('${r.rota.replace(/'/g,"\\'")}','${r.dia_semana}')">📅 Dia</button>
            <button class="btn-action btn-trocar" onclick="clonarRota('${r.rota.replace(/'/g,"\\'")}')">🗂 Clonar</button>
            ${r.ativa ? `<button class="btn-action btn-trocar" onclick="destravarRota('${r.rota.replace(/'/g,"\\'")}')">🔓 Destravar</button>` : ''}
            <button class="btn-action btn-excluir" onclick="excluirRota('${r.rota.replace(/'/g,"\\'")}')">🗑 Excluir</button>
          </div>
          <div id="clientes-rota-${i}"><div class="empty"><span class="spinner"></span></div></div>
        </div>
      </div>`).join('');
  }

  async function toggleRota(i) {
    const card = document.getElementById('rota-card-' + i);
    const isOpen = card.classList.contains('open');
    document.querySelectorAll('.rota-card').forEach(c => c.classList.remove('open'));
    if (!isOpen) {
      card.classList.add('open');
      await carregarClientes(i);
    }
  }

  async function carregarClientes(i) {
    const rota = todasRotas[i].rota;
    try {
      const r = await fetch(API + '/rota?rota=' + encodeURIComponent(rota) + '&todos_dias=1');
      const d = await r.json();
      clientesPorRota[rota] = d.clientes || [];
      renderizarClientes(i, clientesPorRota[rota]);
    } catch(e) {
      document.getElementById('clientes-rota-' + i).innerHTML = '<div class="empty" style="color:#A32D2D">Erro</div>';
    }
  }

  function renderizarClientes(i, clientes) {
    const el = document.getElementById('clientes-rota-' + i);
    if (!clientes.length) { el.innerHTML = '<div class="empty">Nenhum cliente nesta rota</div>'; return; }

    if (modoEditar === i) {
      // Modo drag and drop
      el.innerHTML = `<div class="cli-lista-view" id="drag-lista-${i}">
        ${clientes.map((c, idx) => `
          <div class="cli-drag-row" draggable="true" data-idx="${idx}"
            ondragstart="onDragStart(event,${i})"
            ondragover="onDragOver(event)"
            ondragenter="onDragEnter(event)"
            ondragleave="onDragLeave(event)"
            ondrop="onDrop(event,${i})"
            ondragend="onDragEnd(event)">
            <div class="drag-handle">⠿</div>
            <div class="cli-pos">${idx + 1}</div>
            <div class="cli-nome">${c.nome}</div>
            <div class="cli-num">Nº ${c.numero_cliente}</div>
            <div class="cli-hora">${c.horario}</div>
          </div>`).join('')}
      </div>
      <div class="edit-actions">
        <button class="btn-salvar" onclick="salvarOrdem(${i})">✓ Salvar ordem</button>
        <button class="btn-cancelar-edit" onclick="cancelarEditar(${i})">Cancelar</button>
      </div>`;
    } else {
      // Modo visualização com botões mover, alterar horário e excluir
      el.innerHTML = `<div class="cli-lista-view">
        ${clientes.map((c, idx) => `
          <div class="cli-row">
            <div class="cli-pos">${idx + 1}</div>
            <div class="cli-nome">${c.nome}</div>
            <div class="cli-num">Nº ${c.numero_cliente}</div>
            <div class="cli-hora">${c.horario}</div>
            <div class="cli-actions">
              <button class="btn-cli btn-hora-cli" onclick="abrirAlterarHorario(${c.id},'${c.nome.replace(/'/g,"\\'")}','${c.horario}')">⏰</button>
              <button class="btn-cli btn-mover-cli" onclick="abrirMover(${c.id},'${todasRotas[i].rota.replace(/'/g,"\\'")}')">↔</button>
              <button class="btn-cli" style="background:#FCEBEB;color:#791F1F;border-color:#F09595" onclick="excluirCliente(${c.id},${i})">🗑</button>
            </div>
          </div>`).join('')}
      </div>

      <!-- ADICIONAR CLIENTE DA BASE -->
      <div style="padding:.75rem 1.25rem;border-top:1px solid #EBF1F5;background:#F7FBFD">
        <div style="font-size:11px;font-weight:700;color:#5A7A8F;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">+ Adicionar cliente da base</div>
        <div style="display:flex;gap:6px;margin-bottom:6px">
          <input type="text" id="busca-base-${i}" placeholder="Nome ou código..." 
            style="flex:1;height:36px;border-radius:8px;border:1.5px solid #D6E5EE;font-size:13px;padding:0 10px;color:#0F4C7A;outline:none"
            oninput="buscarClienteBase(${i})" onfocus="this.style.borderColor='#1E9FD9'" onblur="this.style.borderColor='#D6E5EE'"/>
          <button onclick="limparBuscaBase(${i})" style="padding:0 10px;border-radius:8px;border:1.5px solid #D6E5EE;background:#fff;color:#94A8B8;font-size:13px;cursor:pointer">✕</button>
        </div>
        <div id="base-results-${i}" style="max-height:180px;overflow-y:auto;border-radius:8px;border:1px solid #EBF1F5;display:none"></div>
      </div>`;
    }
  }

  function editarOrdem(i) { modoEditar = i; renderizarClientes(i, clientesPorRota[todasRotas[i].rota] || []); }
  function cancelarEditar(i) { modoEditar = null; renderizarClientes(i, clientesPorRota[todasRotas[i].rota] || []); }

  // DRAG AND DROP
  function onDragStart(e, rotaIdx) {
    dragSrc = e.currentTarget;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragSrc.dataset.idx);
    setTimeout(() => dragSrc.classList.add('dragging'), 0);
  }
  function onDragOver(e) { e.preventDefault(); return false; }
  function onDragEnter(e) { if (e.currentTarget !== dragSrc) e.currentTarget.classList.add('drag-over'); }
  function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
  function onDragEnd(e) { document.querySelectorAll('.cli-drag-row').forEach(el => el.classList.remove('dragging','drag-over')); }
  function onDrop(e, rotaIdx) {
    e.preventDefault();
    const target = e.currentTarget;
    target.classList.remove('drag-over');
    if (!dragSrc || dragSrc === target) return;
    const rota = todasRotas[rotaIdx].rota;
    const clientes = clientesPorRota[rota];
    const srcIdx = parseInt(dragSrc.dataset.idx);
    const tgtIdx = parseInt(target.dataset.idx);
    const [removed] = clientes.splice(srcIdx, 1);
    clientes.splice(tgtIdx, 0, removed);
    clientesPorRota[rota] = clientes;
    renderizarClientes(rotaIdx, clientes);
  }

  async function salvarOrdem(i) {
    const rota = todasRotas[i].rota;
    const clientes = clientesPorRota[rota];
    const ordem = clientes.map((c, idx) => ({ id: c.id, ordem: idx + 1 }));
    try {
      await fetch(API + '/reordenar-clientes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ rota, ordem }) });
      modoEditar = null;
      renderizarClientes(i, clientes);
      toast('✓ Ordem salva!');
    } catch(e) { toast('Erro ao salvar'); }
  }

  // MOVER CLIENTE
  async function abrirMover(id, rotaAtual) {
    clienteParaMover = id;
    rotaDeClienteParaMover = rotaAtual;
    const sel = document.getElementById('sel-nova-rota');
    sel.innerHTML = '<option value="">Carregando...</option>';
    document.getElementById('modal-mover').classList.remove('hidden');
    try {
      const r = await fetch(API + '/rotas-disponiveis?todos_dias=1');
      const d = await r.json();
      const outras = (d.rotas || []).filter(r => r.rota !== rotaAtual);
      sel.innerHTML = '<option value="">Selecione a rota...</option>' + outras.map(r => `<option value="${r.rota}">${r.rota} (${getDiaLabel(r.dia_semana)})</option>`).join('');
    } catch(e) { sel.innerHTML = '<option value="">Erro ao carregar</option>'; }
  }

  async function confirmarMover() {
    const novaRota = document.getElementById('sel-nova-rota').value;
    if (!novaRota || !clienteParaMover) return;
    await fetch(API + '/mover-cliente', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id: clienteParaMover, rota: novaRota }) });
    fecharModal('modal-mover');
    toast('✓ Cliente movido para ' + novaRota);
    // Recarregar ambas as rotas
    const i = todasRotas.findIndex(r => r.rota === rotaDeClienteParaMover);
    if (i >= 0) await carregarClientes(i);
  }

  // ALTERAR HORÁRIO
  function abrirAlterarHorario(id, nome, horarioAtual) {
    clienteParaHorario = id;
    document.getElementById('modal-horario-nome').textContent = nome;
    document.getElementById('input-horario').value = horarioAtual || '';
    document.getElementById('modal-horario').classList.remove('hidden');
  }

  async function confirmarHorario() {
    const novoHorario = document.getElementById('input-horario').value;
    if (!novoHorario || !clienteParaHorario) return;
    try {
      await fetch(API + '/clientes', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: clienteParaHorario, horario: novoHorario })
      });
      fecharModal('modal-horario');
      toast('✓ Horário atualizado!');
      // Recarregar rota aberta
      const openCard = document.querySelector('.rota-card.open');
      if (openCard) {
        const i = parseInt(openCard.id.replace('rota-card-',''));
        await carregarClientes(i);
      }
    } catch(e) { toast('Erro ao salvar'); }
  }

  // AÇÕES DE ROTA
  async function trocarMotorista(rota) {
    const tel = prompt('Digite o telefone do novo motorista:');
    if (!tel) return;
    const telLimpo = tel.replace(/\D/g,'');
    if (telLimpo.length < 10) { toast('Telefone inválido'); return; }
    
    // Busca motorista pelo telefone
    try {
      const r = await fetch(API + '/motoboys?todos=1');
      const d = await r.json();
      const motoboys = d.motoboys || [];
      // Agrupar por telefone
      const vistos = new Set();
      const unicos = motoboys.filter(m => { 
        if (vistos.has(m.telefone)) return false; 
        vistos.add(m.telefone); 
        return true; 
      });
      const encontrado = unicos.find(m => m.telefone === telLimpo);
      
      if (!encontrado) { toast('Motorista não encontrado'); return; }
      
      if (!confirm(`Trocar motorista da rota "${rota}" para:\n${encontrado.nome}\n📱 ${encontrado.telefone}`)) return;
      
      // Achar dia_semana da rota
      const rotaObj = todasRotas.find(r => r.rota === rota);
      const dia = rotaObj ? rotaObj.dia_semana : 'seg-sex';
      
      await fetch(API + '/trocar-motorista', { 
        method:'POST', 
        headers:{'Content-Type':'application/json'}, 
        body: JSON.stringify({ rota, nome_motoboy: encontrado.nome, telefone_motoboy: telLimpo, dia_semana: dia }) 
      });
      toast('✓ Motorista trocado para ' + encontrado.nome + '!');
      clientesPorRota = {};
      carregarRotas();
    } catch(e) { toast('Erro ao trocar motorista'); }
  }

  async function alterarDiaRota(rota, diaAtual) {
    const opcoes = [
      { valor: 'seg-sex', label: 'Segunda a Sexta' },
      { valor: 'sabado', label: 'Sábado' },
      { valor: 'domingo', label: 'Domingo' }
    ];
    
    // Criar modal de seleção
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:1rem';
    modal.innerHTML = `
      <div style="background:#fff;border-radius:14px;padding:1.5rem;max-width:400px;width:100%">
        <h3 style="font-size:16px;color:#0F4C7A;margin-bottom:8px">📅 Alterar Dia da Rota</h3>
        <p style="font-size:13px;color:#5A7A8F;margin-bottom:1rem">Rota: <strong>${rota}</strong></p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:1rem">
          ${opcoes.map(o => `
            <label style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;border:1.5px solid ${o.valor === diaAtual ? '#1E9FD9' : '#D6E5EE'};background:${o.valor === diaAtual ? '#E8F4FB' : '#fff'};cursor:pointer">
              <input type="radio" name="dia-rota" value="${o.valor}" ${o.valor === diaAtual ? 'checked' : ''} style="accent-color:#1E9FD9"/>
              <span style="font-size:14px;font-weight:600;color:#0F4C7A">${o.label}</span>
              ${o.valor === diaAtual ? '<span style="margin-left:auto;font-size:11px;color:#1E9FD9;font-weight:700">ATUAL</span>' : ''}
            </label>
          `).join('')}
        </div>
        <p style="font-size:11px;color:#F59E0B;margin-bottom:1rem">⚠️ Isso altera o dia de todos os clientes desta rota.</p>
        <div style="display:flex;gap:8px">
          <button id="btn-cancelar-dia" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid #D6E5EE;background:#fff;font-weight:600;cursor:pointer;color:#5A7A8F">Cancelar</button>
          <button id="btn-confirmar-dia" style="flex:1;padding:10px;border-radius:8px;border:none;background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff;font-weight:600;cursor:pointer">Confirmar</button>
        </div>
      </div>`;
    
    document.body.appendChild(modal);
    
    document.getElementById('btn-cancelar-dia').onclick = () => document.body.removeChild(modal);
    
    document.getElementById('btn-confirmar-dia').onclick = async () => {
      const novoDia = modal.querySelector('input[name="dia-rota"]:checked').value;
      if (novoDia === diaAtual) { document.body.removeChild(modal); return; }
      
      document.getElementById('btn-confirmar-dia').disabled = true;
      document.getElementById('btn-confirmar-dia').textContent = 'Salvando...';
      
      try {
        const r = await fetch(API + '/alterar-dia-rota', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rota, dia_semana: novoDia })
        });
        const d = await r.json();
        if (d.status === 'ok') {
          toast(`✅ Dia da rota ${rota} alterado para ${opcoes.find(o => o.valor === novoDia).label}!`);
          document.body.removeChild(modal);
          carregarRotas();
        } else {
          alert('Erro: ' + (d.msg || 'Tente novamente'));
        }
      } catch(e) {
        alert('Erro de conexão');
      }
    };
  }

  async function clonarRota(rota) {
    // Buscar clientes da rota
    const clientes = clientesPorRota[rota] || [];
    if (!clientes.length) {
      // Tentar carregar se ainda não carregou
      const idx = todasRotas.findIndex(r => r.rota === rota);
      if (idx >= 0) await carregarClientes(idx);
    }
    const clientesRota = clientesPorRota[rota] || [];

    const diasOpcoes = [
      { valor: 'seg', label: 'Segunda' },
      { valor: 'ter', label: 'Terça' },
      { valor: 'qua', label: 'Quarta' },
      { valor: 'qui', label: 'Quinta' },
      { valor: 'sex', label: 'Sexta' },
      { valor: 'sab', label: 'Sábado' },
      { valor: 'dom', label: 'Domingo' },
    ];

    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:1rem;overflow-y:auto';
    modal.innerHTML = `
      <div style="background:#fff;border-radius:14px;padding:1.5rem;max-width:500px;width:100%;max-height:90vh;overflow-y:auto">
        <h3 style="font-size:16px;color:#0F4C7A;margin-bottom:8px">🗂 Clonar Rota</h3>
        <p style="font-size:13px;color:#5A7A8F;margin-bottom:1rem">Origem: <strong>${rota}</strong></p>
        
        <label style="font-size:12px;font-weight:700;color:#0F4C7A;display:block;margin-bottom:4px">NOME DA NOVA ROTA</label>
        <input id="clone-nome" placeholder="Ex: SAO PAULO 47B" style="width:100%;height:40px;border-radius:8px;border:1.5px solid #D6E5EE;padding:0 12px;font-size:14px;margin-bottom:1rem"/>
        
        <label style="font-size:12px;font-weight:700;color:#0F4C7A;display:block;margin-bottom:8px">DIAS ATIVOS</label>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem">
          ${diasOpcoes.map(d => `
            <label style="display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;border:1.5px solid #D6E5EE;cursor:pointer;font-size:13px;font-weight:600;color:#0F4C7A">
              <input type="checkbox" value="${d.valor}" class="clone-dia" style="accent-color:#1E9FD9"/>
              ${d.label}
            </label>
          `).join('')}
        </div>

        <label style="font-size:12px;font-weight:700;color:#0F4C7A;display:block;margin-bottom:8px">
          CLIENTES 
          <span style="font-weight:400;color:#5A7A8F">(${clientesRota.length} disponíveis)</span>
          <button onclick="toggleTodosClones(true)" style="margin-left:8px;padding:2px 8px;border-radius:5px;border:1px solid #1E9FD9;background:#E8F4FB;color:#1E9FD9;font-size:11px;cursor:pointer">Todos</button>
          <button onclick="toggleTodosClones(false)" style="margin-left:4px;padding:2px 8px;border-radius:5px;border:1px solid #D6E5EE;background:#fff;color:#5A7A8F;font-size:11px;cursor:pointer">Nenhum</button>
        </label>
        <div style="max-height:250px;overflow-y:auto;border:1px solid #EBF1F5;border-radius:8px;margin-bottom:1rem">
          ${clientesRota.length ? clientesRota.map(c => `
            <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #F0F4F8;cursor:pointer">
              <input type="checkbox" value="${c.id}" class="clone-cli" checked style="accent-color:#1E9FD9;width:16px;height:16px"/>
              <div style="flex:1">
                <div style="font-size:13px;font-weight:600;color:#0F4C7A">${c.nome}</div>
                <div style="font-size:11px;color:#5A7A8F">Nº ${c.numero_cliente} · ${c.horario}</div>
              </div>
            </label>`).join('') : '<div style="padding:12px;text-align:center;color:#94A8B8;font-size:13px">Nenhum cliente nesta rota</div>'}
        </div>

        <div style="display:flex;gap:8px">
          <button onclick="this.closest('.modal-clone').remove()" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid #D6E5EE;background:#fff;font-weight:600;cursor:pointer;color:#5A7A8F">Cancelar</button>
          <button id="btn-confirmar-clone" style="flex:2;padding:10px;border-radius:8px;border:none;background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff;font-weight:600;cursor:pointer">🗂 Clonar Rota</button>
        </div>
      </div>`;
    
    modal.classList.add('modal-clone');
    document.body.appendChild(modal);
    
    // Fechar ao clicar fora
    modal.addEventListener('click', e => { if (e.target === modal) document.body.removeChild(modal); });
    
    document.getElementById('btn-confirmar-clone').onclick = async () => {
      const novoNome = document.getElementById('clone-nome').value.trim().toUpperCase();
      if (!novoNome) { alert('Digite o nome da nova rota'); return; }
      
      const diasMarcados = [...document.querySelectorAll('.clone-dia:checked')].map(c => c.value);
      if (!diasMarcados.length) { alert('Selecione pelo menos um dia'); return; }
      
      const clientesMarcados = [...document.querySelectorAll('.clone-cli:checked')].map(c => Number(c.value));
      
      // Calcular dia_semana baseado nos dias selecionados
      let diaSemana = 'seg-sex';
      const temDiaSemana = diasMarcados.some(d => ['seg','ter','qua','qui','sex'].includes(d));
      const temSab = diasMarcados.includes('sab');
      const temDom = diasMarcados.includes('dom');
      if (temSab && !temDiaSemana && !temDom) diaSemana = 'sabado';
      else if (temDom && !temDiaSemana && !temSab) diaSemana = 'domingo';
      else diaSemana = 'seg-sex';
      
      const btn = document.getElementById('btn-confirmar-clone');
      btn.disabled = true;
      btn.textContent = 'Clonando...';
      
      try {
        const clientesSelecionados = clientesRota.filter(c => clientesMarcados.includes(c.id));
        
        const r = await fetch(API + '/clonar-rota', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            rota_origem: rota,
            novo_nome: novoNome,
            dia_semana: diaSemana,
            dias_ativos: diasMarcados.join(','),
            clientes: clientesSelecionados.map(c => ({
              numero_cliente: c.numero_cliente,
              nome: c.nome,
              horario: c.horario,
              tipo: c.tipo || 'normal'
            }))
          })
        });
        const d = await r.json();
        
        if (d.status === 'ok') {
          toast(`✅ Rota ${novoNome} criada com ${d.inseridos} clientes!`);
          document.body.removeChild(modal);
          carregarRotas();
        } else {
          alert('Erro: ' + (d.msg || 'Tente novamente'));
          btn.disabled = false;
          btn.textContent = '🗂 Clonar Rota';
        }
      } catch(e) {
        alert('Erro de conexão');
        btn.disabled = false;
        btn.textContent = '🗂 Clonar Rota';
      }
    };
  }

  function toggleTodosClones(marcar) {
    document.querySelectorAll('.clone-cli').forEach(c => c.checked = marcar);
  }

  async function renomearRota(rota) {
    const novoNome = prompt('Novo nome da rota:', rota);
    if (!novoNome || novoNome === rota) return;
    try {
      const r = await fetch(API + '/renomear-rota', { 
        method:'POST', 
        headers:{'Content-Type':'application/json'}, 
        body: JSON.stringify({ rota_antiga: rota, rota_nova: novoNome.toUpperCase() }) 
      });
      const d = await r.json();
      if (d.status === 'ok') { toast('✓ Rota renomeada!'); carregarRotas(); }
      else toast('Erro: ' + (d.msg || 'Falha ao renomear'));
    } catch(e) { toast('Erro ao renomear'); }
  }

  async function destravarRota(rota) {
    if (!confirm('Destravar rota "' + rota + '"?')) return;
    await fetch(API + '/destravar-rota', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ rota }) });
    toast('✓ Rota destravada!');
    carregarRotas();
  }

  async function excluirRota(rota) {
    if (!confirm('Excluir rota "' + rota + '"? Os clientes voltam para a base.')) return;
    await fetch(API + '/excluir-rota', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ rota }) });
    toast('✓ Rota excluída!');
    carregarRotas();
  }

  async function excluirCliente(id, rotaIdx) {
    if (!confirm('Excluir este cliente da rota? Ele voltará para a base.')) return;
    try {
      // Volta cliente para base antes de desativar
      const rota = todasRotas[rotaIdx].rota;
      const cli = (clientesPorRota[rota] || []).find(c => c.id === id);
      if (cli) {
        await fetch(API + '/clientes-base', { 
          method:'POST', 
          headers:{'Content-Type':'application/json'}, 
          body: JSON.stringify({ numero_cliente: cli.numero_cliente, nome: cli.nome, horario: cli.horario }) 
        });
      }
      await fetch(API + '/clientes', { method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id }) });
      toast('✓ Cliente removido da rota');
      await carregarClientes(rotaIdx);
    } catch(e) { toast('Erro ao excluir'); }
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  async function buscarClienteBase(rotaIdx) {
    const q = document.getElementById('busca-base-' + rotaIdx).value.trim();
    const el = document.getElementById('base-results-' + rotaIdx);
    if (q.length < 2) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.innerHTML = '<div style="padding:8px 12px;font-size:12px;color:#94A8B8">Buscando...</div>';
    try {
      const r = await fetch(API + '/clientes-base');
      const d = await r.json();
      const ql = q.toLowerCase();
      const encontrados = (d.clientes || []).filter(c =>
        c.nome.toLowerCase().includes(ql) || String(c.numero_cliente).includes(q)
      ).slice(0, 10);
      if (!encontrados.length) {
        el.innerHTML = '<div style="padding:8px 12px;font-size:12px;color:#94A8B8">Nenhum cliente encontrado na base</div>';
        return;
      }
      el.innerHTML = encontrados.map(c => `
        <div onclick="adicionarClienteNaRota(${rotaIdx},${c.id},'${c.numero_cliente}','${c.nome.replace(/'/g,"\\'")}','${c.horario}')"
          style="padding:10px 12px;border-bottom:1px solid #EBF1F5;cursor:pointer;display:flex;align-items:center;gap:10px;background:#fff;transition:background .1s"
          onmouseover="this.style.background='#E8F4FB'" onmouseout="this.style.background='#fff'">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;color:#0F4C7A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.nome}</div>
            <div style="font-size:11px;color:#5A7A8F;margin-top:2px">Nº ${c.numero_cliente}</div>
          </div>
          <div style="font-size:13px;font-weight:700;color:#1E9FD9;flex-shrink:0">${c.horario}</div>
          <div style="font-size:11px;font-weight:700;background:#E1F5EE;color:#085041;padding:3px 8px;border-radius:6px;flex-shrink:0">+ Add</div>
        </div>`).join('');
    } catch(e) {
      el.innerHTML = '<div style="padding:8px 12px;font-size:12px;color:#A32D2D">Erro ao buscar</div>';
    }
  }

  async function adicionarClienteNaRota(rotaIdx, idBase, numero, nome, horario) {
    const rota = todasRotas[rotaIdx];
    if (!confirm(`Adicionar "${nome}" (${horario}) à rota "${rota.rota}"?`)) return;
    try {
      await fetch(API + '/clientes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          numero_cliente: numero,
          nome,
          horario,
          rota: rota.rota,
          tipo: 'normal',
          dia_semana: rota.dia_semana || 'seg-sex',
          obs: '',
          dias_ativos: rota.dia_semana === 'sabado' ? 'sab' : rota.dia_semana === 'domingo' ? 'dom' : 'seg,ter,qua,qui,sex'
        })
      });
      await fetch(API + '/clientes-base', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: idBase })
      });
      limparBuscaBase(rotaIdx);
      delete clientesPorRota[rota.rota];
      await carregarClientes(rotaIdx);
      toast('✓ ' + nome + ' adicionado à rota!');
    } catch(e) {
      toast('Erro ao adicionar cliente');
    }
  }

  function limparBuscaBase(rotaIdx) {
    const input = document.getElementById('busca-base-' + rotaIdx);
    const results = document.getElementById('base-results-' + rotaIdx);
    if (input) input.value = '';
    if (results) results.style.display = 'none';
  }

  function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }

  carregarRotas();
</script>
</body>
</html>
