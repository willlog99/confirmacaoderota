<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loglife — Rotas</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0F4F8;min-height:100vh;padding-bottom:3rem}
    .header{background:linear-gradient(135deg,#1E9FD9,#0F7BB0);padding:1.25rem 1.25rem 1.5rem;color:#fff;display:flex;align-items:center;gap:14px;margin-bottom:1.5rem}
    .back-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
    .header-logo{height:32px;width:auto;filter:brightness(0) invert(1)}
    .header h1{font-size:18px;font-weight:700;flex:1}

    .container{padding:0 1.25rem;max-width:800px;margin:0 auto}

    .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
    .btn-atualizar{padding:8px 14px;border-radius:10px;border:1.5px solid #D6E5EE;background:#fff;font-size:13px;font-weight:600;color:#0F4C7A;cursor:pointer;display:flex;align-items:center;gap:6px}
    .btn-atualizar:hover{background:#E8F4FB;border-color:#1E9FD9}

    .rota-card{background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(30,159,217,0.08);margin-bottom:12px;overflow:hidden;border:1.5px solid #EBF1F5}
    .rota-header{padding:1rem 1.25rem;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .15s}
    .rota-header:hover{background:#F7FBFD}
    .rota-info{flex:1;min-width:0}
    .rota-nome{font-size:15px;font-weight:800;color:#0F4C7A}
    .rota-meta{font-size:12px;color:#5A7A8F;margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .dia-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#E8F4FB;color:#0F7BB0}
    .status-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
    .status-livre{background:#E1F5EE;color:#085041}
    .status-andamento{background:#FEF9EC;color:#92400E}
    .rota-stats{display:flex;gap:8px;font-size:12px;color:#5A7A8F;flex-shrink:0}
    .rota-expand-icon{font-size:14px;color:#94A8B8;transition:transform .2s;flex-shrink:0}
    .rota-card.open .rota-expand-icon{transform:rotate(180deg)}

    .rota-actions{display:flex;gap:6px;padding:0 1.25rem .75rem;flex-wrap:wrap}
    .btn-action{padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid;display:flex;align-items:center;gap:4px;transition:all .15s}
    .btn-trocar{background:#E8F4FB;color:#0F4C7A;border-color:#BFE0F0}
    .btn-trocar:hover{background:#D0EAF8}
    .btn-renomear{background:#FEF9EC;color:#92400E;border-color:#F2CC70}
    .btn-renomear:hover{background:#FEF3C7}
    .btn-excluir{background:#FCEBEB;color:#791F1F;border-color:#F09595}
    .btn-excluir:hover{background:#FAD5D5}
    .btn-editar{background:#E1F5EE;color:#085041;border-color:#5DCAA5}
    .btn-editar:hover{background:#C8F0E0}

    .rota-body{display:none;border-top:1px solid #EBF1F5}
    .rota-card.open .rota-body{display:block}

    .cli-lista-edit{padding:.75rem 1.25rem}
    .cli-drag{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:6px;border:1.5px solid #D6E5EE;display:flex;align-items:center;gap:10px;transition:all .2s;user-select:none}
    .cli-drag.dragging{opacity:.5;border-color:#1E9FD9;box-shadow:0 4px 12px rgba(30,159,217,0.2)}
    .cli-drag.drag-over{border-color:#1E9FD9;background:#E8F4FB;transform:translateY(2px)}
    .drag-handle{cursor:grab;color:#94A8B8;font-size:16px;flex-shrink:0;padding:0 4px}
    .drag-handle:active{cursor:grabbing}
    .cli-drag-info{flex:1;min-width:0}
    .cli-drag-nome{font-size:13px;font-weight:700;color:#0F4C7A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cli-drag-meta{font-size:11px;color:#5A7A8F;margin-top:2px}
    .cli-drag-hora{font-size:12px;font-weight:700;color:#1E9FD9;flex-shrink:0}
    .cli-drag-pos{width:22px;height:22px;border-radius:50%;background:#E8F4FB;color:#1E9FD9;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

    .edit-actions{padding:.75rem 1.25rem;border-top:1px solid #EBF1F5;display:flex;gap:8px}
    .btn-salvar{flex:1;padding:10px;border-radius:10px;background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff;font-size:13px;font-weight:700;cursor:pointer;border:none}
    .btn-cancelar-edit{flex:1;padding:10px;border-radius:10px;background:#fff;color:#5A7A8F;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid #D6E5EE}

    .empty{text-align:center;padding:2rem;color:#94A8B8;font-size:13px}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid #D6E5EE;border-top-color:#1E9FD9;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:4px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#0F4C7A;color:#fff;padding:10px 22px;border-radius:99px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1}
    .msg-inline{font-size:12px;padding:6px 10px;border-radius:8px;margin:0 1.25rem .75rem;text-align:center}
    .msg-inline.success{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5}
    .msg-inline.error{background:#FCEBEB;color:#791F1F;border:1px solid #F09595}
  </style>
</head>
<body>

<div class="header">
  <a href="painel.html" class="back-btn">←</a>
  <img src="20050686-7618-4EE2-86F2-0E0E1EE012BE.png" alt="Loglife" class="header-logo"/>
  <h1>Alterar Rotas</h1>
</div>

<div class="container">
  <div class="toolbar">
    <button class="btn-atualizar" onclick="carregarRotas()">🔄 Atualizar</button>
  </div>
  <div id="lista-rotas"><div class="empty"><span class="spinner"></span> Carregando...</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = 'https://confirmacaoderota.willlog99.workers.dev';
  let todasRotas = [];
  let clientesPorRota = {};
  let modoEditar = null;
  let dragSrc = null;

  const diaLabels = { 'seg-sex': 'Seg-Sex', 'sabado': 'Sábado', 'domingo': 'Domingo' };

  async function carregarRotas() {
    document.getElementById('lista-rotas').innerHTML = '<div class="empty"><span class="spinner"></span> Carregando...</div>';
    try {
      const r = await fetch(API + '/rotas-disponiveis?todos_dias=1');
      const d = await r.json();
      todasRotas = d.rotas || [];
      renderizarRotas();
    } catch(e) {
      document.getElementById('lista-rotas').innerHTML = '<div class="empty" style="color:#A32D2D">Erro ao carregar</div>';
    }
  }

  function renderizarRotas() {
    const el = document.getElementById('lista-rotas');
    if (!todasRotas.length) { el.innerHTML = '<div class="empty">Nenhuma rota cadastrada</div>'; return; }
    el.innerHTML = todasRotas.map((r, i) => `
      <div class="rota-card" id="rota-card-${i}">
        <div class="rota-header" onclick="toggleRota(${i})">
          <div class="rota-info">
            <div class="rota-nome">${r.rota}</div>
            <div class="rota-meta">
              <span class="dia-badge">${diaLabels[r.dia_semana] || r.dia_semana || '—'}</span>
              ${r.motoboy_aberto ? `<span>🏍️ ${r.motoboy_aberto}</span>` : ''}
              <span class="${r.ativa ? 'status-badge status-andamento' : 'status-badge status-livre'}">${r.ativa ? '🔒 Em uso' : 'Livre'}</span>
            </div>
          </div>
          <div class="rota-expand-icon">▼</div>
        </div>
        <div class="rota-body" id="rota-body-${i}">
          <div class="rota-actions">
            <button class="btn-action btn-editar" onclick="editarOrdem(${i})">↕ Reordenar coletas</button>
            <button class="btn-action btn-trocar" onclick="trocarMotorista('${r.rota.replace(/'/g,"\\'")}')">⇄ Trocar motorista</button>
            <button class="btn-action btn-renomear" onclick="renomearRota('${r.rota.replace(/'/g,"\\'")}')">✎ Renomear</button>
            ${r.ativa ? `<button class="btn-action btn-trocar" onclick="destravarRota('${r.rota.replace(/'/g,"\\'")}')">🔓 Destravar</button>` : ''}
            <button class="btn-action btn-excluir" onclick="excluirRota('${r.rota.replace(/'/g,"\\'")}')">🗑 Excluir</button>
          </div>
          <div id="clientes-rota-${i}"><div class="empty"><span class="spinner"></span></div></div>
        </div>
      </div>`).join('');
  }

  async function toggleRota(i) {
    const card = document.getElementById('rota-card-' + i);
    const isOpen = card.classList.contains('open');
    
    // Fechar todos
    document.querySelectorAll('.rota-card').forEach(c => c.classList.remove('open'));
    
    if (!isOpen) {
      card.classList.add('open');
      await carregarClientes(i);
    }
  }

  async function carregarClientes(i) {
    const rota = todasRotas[i].rota;
    if (clientesPorRota[rota]) { renderizarClientes(i, clientesPorRota[rota]); return; }
    
    try {
      const r = await fetch(API + '/rota?rota=' + encodeURIComponent(rota) + '&todos_dias=1');
      const d = await r.json();
      clientesPorRota[rota] = d.clientes || [];
      renderizarClientes(i, clientesPorRota[rota]);
    } catch(e) {
      document.getElementById('clientes-rota-' + i).innerHTML = '<div class="empty" style="color:#A32D2D">Erro ao carregar coletas</div>';
    }
  }

  function renderizarClientes(i, clientes) {
    const el = document.getElementById('clientes-rota-' + i);
    if (!clientes.length) { el.innerHTML = '<div class="empty">Nenhum cliente nesta rota</div>'; return; }
    
    const emEdicao = modoEditar === i;
    
    if (emEdicao) {
      el.innerHTML = `
        <div class="cli-lista-edit" id="drag-lista-${i}">
          ${clientes.map((c, idx) => `
            <div class="cli-drag" draggable="true" data-id="${c.id}" data-idx="${idx}"
              ondragstart="onDragStart(event,${i})"
              ondragover="onDragOver(event)"
              ondragenter="onDragEnter(event)"
              ondragleave="onDragLeave(event)"
              ondrop="onDrop(event,${i})"
              ondragend="onDragEnd(event)">
              <div class="drag-handle">⠿</div>
              <div class="cli-drag-pos">${idx + 1}</div>
              <div class="cli-drag-info">
                <div class="cli-drag-nome">${c.nome}</div>
                <div class="cli-drag-meta">Nº ${c.numero_cliente}</div>
              </div>
              <div class="cli-drag-hora">${c.horario}</div>
            </div>`).join('')}
        </div>
        <div class="edit-actions">
          <button class="btn-salvar" onclick="salvarOrdem(${i})">✓ Salvar ordem</button>
          <button class="btn-cancelar-edit" onclick="cancelarEditar(${i})">Cancelar</button>
        </div>`;
    } else {
      el.innerHTML = `<div class="cli-lista-edit">
        ${clientes.map((c, idx) => `
          <div class="cli-drag" style="cursor:default">
            <div class="cli-drag-pos">${idx + 1}</div>
            <div class="cli-drag-info">
              <div class="cli-drag-nome">${c.nome}</div>
              <div class="cli-drag-meta">Nº ${c.numero_cliente} · ${c.status === 'entregue' ? (c.produtividade === 'produtiva' ? '✓ Produtiva' : '✕ Improdutiva') : '⏳ Pendente'}</div>
            </div>
            <div class="cli-drag-hora">${c.horario}</div>
          </div>`).join('')}
      </div>`;
    }
  }

  function editarOrdem(i) {
    modoEditar = i;
    renderizarClientes(i, clientesPorRota[todasRotas[i].rota] || []);
  }

  function cancelarEditar(i) {
    modoEditar = null;
    renderizarClientes(i, clientesPorRota[todasRotas[i].rota] || []);
  }

  // DRAG AND DROP
  function onDragStart(e, rotaIdx) {
    dragSrc = e.currentTarget;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragSrc.dataset.idx);
    setTimeout(() => dragSrc.classList.add('dragging'), 0);
  }

  function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    return false;
  }

  function onDragEnter(e) {
    const target = e.currentTarget;
    if (target !== dragSrc) target.classList.add('drag-over');
  }

  function onDragLeave(e) {
    e.currentTarget.classList.remove('drag-over');
  }

  function onDragEnd(e) {
    document.querySelectorAll('.cli-drag').forEach(el => {
      el.classList.remove('dragging', 'drag-over');
    });
  }

  function onDrop(e, rotaIdx) {
    e.preventDefault();
    const target = e.currentTarget;
    target.classList.remove('drag-over');
    
    if (!dragSrc || dragSrc === target) return;
    
    const rota = todasRotas[rotaIdx].rota;
    const clientes = clientesPorRota[rota];
    
    const srcIdx = parseInt(dragSrc.dataset.idx);
    const tgtIdx = parseInt(target.dataset.idx);
    
    // Reordenar array
    const [removed] = clientes.splice(srcIdx, 1);
    clientes.splice(tgtIdx, 0, removed);
    
    clientesPorRota[rota] = clientes;
    renderizarClientes(rotaIdx, clientes);
  }

  async function salvarOrdem(i) {
    const rota = todasRotas[i].rota;
    const clientes = clientesPorRota[rota];
    const ordem = clientes.map((c, idx) => ({ id: c.id, ordem: idx + 1 }));
    
    try {
      await fetch(API + '/reordenar-clientes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rota, ordem })
      });
      modoEditar = null;
      renderizarClientes(i, clientes);
      toast('✓ Ordem salva!');
    } catch(e) {
      toast('Erro ao salvar ordem');
    }
  }

  async function trocarMotorista(rota) {
    const novoNome = prompt('Nome do novo motorista:');
    if (!novoNome) return;
    const novoTel = prompt('Telefone do novo motorista:');
    if (!novoTel) return;
    await fetch(API + '/trocar-motorista', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rota, nome_motoboy: novoNome, telefone_motoboy: novoTel.replace(/\D/g,'') })
    });
    toast('✓ Motorista trocado!');
    carregarRotas();
  }

  async function renomearRota(rota) {
    const novoNome = prompt('Novo nome da rota:', rota);
    if (!novoNome || novoNome === rota) return;
    await fetch(API + '/renomear-rota', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rota, novo_nome: novoNome.toUpperCase() })
    });
    toast('✓ Rota renomeada!');
    carregarRotas();
  }

  async function destravarRota(rota) {
    if (!confirm('Destravar rota "' + rota + '"?')) return;
    await fetch(API + '/destravar-rota', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rota })
    });
    toast('✓ Rota destravada!');
    carregarRotas();
  }

  async function excluirRota(rota) {
    if (!confirm('Excluir rota "' + rota + '"? Os clientes voltam para a base.')) return;
    await fetch(API + '/excluir-rota', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rota })
    });
    toast('✓ Rota excluída!');
    carregarRotas();
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  carregarRotas();
</script>
</body>
</html>
