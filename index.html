<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loglife — Operação Loglife/Pardini</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#E8F4FB 0%,#F0F4F8 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem}
    .container{width:100%;max-width:420px}
    .card{background:#fff;border-radius:24px;padding:2rem 1.75rem;box-shadow:0 4px 20px rgba(30,159,217,0.12);margin-bottom:1rem}
    .logo-area{text-align:center;margin-bottom:1.5rem}
    .logo-img{height:64px;width:auto;margin-bottom:.5rem}
    .mascote-wrap{display:flex;justify-content:center;margin-bottom:1.25rem}
    .mascote-img{height:140px;width:auto;border-radius:50%;box-shadow:0 4px 16px rgba(30,159,217,0.2)}
    h1{font-size:20px;font-weight:700;color:#0F4C7A;text-align:center;margin-bottom:6px}
    .subtitle{font-size:14px;color:#5A7A8F;text-align:center;margin-bottom:1.75rem}
    label{font-size:13px;color:#0F4C7A;font-weight:600;display:block;margin-bottom:6px}
    input{width:100%;height:48px;border-radius:12px;border:1.5px solid #D6E5EE;font-size:15px;padding:0 14px;color:#111;margin-bottom:14px;background:#F7FBFD}
    input:focus{outline:none;border-color:#1E9FD9;background:#fff}
    .btn-login{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none;background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff;margin-bottom:1rem;box-shadow:0 4px 12px rgba(30,159,217,0.3)}
    .btn-login:disabled{opacity:.5;cursor:not-allowed}
    .divider{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:#D6E5EE}
    .divider span{font-size:12px;color:#94A8B8}
    .btn-confirmar{width:100%;padding:14px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid #D6E5EE;background:#fff;color:#0F4C7A}
    .msg{border-radius:11px;padding:12px 16px;font-size:14px;text-align:center;display:none;font-weight:500;margin-top:4px}
    .msg.error{background:#FCEBEB;color:#791F1F;border:1.5px solid #F09595;display:block}
    .msg.loading{background:#E8F4FB;color:#0F4C7A;border:1.5px solid #BFE0F0;display:block}
    .footer{text-align:center;font-size:11px;color:#94A8B8;margin-top:.75rem}

    .greet{font-size:14px;color:#5A7A8F;text-align:center;margin-bottom:6px}
    .greet-nome{font-size:20px;font-weight:700;color:#0F4C7A;text-align:center;margin-bottom:1.25rem}
    .rota-option{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;border-radius:14px;border:1.5px solid #D6E5EE;background:#fff;margin-bottom:10px;cursor:pointer;transition:all .2s;text-align:left}
    .rota-option:hover:not(.disabled){border-color:#1E9FD9;background:#F7FBFD;transform:translateY(-1px);box-shadow:0 4px 12px rgba(30,159,217,0.15)}
    .rota-option.disabled{opacity:.55;cursor:not-allowed;background:#F0F4F8;border-color:#D6E5EE}
    .rota-option.minha{border-color:#1E9FD9;background:#E8F4FB}
    .rota-option-info{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
    .rota-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#E8F4FB,#BFE0F0);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
    .rota-icon.lock{background:#FCEBEB}
    .rota-icon.mine{background:#1E9FD9;color:#fff}
    .rota-name{font-size:15px;font-weight:700;color:#0F4C7A}
    .rota-status{font-size:11px;color:#94A8B8;margin-top:2px}
    .rota-status.travada{color:#A32D2D;font-weight:600}
    .rota-status.minha{color:#1E9FD9;font-weight:600}
    .rota-arrow{color:#1E9FD9;font-size:20px;font-weight:bold;flex-shrink:0}
    .btn-voltar{width:100%;padding:12px;border-radius:11px;border:1.5px solid #D6E5EE;background:#fff;color:#5A7A8F;font-size:14px;font-weight:500;cursor:pointer;margin-top:8px}

    #view-login,#view-rotas{display:none}
    #view-login.visible,#view-rotas.visible{display:block}
  </style>
</head>
<body>
<div class="container">

  <div id="view-login" class="visible">
    <div class="card">
      <div class="logo-area">
        <div class="mascote-wrap">
          <img src="761B1410-BF55-4955-AD0E-BA388B9E6625.png" alt="Loglife" class="mascote-img"/>
        </div>
        <img src="20050686-7618-4EE2-86F2-0E0E1EE012BE.png" alt="Loglife" class="logo-img"/>
      </div>
      <h1>Operação Loglife/Pardini</h1>
      <p class="subtitle">Digite seu telefone para acessar sua rota</p>
      <label for="telefone">Número de telefone</label>
      <input type="tel" id="telefone" placeholder="(11) 99999-9999" maxlength="15"/>
      <button class="btn-login" id="btn-entrar">Acessar minha rota</button>
      <div class="msg" id="msg"></div>
      <div class="divider"><span>ou</span></div>
      <button class="btn-confirmar" onclick="window.location.href='confirmar.html'">
        ✓ Confirmação de Rota
      </button>
    </div>
    <div class="footer">Loglife &mdash; Operação Loglife/Pardini</div>
  </div>

  <div id="view-rotas">
    <div class="card">
      <div class="logo-area" style="margin-bottom:1rem">
        <img src="20050686-7618-4EE2-86F2-0E0E1EE012BE.png" alt="Loglife" class="logo-img" style="height:48px"/>
      </div>
      <p class="greet">Bem-vindo,</p>
      <div class="greet-nome" id="greet-nome">—</div>
      <p class="subtitle" id="rotas-subtitle">Selecione sua rota para hoje</p>
      <div id="lista-rotas"></div>
      <button class="btn-voltar" onclick="voltarLogin()">← Voltar</button>
    </div>
    <div class="footer">Loglife</div>
  </div>

</div>

<script>
  const API = 'https://confirmacaoderota.willlog99.workers.dev';
  const input = document.getElementById('telefone');
  const btn   = document.getElementById('btn-entrar');

  // Auto-login: se já tem dados salvos, vai direto pra rota
  const telSalvo = localStorage.getItem('motoboy_tel');
  const rotaSalva = localStorage.getItem('motoboy_rota');
  if (telSalvo && rotaSalva && !window.location.hash.includes('trocar')) {
    window.location.href = 'rota.html';
  }

  input.addEventListener('input', () => {
    let v = input.value.replace(/\D/g,'').slice(0,11);
    if (v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
    else if (v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d*)$/, '($1) $2-$3');
    else if (v.length > 2) v = v.replace(/^(\d{2})(\d*)$/, '($1) $2');
    input.value = v;
  });

  input.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
  btn.addEventListener('click', entrar);

  async function entrar() {
    const tel = input.value.replace(/\D/g,'');
    if (tel.length < 10) { showMsg('Digite um telefone válido.', 'error'); return; }
    btn.disabled = true;
    showMsg('Buscando...', 'loading');
    try {
      const r = await fetch(API + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telefone: tel })
      });
      const d = await r.json();
      if (d.status === 'ok') {
        // Se só tem 1 rota livre, tenta entrar direto. Senão mostra seleção
        const rotasLivresOuMinhas = (d.rotas_info || []).filter(r => r.status !== 'travada');
        if ((d.rotas_info || []).length === 1) {
          const r0 = d.rotas_info[0];
          if (r0.status === 'travada') {
            mostrarSelecaoRotas(d.nome, d.rotas_info, tel);
          } else {
            await escolherRota(r0.rota, d.nome, tel);
          }
        } else {
          mostrarSelecaoRotas(d.nome, d.rotas_info, tel);
        }
      } else if (d.status === 'nao_encontrado') {
        showMsg('Telefone não encontrado. Fale com o organizador.', 'error');
      } else {
        showMsg('Erro ao buscar.', 'error');
      }
    } catch(e) { showMsg('Erro de conexão.', 'error'); }
    btn.disabled = false;
  }

  function mostrarSelecaoRotas(nome, rotasInfo, tel) {
    document.getElementById('view-login').classList.remove('visible');
    document.getElementById('view-rotas').classList.add('visible');
    document.getElementById('greet-nome').textContent = nome;

    const lista = document.getElementById('lista-rotas');
    lista.innerHTML = (rotasInfo || []).map(r => {
      let iconClass = '', iconChar = '🚚', statusTxt = 'Livre', statusClass = '', cls = '', click = '';
      if (r.status === 'travada') {
        iconClass = 'lock';
        iconChar = '🔒';
        statusTxt = `Em uso por ${r.por || 'outro motorista'}`;
        statusClass = 'travada';
        cls = 'disabled';
        click = '';
      } else if (r.status === 'minha') {
        iconClass = 'mine';
        iconChar = '▶';
        statusTxt = 'Continuar minha rota';
        statusClass = 'minha';
        click = `onclick="escolherRota('${r.rota.replace(/'/g,"\\'")}', '${nome.replace(/'/g,"\\'")}', '${tel}')"`;
      } else {
        click = `onclick="escolherRota('${r.rota.replace(/'/g,"\\'")}', '${nome.replace(/'/g,"\\'")}', '${tel}')"`;
      }
      return `
        <div class="rota-option ${cls} ${r.status==='minha'?'minha':''}" ${click}>
          <div class="rota-option-info">
            <div class="rota-icon ${iconClass}">${iconChar}</div>
            <div>
              <div class="rota-name">${r.rota}</div>
              <div class="rota-status ${statusClass}">${statusTxt}</div>
            </div>
          </div>
          ${r.status !== 'travada' ? '<div class="rota-arrow">→</div>' : ''}
        </div>`;
    }).join('');
  }

  async function escolherRota(rota, nome, tel) {
    // Trava a rota
    const r = await fetch(API + '/abrir-rota', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ telefone: tel, rota, nome })
    });
    const d = await r.json();
    if (d.status === 'travada') {
      alert(`Esta rota foi aberta por ${d.por || 'outro motorista'}. Aguarde a finalização ou contate o organizador.`);
      // Recarrega
      window.location.reload();
      return;
    }
    localStorage.setItem('motoboy_nome', nome);
    localStorage.setItem('motoboy_rota', rota);
    localStorage.setItem('motoboy_tel', tel);
    window.location.href = 'rota.html';
  }

  function voltarLogin() {
    document.getElementById('view-rotas').classList.remove('visible');
    document.getElementById('view-login').classList.add('visible');
    document.getElementById('telefone').value = '';
    document.getElementById('msg').className = 'msg';
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }
</script>
</body>
</html>
