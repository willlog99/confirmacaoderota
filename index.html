<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loglife — Operação Loglife/Pardini</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#1E9FD9"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Loglife"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#E8F4FB 0%,#F0F4F8 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem}
    .container{width:100%;max-width:420px}
    .card{background:#fff;border-radius:24px;padding:2rem 1.75rem;box-shadow:0 4px 20px rgba(30,159,217,0.12);margin-bottom:1rem}
    .logo-area{text-align:center;margin-bottom:1.5rem}
    .logo-img{height:64px;width:auto;margin-bottom:.5rem}
    .mascote-wrap{display:flex;justify-content:center;margin-bottom:1.25rem}
    .mascote-img{height:140px;width:auto;border-radius:50%;box-shadow:0 4px 16px rgba(30,159,217,0.2)}
    h1{font-size:20px;font-weight:700;color:#0F4C7A;text-align:center;margin-bottom:6px}
    .subtitle{font-size:14px;color:#5A7A8F;text-align:center;margin-bottom:1.75rem}
    label{font-size:13px;color:#0F4C7A;font-weight:600;display:block;margin-bottom:6px}
    input{width:100%;height:48px;border-radius:12px;border:1.5px solid #D6E5EE;font-size:15px;padding:0 14px;color:#111;margin-bottom:14px;background:#F7FBFD}
    input:focus{outline:none;border-color:#1E9FD9;background:#fff}
    .btn-login{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none;background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff;margin-bottom:1rem;box-shadow:0 4px 12px rgba(30,159,217,0.3)}
    .btn-login:disabled{opacity:.5;cursor:not-allowed}
    .msg{border-radius:11px;padding:12px 16px;font-size:14px;text-align:center;display:none;font-weight:500;margin-top:4px}
    .msg.error{background:#FCEBEB;color:#791F1F;border:1.5px solid #F09595;display:block}
    .msg.loading{background:#E8F4FB;color:#0F4C7A;border:1.5px solid #BFE0F0;display:block}
    .footer{text-align:center;font-size:11px;color:#94A8B8;margin-top:.75rem}

    .modal-overlay{position:fixed;inset:0;background:rgba(15,75,122,0.6);z-index:200;display:flex;align-items:center;justify-content:center}
    .modal-overlay.hidden{display:none}
    .modal{background:#fff;border-radius:20px;padding:2rem 1.75rem;width:90%;max-width:380px;text-align:center}
    .modal h2{font-size:18px;font-weight:700;color:#0F4C7A;margin-bottom:1rem}
    .modal p{font-size:14px;color:#5A7A8F;margin-bottom:1.5rem;line-height:1.5}
    .modal-btns{display:flex;flex-direction:column;gap:10px}
    .modal-btn{padding:13px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center}
    .modal-btn.primary{background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff}
    .modal-btn.secondary{background:#fff;color:#5A7A8F;border:1.5px solid #D6E5EE}

    .rota-option{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:11px;border:1.5px solid #D6E5EE;background:#fff;margin-bottom:8px;cursor:pointer;transition:all .2s;text-align:left}
    .rota-option:hover{border-color:#1E9FD9;background:#F7FBFD;transform:translateY(-1px)}
    .rota-option-info{flex:1;min-width:0}
    .rota-name{font-size:14px;font-weight:700;color:#0F4C7A}
    .rota-arrow{color:#1E9FD9;font-size:18px;font-weight:bold;flex-shrink:0}
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="logo-area">
      <div class="mascote-wrap">
        <img src="761B1410-BF55-4955-AD0E-BA388B9E6625.png" alt="Loglife" class="mascote-img"/>
      </div>
      <img src="20050686-7618-4EE2-86F2-0E0E1EE012BE.png" alt="Loglife" class="logo-img"/>
    </div>
    <h1>Operação Loglife/Pardini</h1>
    <p class="subtitle">Digite seu telefone para continuar</p>
    <label for="telefone">Número de telefone</label>
    <input type="tel" id="telefone" placeholder="(11) 99999-9999" maxlength="15"/>
    <button class="btn-login" id="btn-entrar">Continuar</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="footer">Loglife &mdash; Operação Loglife/Pardini</div>
</div>

<!-- MODAL: CONFIRMAR OU ACESSAR ROTA -->
<div class="modal-overlay hidden" id="modal-opcoes">
  <div class="modal">
    <h2>O que deseja fazer?</h2>
    <p>Escolha uma opção para continuar</p>
    <div class="modal-btns">
      <button class="modal-btn primary" onclick="irParaConfirmacao()">✓ Confirmar presença</button>
      <button class="modal-btn secondary" onclick="mostrarSelecaoRotas('acessar')">🚚 Acessar minha rota</button>
    </div>
  </div>
</div>

<!-- MODAL: SELEÇÃO DE ROTAS -->
<div class="modal-overlay hidden" id="modal-rotas">
  <div class="modal">
    <h2>🛣️ Selecione sua rota</h2>
    <p>Você tem múltiplas rotas. Escolha qual deseja abrir:</p>
    <div id="lista-rotas-modal"></div>
  </div>
</div>

<script>
  const API = 'https://confirmacaoderota.willlog99.workers.dev';
  const input = document.getElementById('telefone');
  const btn = document.getElementById('btn-entrar');
  let telefoneSalvo = null;
  let nomeUsuario = null;
  let rotasDisponivel = [];
  let proximoFluxo = null;

  // Formatar telefone
  input.addEventListener('input', function() {
    let v = this.value.replace(/\D/g,'').slice(0,11);
    if (v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
    else if (v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d*)$/, '($1) $2-$3');
    else if (v.length > 2) v = v.replace(/^(\d{2})(\d*)$/, '($1) $2');
    this.value = v;
  });

  input.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
  btn.addEventListener('click', entrar);

  async function entrar() {
    const tel = input.value.replace(/\D/g,'');
    if (tel.length < 10) { showMsg('Digite um telefone válido.', 'error'); return; }
    
    btn.disabled = true;
    showMsg('Buscando...', 'loading');
    
    try {
      const r = await fetch(API + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telefone: tel })
      });
      const d = await r.json();
      
      if (d.status === 'ok') {
        telefoneSalvo = tel;
        nomeUsuario = d.nome;
        rotasDisponivel = d.rotas_info || [];
        
        // Verificar se já confirmou hoje
        const confirmouHoje = await verificarConfirmacao(tel);
        
        if (confirmouHoje) {
          // Já confirmou → verifica se preencheu checklist antes
          const precisaChecklist = await verificarChecklistObrigatorio();
          if (precisaChecklist) {
            alert('⚠️ Você precisa preencher seu checklist antes de continuar!\n\nClique em OK para preencher.');
            localStorage.setItem('telefone_temp', telefoneSalvo);
            localStorage.setItem('nome_temp', nomeUsuario);
            window.location.href = 'confirmar.html?checklist_obrigatorio=true';
            return;
          }
          // Já confirmou e fez checklist → vai direto pro modal de seleção de rotas
          mostrarSelecaoRotas('acessar');
        } else {
          // Não confirmou → mostra opções (confirmar ou acessar)
          document.getElementById('modal-opcoes').classList.remove('hidden');
        }
      } else if (d.status === 'sem_rota') {
        // Motoboy existe mas não tem rota → vai para confirmação e depois chat
        telefoneSalvo = tel;
        nomeUsuario = d.nome;
        rotasDisponivel = [];
        localStorage.setItem('telefone_temp', tel);
        localStorage.setItem('nome_temp', d.nome);
        
        // Verificar se já confirmou hoje
        const confirmouHoje = await verificarConfirmacao(tel);
        if (confirmouHoje) {
          // Já confirmou → verifica checklist
          const precisaChecklist = await verificarChecklistObrigatorio();
          if (precisaChecklist) {
            alert('⚠️ Você precisa preencher seu checklist antes de continuar!\n\nClique em OK para preencher.');
            window.location.href = 'confirmar.html?checklist_obrigatorio=true&sem_rota=1';
            return;
          }
          // Já fez tudo → vai para chat
          localStorage.setItem('motoboy_tel', tel);
          localStorage.setItem('motoboy_nome', d.nome);
          window.location.href = 'semrota.html';
        } else {
          // Não confirmou → vai para confirmação de presença
          window.location.href = 'confirmar.html?sem_rota=1';
        }
      } else {
        showMsg('Telefone não encontrado. Fale com o organizador.', 'error');
      }
    } catch(e) {
      showMsg('Erro de conexão.', 'error');
    }
    btn.disabled = false;
  }

  async function verificarConfirmacao(tel) {
    try {
      const r = await fetch(API + '/');
      const d = await r.json();
      const confirmacoes = d.confirmacoes || [];
      // Verifica se ESTE biocondutor já confirmou hoje
      return confirmacoes.some(c => c.biocondutor === nomeUsuario);
    } catch(e) {
      return false;
    }
  }

  function irParaConfirmacao() {
    document.getElementById('modal-opcoes').classList.add('hidden');
    localStorage.setItem('telefone_temp', telefoneSalvo);
    localStorage.setItem('nome_temp', nomeUsuario);
    
    // Verificar se precisa preencher checklist obrigatório (confirmou mas não preencheu)
    verificarChecklistObrigatorio().then(precisa => {
      if (precisa) {
        alert('⚠️ Você confirmou presença mas ainda não preencheu seu checklist!\n\nVocê precisa preencher o checklist para continuar.');
        window.location.href = 'confirmar.html?checklist_obrigatorio=true';
        return;
      }
      
      // Verificar se tem checklist incompleto
      const checklistIncompleto = localStorage.getItem('checklist_incompleto_' + nomeUsuario);
      if (checklistIncompleto) {
        if (confirm('Você tem um checklist incompleto. Deseja continuar preenchendo?')) {
          window.location.href = 'confirmar.html?continuar=true';
          return;
        } else {
          localStorage.removeItem('checklist_incompleto_' + nomeUsuario);
        }
      }
      
      window.location.href = 'confirmar.html';
    });
  }

  async function verificarChecklistObrigatorio() {
    try {
      const r = await fetch(API + '/checklist/verificar?nome=' + encodeURIComponent(nomeUsuario));
      const d = await r.json();
      return d.precisa_preencher === true;
    } catch(e) { return false; }
  }

  function mostrarSelecaoRotas(fluxo) {
    proximoFluxo = fluxo;
    
    if (rotasDisponivel.length === 0) {
      showMsg('Você não tem rotas disponíveis.', 'error');
      return;
    }

    if (rotasDisponivel.length === 1) {
      irParaRota(rotasDisponivel[0].rota);
      return;
    }

    // Múltiplas rotas → mostra modal
    const lista = document.getElementById('lista-rotas-modal');
    lista.innerHTML = rotasDisponivel.map(r => `
      <div class="rota-option" onclick="irParaRota('${r.rota.replace(/'/g,"\\'")}')" style="cursor:pointer">
        <div class="rota-option-info">
          <div class="rota-name">🚚 ${r.rota}</div>
        </div>
        <div class="rota-arrow">→</div>
      </div>
    `).join('');

    document.getElementById('modal-opcoes').classList.add('hidden');
    document.getElementById('modal-rotas').classList.remove('hidden');
  }

  async function irParaRota(rota) {
    localStorage.setItem('motoboy_tel', telefoneSalvo);
    localStorage.setItem('motoboy_nome', nomeUsuario);
    localStorage.setItem('motoboy_rota', rota);
    window.location.href = 'rota.html';
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  // Verificar flag de refresh do admin a cada 10s
  let ultimaFlagVistaIdx = null;
  async function verificarRefreshFlagIdx() {
    try {
      const r = await fetch(API + '/refresh-flag');
      const d = await r.json();
      if (!d.flag) return;
      if (ultimaFlagVistaIdx === null) {
        ultimaFlagVistaIdx = d.flag;
        return;
      }
      if (d.flag !== ultimaFlagVistaIdx) {
        ultimaFlagVistaIdx = d.flag;
        alert('🔄 O administrador enviou uma atualização. O app será recarregado.');
        await limparCacheERecarregarIdx();
      }
    } catch(e) {}
  }

  async function limparCacheERecarregarIdx() {
    try {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
    } catch(e) {}
    window.location.reload(true);
  }
  setInterval(verificarRefreshFlagIdx, 10000);
  setTimeout(verificarRefreshFlagIdx, 2000);

  // Registrar Service Worker (PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/confirmacaoderota/sw.js')
        .catch(err => console.log('SW erro:', err));
    });
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data && e.data.type === 'RELOAD') {
        alert('🔄 O administrador enviou uma atualização. O app será recarregado.');
        window.location.reload();
      }
    });
  }
  try {
    const bc = new BroadcastChannel('loglife_refresh');
    bc.onmessage = e => {
      if (e.data && e.data.type === 'RELOAD') {
        alert('🔄 O administrador enviou uma atualização. O app será recarregado.');
        window.location.reload();
      }
    };
  } catch(e) {}
</script>
</body>
</html>
