<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:"/>
  <title>Loglife</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#E8F4FB;font-family:-apple-system,sans-serif;overflow:hidden}
    #webview{position:fixed;inset:0;width:100%;height:100%;border:none}
    #splash{position:fixed;inset:0;background:linear-gradient(135deg,#0F4C7A,#1E9FD9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .5s}
    #splash.hidden{opacity:0;pointer-events:none}
    .splash-logo{font-size:48px;margin-bottom:16px}
    .splash-name{font-size:22px;font-weight:700;color:#fff;letter-spacing:.05em}
    .splash-sub{font-size:13px;color:rgba(255,255,255,.6);margin-top:6px}
    .splash-spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-top:32px}
    @keyframes spin{to{transform:rotate(360deg)}}
    #update-banner{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#0F4C7A,#1E9FD9);color:#fff;padding:14px 20px;display:none;align-items:center;justify-content:space-between;z-index:9999;box-shadow:0 -4px 20px rgba(15,76,122,.3)}
    #update-banner.show{display:flex}
    .update-text{font-size:13px;font-weight:600}
    .update-text span{font-size:11px;opacity:.7;display:block;margin-top:2px}
    .update-btn{background:#fff;color:#0F4C7A;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer}
    #update-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#0F9B78;color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;display:none;align-items:center;gap:8px;z-index:9999;box-shadow:0 4px 16px rgba(15,155,120,.4)}
    #update-toast.show{display:flex}
  </style>
</head>
<body>

<div id="splash">
  <div class="splash-logo">🛵</div>
  <div class="splash-name">Loglife</div>
  <div class="splash-sub">Hermes Pardini</div>
  <div class="splash-spinner"></div>
</div>

<iframe id="webview" src="https://willlog99.github.io/confirmacaoderota/" allow="geolocation" onload="esconderSplash()"></iframe>

<div id="update-banner">
  <div class="update-text">Nova versao disponivel<span id="update-versao-txt"></span></div>
  <button class="update-btn" onclick="atualizarApp()">Atualizar</button>
</div>

<div id="update-toast">App atualizado!</div>

<script type="module">
  import { Geolocation } from '@capacitor/geolocation';
  import { LocalNotifications } from '@capacitor/local-notifications';
  import { App } from '@capacitor/app';

  const API = 'https://confirmacaoderota.willlog99.workers.dev';
  const VERSAO_ATUAL = '1.0.1';
  const GPS_INTERVALO = 60 * 1000; // 1 minuto

  let gpsInterval = null;
  let appEmBackground = false;

  // ── SPLASH ──────────────────────────────────────────────────
  window.esconderSplash = function() {
    setTimeout(() => {
      document.getElementById('splash').classList.add('hidden');
      verificarAtualizacao();
    }, 800);
  };

  // ── VERSAO ───────────────────────────────────────────────────
  async function verificarAtualizacao() {
    try {
      const versaoAnterior = localStorage.getItem('loglife_versao');
      if (versaoAnterior && versaoAnterior !== VERSAO_ATUAL) {
        localStorage.setItem('loglife_versao', VERSAO_ATUAL);
        mostrarToast();
        return;
      }
      localStorage.setItem('loglife_versao', VERSAO_ATUAL);
      await checarVersaoServidor();
    } catch(e) {}
  }

  async function checarVersaoServidor() {
    try {
      const r = await fetch(API + '/app-versao', { cache: 'no-store' });
      const d = await r.json();
      if (d.versao && d.versao !== VERSAO_ATUAL) {
        document.getElementById('update-versao-txt').textContent = 'v' + d.versao;
        document.getElementById('update-banner').classList.add('show');
      }
    } catch(e) {}
  }

  function mostrarToast() {
    const t = document.getElementById('update-toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  window.atualizarApp = function() {
    const webview = document.getElementById('webview');
    document.getElementById('update-banner').classList.remove('show');
    webview.src = 'about:blank';
    setTimeout(() => {
      webview.src = 'https://willlog99.github.io/confirmacaoderota/?v=' + Date.now();
      localStorage.setItem('loglife_versao', VERSAO_ATUAL);
      mostrarToast();
    }, 500);
  };

  setInterval(checarVersaoServidor, 5 * 60 * 1000);

  // ── GPS ──────────────────────────────────────────────────────
  async function enviarPosicao(nome) {
    try {
      const pos = await Geolocation.getCurrentPosition({
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 30000
      });
      if (!pos?.coords) return;
      await fetch(API + '/localizacao', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome,
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          precisao: pos.coords.accuracy,
          timestamp: Date.now()
        })
      });
    } catch(e) {}
  }

  function iniciarGPS(nome) {
    pararGPS();
    localStorage.setItem('motoboy_nome', nome);
    // Enviar imediatamente
    enviarPosicao(nome);
    // Enviar a cada 1 minuto
    gpsInterval = setInterval(() => enviarPosicao(nome), GPS_INTERVALO);
    // Notificacao persistente
    mostrarNotificacaoGPS(nome);
    console.log('[Loglife] GPS 1min iniciado para:', nome);
  }

  function pararGPS() {
    if (gpsInterval) {
      clearInterval(gpsInterval);
      gpsInterval = null;
    }
  }

  // ── NOTIFICACAO PERSISTENTE (Foreground Service) ─────────────
  async function mostrarNotificacaoGPS(nome) {
    try {
      await LocalNotifications.requestPermissions();
      // Cancelar notificacao anterior se existir
      await LocalNotifications.cancel({ notifications: [{ id: 1 }] }).catch(() => {});
      await LocalNotifications.schedule({
        notifications: [{
          id: 1,
          title: 'Loglife em execucao',
          body: nome + ' - GPS ativo',
          ongoing: true,        // nao pode ser dispensada pelo usuario
          autoCancel: false,
          smallIcon: 'ic_stat_icon_config_sample',
          iconColor: '#0F4C7A',
          schedule: { at: new Date(Date.now() + 100) }
        }]
      });
    } catch(e) {}
  }

  async function cancelarNotificacaoGPS() {
    try {
      await LocalNotifications.cancel({ notifications: [{ id: 1 }] });
    } catch(e) {}
  }

  // ── APP STATE (foreground/background) ───────────────────────
  // Usar App.addListener para detectar mudanca de estado no Capacitor
  try {
    App.addListener('appStateChange', ({ isActive }) => {
      const nome = localStorage.getItem('motoboy_nome');
      if (!nome) return;
      appEmBackground = !isActive;
      if (isActive) {
        // Voltou para foreground — reativar GPS se estava rodando
        if (!gpsInterval) iniciarGPS(nome);
        console.log('[Loglife] App em foreground');
      }
      // Em background, o setInterval continua rodando no WebView
      // enquanto a notificacao persistente mantiver o processo vivo
    });
  } catch(e) {}

  // ── MENSAGENS DO IFRAME ──────────────────────────────────────
  window.addEventListener('message', async (e) => {
    if (e.data?.type === 'MOTOBOY_CONFIRMOU') {
      await Geolocation.requestPermissions({ permissions: ['location', 'coarseLocation'] });
      iniciarGPS(e.data.nome);
    }
    if (e.data?.type === 'MOTOBOY_SAIU') {
      pararGPS();
      cancelarNotificacaoGPS();
      localStorage.removeItem('motoboy_nome');
    }
  });

  // ── INICIALIZAR ──────────────────────────────────────────────
  async function inicializar() {
    try {
      await Geolocation.requestPermissions({ permissions: ['location', 'coarseLocation'] });
      await LocalNotifications.requestPermissions();

      // Se ja tem nome salvo (app reabriu), reativar GPS
      const nome = localStorage.getItem('motoboy_nome');
      if (nome) iniciarGPS(nome);

    } catch(e) { console.warn('[Init]', e); }
  }

  document.addEventListener('DOMContentLoaded', inicializar);
</script>
</body>
</html>
