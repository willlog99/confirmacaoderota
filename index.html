<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Biocondutor na Rota</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
    .container{width:100%;max-width:420px}
    .card{background:#fff;border-radius:20px;padding:2rem;box-shadow:0 2px 16px rgba(0,0,0,0.08);margin-bottom:1rem}
    .logo{width:60px;height:60px;background:linear-gradient(135deg,#1D9E75,#0d7a5a);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem}
    .logo svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    h1{font-size:22px;font-weight:700;color:#111;text-align:center;margin-bottom:6px}
    .subtitle{font-size:14px;color:#888;text-align:center;margin-bottom:2rem}
    label{font-size:13px;color:#555;font-weight:500;display:block;margin-bottom:6px}
    input{width:100%;height:46px;border-radius:11px;border:1.5px solid #e2e8f0;font-size:15px;padding:0 14px;color:#111;margin-bottom:14px;transition:border-color .2s}
    input:focus{outline:none;border-color:#1D9E75}
    .btn-login{width:100%;padding:14px;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer;border:none;background:linear-gradient(135deg,#1D9E75,#0d7a5a);color:#fff;transition:opacity .2s;margin-bottom:1rem}
    .btn-login:hover{opacity:.9}
    .btn-login:disabled{opacity:.5;cursor:not-allowed}
    .divider{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:#e2e8f0}
    .divider span{font-size:12px;color:#bbb}
    .btn-confirmar{width:100%;padding:14px;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer;border:1.5px solid #e2e8f0;background:#fff;color:#555;transition:all .2s}
    .btn-confirmar:hover{background:#f0f4f8;border-color:#ccc}
    .msg{border-radius:11px;padding:12px 16px;font-size:14px;text-align:center;display:none;font-weight:500;margin-top:4px}
    .msg.error{background:#FCEBEB;color:#791F1F;border:1.5px solid #F09595;display:block}
    .msg.loading{background:#f0f4f8;color:#555;border:1.5px solid #e2e8f0;display:block}
    .footer{text-align:center;font-size:12px;color:#bbb;margin-top:.75rem}
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <h1>Biocondutor na Rota</h1>
    <p class="subtitle">Digite seu telefone para acessar sua rota</p>

    <label for="telefone">Número de telefone</label>
    <input type="tel" id="telefone" placeholder="(11) 99999-9999" maxlength="15"/>

    <button class="btn-login" id="btn-entrar">Acessar minha rota</button>
    <div class="msg" id="msg"></div>

    <div class="divider"><span>ou</span></div>

    <button class="btn-confirmar" onclick="window.location.href='confirmar.html'">
      ✓ Confirmar presença do Biocondutor
    </button>
  </div>
  <div class="footer">Biocondutor na Rota</div>
</div>

<script>
  const API = 'https://confirmacaoderota.willlog99.workers.dev';

  const input = document.getElementById('telefone');
  const btn   = document.getElementById('btn-entrar');

  // Máscara de telefone
  input.addEventListener('input', () => {
    let v = input.value.replace(/\D/g,'').slice(0,11);
    if (v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
    else if (v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d*)$/, '($1) $2-$3');
    else if (v.length > 2) v = v.replace(/^(\d{2})(\d*)$/, '($1) $2');
    input.value = v;
  });

  input.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
  btn.addEventListener('click', entrar);

  async function entrar() {
    const tel = input.value.replace(/\D/g,'');
    if (tel.length < 10) { showMsg('Digite um telefone válido.', 'error'); return; }

    btn.disabled = true;
    showMsg('Buscando...', 'loading');

    try {
      const r = await fetch(API + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telefone: tel })
      });
      const d = await r.json();

      if (d.status === 'ok') {
        localStorage.setItem('motoboy_nome', d.nome);
        localStorage.setItem('motoboy_rota', d.rota);
        localStorage.setItem('motoboy_tel', tel);
        window.location.href = 'rota.html';
      } else if (d.status === 'nao_encontrado') {
        showMsg('Telefone não encontrado. Fale com o organizador.', 'error');
      } else {
        showMsg('Erro ao buscar. Tente novamente.', 'error');
      }
    } catch(e) {
      showMsg('Erro de conexão. Verifique sua internet.', 'error');
    }

    btn.disabled = false;
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }
</script>
</body>
</html>
