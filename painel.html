<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loglife — Painel</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0F4F8;color:#0F4C7A;min-height:100vh}
    .topbar{background:#fff;padding:0 1rem;height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #D6E5EE;box-shadow:0 1px 3px rgba(30,159,217,0.06);position:sticky;top:0;z-index:100}
    .menu-btn{background:#E8F4FB;color:#0F4C7A;border:none;height:38px;padding:0 14px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer}
    .topbar-title{font-size:15px;font-weight:700;color:#0F4C7A;flex:1;text-align:center}
    .topbar-logo{height:28px}
    .dia-bar{background:#0F4C7A;padding:7px 1rem;display:flex;align-items:center;gap:10px;justify-content:center}
    .dia-bar select{height:30px;border-radius:7px;border:none;font-size:13px;padding:0 10px;background:#fff;color:#0F4C7A;font-weight:600;cursor:pointer}
    .dia-bar span{color:#9FE0FF;font-size:12px;font-weight:600}
    .menu-overlay{position:fixed;inset:0;background:rgba(15,75,122,0.55);z-index:200;display:none}
    .menu-overlay.open{display:flex}
    .menu-side{background:#fff;width:280px;max-width:85vw;height:100%;display:flex;flex-direction:column;overflow-y:auto}
    .menu-header{background:linear-gradient(135deg,#1E9FD9,#0F7BB0);padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .menu-close{background:rgba(255,255,255,0.2);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px}
    .menu-category{border-bottom:1px solid #EBF1F5}
    .menu-cat-btn{width:100%;padding:11px 1.25rem;background:#F7FBFD;border:none;text-align:left;font-size:11px;font-weight:700;color:#5A7A8F;cursor:pointer;display:flex;align-items:center;justify-content:space-between;text-transform:uppercase;letter-spacing:.5px}
    .menu-cat-btn:hover{background:#EBF1F5}
    .menu-cat-items{display:none}
    .menu-cat-items.open{display:block}
    .menu-item{display:block;width:100%;padding:12px 1.5rem;background:#fff;border:none;text-align:left;font-size:14px;font-weight:500;color:#0F4C7A;cursor:pointer;border-left:3px solid transparent}
    .menu-item:hover{background:#F7FBFD;border-left-color:#BFE0F0}
    .menu-item.active{background:#E8F4FB;border-left-color:#1E9FD9;font-weight:700}
    .menu-item.danger{color:#A32D2D}
    .menu-item.danger:hover{background:#FCEBEB}
    .content{padding:1.25rem;max-width:900px;margin:0 auto}
    .view{display:none}
    .view.active{display:block}
    .card{background:#fff;border-radius:14px;padding:1.25rem;box-shadow:0 1px 5px rgba(30,159,217,0.07);margin-bottom:1rem}
    .card-title{font-size:16px;font-weight:700;color:#0F4C7A;margin-bottom:1rem}
    .field{margin-bottom:.9rem}
    .field label{display:block;font-size:11px;font-weight:700;color:#5A7A8F;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
    .field input,.field select{width:100%;height:42px;border-radius:9px;border:1.5px solid #D6E5EE;font-size:14px;padding:0 12px;color:#0F4C7A;background:#fff;outline:none}
    .field input:focus,.field select:focus{border-color:#1E9FD9}
    .btn{height:42px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;padding:0 16px;display:inline-flex;align-items:center;gap:6px}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-primary{background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff}
    .btn-secondary{background:#fff;color:#0F4C7A;border:1.5px solid #D6E5EE}
    .btn-danger{background:#DC2626;color:#fff}
    .btn-warning{background:#F59E0B;color:#fff}
    .btn-block{width:100%;justify-content:center}
    .list-item{padding:12px;border-radius:10px;border:1.5px solid #D6E5EE;margin-bottom:8px;background:#fff}
    .list-item-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .list-item-name{font-size:14px;font-weight:700;color:#0F4C7A;flex:1;min-width:0}
    .list-item-meta{font-size:12px;color:#5A7A8F}
    .list-item-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
    .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
    .badge-ativa{background:#FEF3C7;color:#92400E}
    .badge-livre{background:#E1F5EE;color:#085041}
    .badge-pendente{background:#FEF9EC;color:#92400E}
    .rota-card{background:#fff;border-radius:12px;border:1.5px solid #D6E5EE;margin-bottom:10px;overflow:hidden}
    .rota-card.ativa{border-color:#F2A536}
    .rota-header{padding:12px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;user-select:none}
    .rota-nome{font-size:15px;font-weight:700;color:#0F4C7A;flex:1}
    .rota-expand{background:#F7FBFD;padding:12px 14px;border-top:1px solid #EBF1F5;display:none}
    .rota-expand.open{display:block}
    .cli-mini{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:#fff;border:1px solid #EBF1F5;margin-bottom:4px;font-size:12px}
    .cli-mini.feito{background:#E8F4FB}
    .cli-mini.imp{background:#F0F4F8}
    .cli-icon{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;background:#fff;border:1px solid #D6E5EE;flex-shrink:0}
    .cli-icon.ok{background:#1E9FD9;border-color:#1E9FD9;color:#fff}
    .cli-icon.bad{background:#5A7A8F;border-color:#5A7A8F;color:#fff}
    .cli-icon.ch{background:#F2CC70;border-color:#F2CC70}
    .conf-item{padding:12px;border-radius:10px;margin-bottom:8px;border:1.5px solid}
    .conf-sim{background:#E1F5EE;border-color:#85DDBA;color:#085041}
    .conf-nao{background:#FCEBEB;border-color:#F09595;color:#791F1F}
    .modal-overlay{position:fixed;inset:0;background:rgba(15,75,122,0.5);z-index:300;display:flex;align-items:flex-end;justify-content:center}
    .modal-overlay.hidden{display:none}
    .modal{background:#fff;border-radius:20px 20px 0 0;padding:1.5rem;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
    .modal h2{font-size:17px;font-weight:700;color:#0F4C7A;margin-bottom:1rem}
    .modal-btns{display:flex;gap:8px;margin-top:1rem}
    .modal-btns .btn{flex:1;justify-content:center}
    .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#0F4C7A;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1}
    .msg{padding:10px 14px;border-radius:9px;font-size:13px;font-weight:500;margin-top:10px;display:none;text-align:center}
    .msg.success{background:#E8F4FB;color:#0F4C7A;border:1.5px solid #1E9FD9;display:block}
    .msg.error{background:#FCEBEB;color:#791F1F;border:1.5px solid #F09595;display:block}
    .msg.loading{background:#F7FBFD;color:#5A7A8F;border:1.5px solid #D6E5EE;display:block}
    .spinner{display:inline-block;width:13px;height:13px;border:2px solid #D6E5EE;border-top-color:#1E9FD9;border-radius:50%;animation:spin .8s linear infinite;margin-right:5px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty{text-align:center;padding:2rem;color:#94A8B8;font-size:13px}
    .search-row{display:flex;gap:8px;margin-bottom:1rem}
    .search-row input{flex:1;height:42px;border-radius:9px;border:1.5px solid #D6E5EE;padding:0 12px;font-size:14px;color:#0F4C7A;outline:none}
    .search-row input:focus{border-color:#1E9FD9}
  </style>
</head>
<body>

<div class="topbar">
  <button class="menu-btn" onclick="abrirMenu()">☰ Menu</button>
  <div class="topbar-title" id="topbar-title">🛵 Retiradas</div>
  <img src="20050686-7618-4EE2-86F2-0E0E1EE012BE.png" alt="Loglife" class="topbar-logo"/>
</div>

<div class="dia-bar">
  <span>📅 Dia:</span>
  <select id="dia-seletor" onchange="trocarDia()">
    <option value="seg-sex">Seg a Sex</option>
    <option value="sabado">Sábado</option>
    <option value="domingo">Domingo</option>
  </select>
</div>

<div class="menu-overlay" id="menu-overlay" onclick="fecharMenuOverlay(event)">
  <div class="menu-side" onclick="event.stopPropagation()">
    <div class="menu-header">
      <img src="20050686-7618-4EE2-86F2-0E0E1EE012BE.png" alt="Loglife" style="height:30px;filter:brightness(0) invert(1)"/>
      <button class="menu-close" onclick="fecharMenu()">✕</button>
    </div>

    <div class="menu-category">
      <button class="menu-cat-btn" onclick="toggleCat(this)">⚡ Operação <span>▼</span></button>
      <div class="menu-cat-items open">
        <button class="menu-item active" onclick="setView('retiradas',this,'🛵 Retiradas')">🛵 Retiradas</button>
        <button class="menu-item" onclick="setView('confirmacoes',this,'✓ Confirmações')">✓ Confirmações</button>
        <button class="menu-item" onclick="window.location.href='rotas.html'">🛣️ Rotas</button>
        <button class="menu-item" onclick="window.location.href='dashboard.html'">📊 Dashboard</button>
        <button class="menu-item" onclick="setView('motoristas',this,'👤 Motoristas')">👤 Motoristas</button>
      </div>
    </div>

    <div class="menu-category">
      <button class="menu-cat-btn" onclick="toggleCat(this)">⚙️ Configuração de OPS <span>▼</span></button>
      <div class="menu-cat-items">
        <button class="menu-item" onclick="window.location.href='criar-rota.html'">➕ Criar rota</button>
        <button class="menu-item" onclick="window.location.href='rotas.html'">✏️ Alterar rota</button>
        <button class="menu-item" onclick="setView('buscar',this,'🔎 Buscar/Mover cliente')">🔎 Buscar/Mover cliente</button>
        <button class="menu-item" onclick="setView('criar-cliente',this,'👤 Criar cliente')">👤 Criar cliente</button>
        <button class="menu-item" onclick="setView('motoristas',this,'👤 Motoristas')">➕➖ Adicionar/Excluir motoboy</button>
        <button class="menu-item" onclick="setView('ativar-cliente',this,'🔁 Ativar/Desativar cliente')">🔁 Ativar/Desativar cliente</button>
      </div>
    </div>

    <div class="menu-category">
      <button class="menu-cat-btn" onclick="toggleCat(this)">📁 Importação e Registro <span>▼</span></button>
      <div class="menu-cat-items">
        <button class="menu-item" onclick="window.location.href='importar.html'">📤 Importar</button>
        <button class="menu-item" onclick="window.location.href='exportar.html'">📥 Exportar</button>
        <button class="menu-item" onclick="window.location.href='base.html'">📋 Base de clientes</button>
        <button class="menu-item" onclick="window.location.href='historico.html'">📅 Histórico</button>
      </div>
    </div>

    <div class="menu-category">
      <button class="menu-cat-btn" onclick="toggleCat(this)">🔧 Sistema <span>▼</span></button>
      <div class="menu-cat-items">
        <button class="menu-item danger" onclick="setView('reset',this,'🔄 Reset')">🔄 Reset</button>
      </div>
    </div>

  </div>
</div>

<div class="content">

  <!-- RETIRADAS -->
  <div class="view active" id="view-retiradas">
    <div id="lista-retiradas"><div class="empty"><span class="spinner"></span> Carregando...</div></div>
  </div>

  <!-- CONFIRMAÇÕES -->
  <div class="view" id="view-confirmacoes">
    <div class="card">
      <div class="card-title">✓ Confirmações de hoje</div>
      <div id="lista-conf"><div class="empty"><span class="spinner"></span></div></div>
    </div>
  </div>

  <!-- MOTORISTAS -->
  <div class="view" id="view-motoristas">
    <div class="card">
      <div class="card-title">+ Cadastrar motorista</div>
      <div class="field"><label>Nome</label><input type="text" id="mb-nome" placeholder="Nome completo"/></div>
      <div class="field"><label>Telefone</label><input type="tel" id="mb-tel" placeholder="(11) 99999-0000"/></div>
      <button class="btn btn-primary btn-block" onclick="adicionarMotoboy()">+ Adicionar</button>
      <div class="msg" id="msg-mb"></div>
    </div>
    <div class="card">
      <div class="card-title">👤 Motoristas cadastrados</div>
      <div id="lista-mb"><div class="empty"><span class="spinner"></span></div></div>
    </div>
  </div>

  <!-- BUSCAR -->
  <div class="view" id="view-buscar">
    <div class="card">
      <div class="card-title">🔎 Buscar cliente</div>
      <div class="search-row">
        <input type="text" id="busca-input" placeholder="Nome ou código do cliente" onkeydown="if(event.key==='Enter')buscarCliente()"/>
        <button class="btn btn-primary" onclick="buscarCliente()">Buscar</button>
      </div>
      <div id="busca-resultado"></div>
    </div>
  </div>

  <!-- CRIAR CLIENTE -->
  <div class="view" id="view-criar-cliente">
    <div class="card">
      <div class="card-title">👤 Criar cliente</div>
      <div class="field"><label>Código</label><input type="text" id="cc-codigo" placeholder="Ex: 22088"/></div>
      <div class="field"><label>Nome</label><input type="text" id="cc-nome" placeholder="Nome do cliente"/></div>
      <div class="field"><label>Horário</label><input type="time" id="cc-horario"/></div>
      <button class="btn btn-primary btn-block" onclick="criarCliente()">+ Criar cliente</button>
      <div class="msg" id="msg-cc"></div>
    </div>
  </div>

  <!-- ATIVAR/DESATIVAR CLIENTE -->
  <div class="view" id="view-ativar-cliente">
    <div class="card">
      <div class="card-title">🔁 Ativar / Desativar cliente</div>
      <div class="search-row">
        <input type="text" id="ativar-input" placeholder="Nome ou código do cliente" onkeydown="if(event.key==='Enter')buscarParaAtivar()"/>
        <button class="btn btn-primary" onclick="buscarParaAtivar()">Buscar</button>
      </div>
      <div id="ativar-resultado"></div>
    </div>
  </div>

  <!-- RESET -->
  <div class="view" id="view-reset">
    <div class="card">
      <div class="card-title">⚠️ Reset do sistema</div>
      <p style="font-size:13px;color:#5A7A8F;margin-bottom:1rem">Reseta o status de todos os clientes e destrava todas as rotas.</p>
      <button class="btn btn-danger btn-block" onclick="fazerReset()">⚠️ Fazer Reset agora</button>
      <div class="msg" id="msg-reset"></div>
    </div>
    <div class="card">
      <div class="card-title">🔄 Limpar confirmações</div>
      <button class="btn btn-warning btn-block" onclick="resetConfirmacoes()">Limpar confirmações de hoje</button>
      <div class="msg" id="msg-reset-conf"></div>
    </div>
  </div>

</div>

<!-- MODAL MOVER -->
<div class="modal-overlay hidden" id="modal-mover">
  <div class="modal">
    <h2>↔ Mover cliente</h2>
    <div class="field"><label>Nova rota</label><input type="text" id="nova-rota-input" placeholder="Ex: SAO PAULO 52"/></div>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="fecharModal('modal-mover')">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarMover()">Mover</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = 'https://confirmacaoderota.willlog99.workers.dev';
  let diaAtual = localStorage.getItem('admin_dia') || 'seg-sex';
  let clienteParaMover = null;
  document.getElementById('dia-seletor').value = diaAtual;

  function getDia() { return diaAtual; }

  function trocarDia() {
    diaAtual = document.getElementById('dia-seletor').value;
    localStorage.setItem('admin_dia', diaAtual);
    const viewAtiva = document.querySelector('.view.active')?.id?.replace('view-','');
    if (viewAtiva === 'retiradas') carregarRetiradas();
  }

  function abrirMenu() { document.getElementById('menu-overlay').classList.add('open'); }
  function fecharMenu() { document.getElementById('menu-overlay').classList.remove('open'); }
  function fecharMenuOverlay(e) { if (e.target === e.currentTarget) fecharMenu(); }

  function toggleCat(btn) {
    const items = btn.nextElementSibling;
    const aberto = items.classList.contains('open');
    items.classList.toggle('open', !aberto);
  }

  function setView(id, el, titulo) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
    document.getElementById('view-' + id).classList.add('active');
    if (el) el.classList.add('active');
    document.getElementById('topbar-title').textContent = titulo;
    fecharMenu();
    if (id === 'retiradas') carregarRetiradas();
    if (id === 'confirmacoes') carregarConfirmacoes();
    if (id === 'motoristas') carregarMotoboys();
  }

  // RETIRADAS
  async function carregarRetiradas() {
    const el = document.getElementById('lista-retiradas');
    el.innerHTML = '<div class="empty"><span class="spinner"></span> Carregando...</div>';
    try {
      const dia = getDia();
      const [rRes, mbRes] = await Promise.all([
        fetch(API + '/rotas-disponiveis?dia_semana=' + dia).then(r => r.json()),
        fetch(API + '/motoboys?todos=1').then(r => r.json())
      ]);
      const rotas = rRes.rotas || [];
      const motoboys = mbRes.motoboys || [];
      const mbPorRota = {};
      motoboys.filter(m => m.rota && m.dia_semana === dia).forEach(m => {
        if (!mbPorRota[m.rota]) mbPorRota[m.rota] = [];
        mbPorRota[m.rota].push(m);
      });
      if (!rotas.length) { el.innerHTML = '<div class="empty">Nenhuma rota para este dia</div>'; return; }
      el.innerHTML = rotas.map((r, i) => {
        const motos = mbPorRota[r.rota] || [];
        const motoStr = motos.length ? motos.map(m => m.nome).join(', ') : 'Sem motorista';
        return `
          <div class="rota-card ${r.ativa ? 'ativa' : ''}">
            <div class="rota-header" onclick="expandirRota('${r.rota.replace(/'/g,"\\'")}',${i})">
              <div style="flex:1;min-width:0">
                <div class="rota-nome">${r.rota}</div>
                <div style="font-size:12px;color:#5A7A8F;margin-top:2px">🏍️ ${motoStr}</div>
              </div>
              <span class="badge ${r.ativa ? 'badge-ativa' : 'badge-livre'}">${r.ativa ? '🔒 Em uso' : 'Livre'}</span>
              <span style="color:#94A8B8;font-size:12px" id="arr-${i}">▼</span>
            </div>
            <div class="rota-expand" id="exp-${i}"></div>
          </div>`;
      }).join('');
    } catch(e) {
      el.innerHTML = '<div class="empty" style="color:#A32D2D">Erro ao carregar</div>';
    }
  }

  async function expandirRota(rota, idx) {
    const div = document.getElementById('exp-' + idx);
    const arr = document.getElementById('arr-' + idx);
    if (div.classList.contains('open')) {
      div.classList.remove('open'); div.innerHTML = ''; arr.textContent = '▼'; return;
    }
    div.classList.add('open'); arr.textContent = '▲';
    div.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
    try {
      const r = await fetch(API + '/rota?rota=' + encodeURIComponent(rota) + '&dia_semana=' + getDia());
      const d = await r.json();
      const cls = d.clientes || [];
      const ent = cls.filter(c => c.status === 'entregue');
      const pend = cls.filter(c => c.status !== 'entregue');
      const prod = ent.filter(c => c.produtividade === 'produtiva').length;
      const imp = ent.filter(c => c.produtividade === 'improdutiva').length;

      const renderC = c => {
        const feito = c.status === 'entregue';
        const bad = c.produtividade === 'improdutiva';
        const icls = feito ? (bad ? 'bad' : 'ok') : (c.horario_chegada ? 'ch' : '');
        const icon = feito ? (bad ? '✕' : '✓') : (c.horario_chegada ? '📍' : '');
        const saida = c.horario_entrega ? c.horario_entrega.split(' ').pop() : '';
        return `<div class="cli-mini ${feito ? (bad?'imp':'feito') : ''}">
          <div class="cli-icon ${icls}">${icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;color:#0F4C7A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.nome}</div>
            <div style="font-size:10px;color:#5A7A8F">Nº${c.numero_cliente}${c.horario_chegada?' · <span style="color:#92400E">🟡'+c.horario_chegada+'</span>':''}${saida?' · <span style="color:#1E9FD9">🔵'+saida+'</span>':''}</div>
          </div>
          <span style="font-size:11px;font-weight:700;color:#1E9FD9">${c.horario}</span>
        </div>`;
      };

      div.innerHTML = `
        <div style="display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap">
          <span class="badge" style="background:#F0F4F8;color:#0F4C7A">${cls.length} total</span>
          <span class="badge" style="background:#E1F5EE;color:#085041">✓ ${prod}</span>
          ${imp?`<span class="badge" style="background:#F0F4F8;color:#5A7A8F">✕ ${imp}</span>`:''}
          <span class="badge badge-pendente">⏳ ${pend.length}</span>
        </div>
        ${pend.length?`<div style="font-size:10px;font-weight:700;color:#92400E;margin-bottom:4px">PENDENTES (${pend.length})</div>${pend.map(renderC).join('')}`:''}
        ${ent.length?`<div style="font-size:10px;font-weight:700;color:#1E9FD9;margin:8px 0 4px">REGISTRADAS (${ent.length})</div>${ent.map(renderC).join('')}`:''}
      `;
    } catch(e) {
      div.innerHTML = '<div class="empty" style="color:#A32D2D">Erro</div>';
    }
  }

  // CONFIRMAÇÕES
  async function carregarConfirmacoes() {
    const el = document.getElementById('lista-conf');
    el.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
    try {
      const r = await fetch(API + '/');
      const d = await r.json();
      const conf = d.confirmacoes || [];
      if (!conf.length) { el.innerHTML = '<div class="empty">Nenhuma confirmação hoje</div>'; return; }
      el.innerHTML = conf.map(c => `
        <div class="conf-item conf-${c.resposta}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <strong>${c.unidade}</strong>
            <span>${c.resposta==='sim'?'✅ Sim':'❌ Não'}</span>
          </div>
          ${c.obs?`<div style="font-size:12px;margin-top:4px;opacity:.8">${c.obs}</div>`:''}
          <div style="font-size:11px;margin-top:4px;opacity:.7">${c.data||''}</div>
        </div>`).join('');
    } catch(e) {
      el.innerHTML = '<div class="empty" style="color:#A32D2D">Erro</div>';
    }
  }

  // MOTORISTAS
  async function carregarMotoboys() {
    const el = document.getElementById('lista-mb');
    el.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
    try {
      const r = await fetch(API + '/motoboys?todos=1');
      const d = await r.json();
      if (!d.motoboys?.length) { el.innerHTML = '<div class="empty">Nenhum motorista cadastrado</div>'; return; }
      el.innerHTML = d.motoboys.map(m => `
        <div class="list-item">
          <div class="list-item-row">
            <div class="list-item-name">${m.nome}</div>
            <div class="list-item-meta">📱 ${m.telefone}</div>
            ${m.rota?`<span class="badge" style="background:#E8F4FB;color:#0F4C7A">${m.rota}·${m.dia_semana||''}</span>`:'<span class="badge" style="background:#F0F4F8;color:#94A8B8">Sem rota</span>'}
          </div>
          <div class="list-item-actions">
            <button class="btn btn-danger" style="height:32px;font-size:12px" onclick="excluirMotoboy(${m.id})">🗑 Excluir</button>
          </div>
        </div>`).join('');
    } catch(e) {
      el.innerHTML = '<div class="empty" style="color:#A32D2D">Erro</div>';
    }
  }

  async function adicionarMotoboy() {
    const nome = document.getElementById('mb-nome').value.trim();
    const tel = document.getElementById('mb-tel').value.trim();
    if (!nome || !tel) { showMsg('msg-mb','Preencha nome e telefone','error'); return; }
    showMsg('msg-mb','Salvando...','loading');
    try {
      await fetch(API + '/motoboys', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({nome, telefone:tel, rota:'', dia_semana:''}) });
      document.getElementById('mb-nome').value = '';
      document.getElementById('mb-tel').value = '';
      showMsg('msg-mb','✅ Motorista adicionado!','success');
      carregarMotoboys();
    } catch(e) { showMsg('msg-mb','Erro: '+e.message,'error'); }
  }

  async function excluirMotoboy(id) {
    if (!confirm('Excluir este motorista?')) return;
    await fetch(API + '/motoboys', { method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id}) });
    toast('Motorista excluído');
    carregarMotoboys();
  }

  // BUSCAR
  async function buscarCliente() {
    const q = document.getElementById('busca-input').value.trim();
    if (!q) return;
    const el = document.getElementById('busca-resultado');
    el.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
    try {
      const r = await fetch(API + '/clientes?todos=1&todos_dias=1');
      const d = await r.json();
      const ql = q.toLowerCase();
      const encontrados = (d.clientes||[]).filter(c => c.nome.toLowerCase().includes(ql) || String(c.numero_cliente).includes(q));
      if (!encontrados.length) { el.innerHTML = '<div class="empty">Nenhum cliente encontrado</div>'; return; }
      el.innerHTML = encontrados.slice(0,20).map(c => `
        <div class="list-item">
          <div class="list-item-row">
            <div class="list-item-name">${c.nome}</div>
            <div class="list-item-meta">Nº ${c.numero_cliente}</div>
          </div>
          <div style="font-size:12px;color:#5A7A8F;margin-top:4px">📍 ${c.rota||'Sem rota'} · ⏰ ${c.horario} · ${c.dia_semana||''}</div>
          <div class="list-item-actions">
            <button class="btn btn-secondary" style="height:32px;font-size:12px" onclick="abrirMover(${c.id})">↔ Mover</button>
          </div>
        </div>`).join('');
    } catch(e) { el.innerHTML = '<div class="empty" style="color:#A32D2D">Erro</div>'; }
  }

  function abrirMover(id) {
    clienteParaMover = id;
    document.getElementById('nova-rota-input').value = '';
    document.getElementById('modal-mover').classList.remove('hidden');
  }

  async function confirmarMover() {
    const rota = document.getElementById('nova-rota-input').value.trim();
    if (!rota || !clienteParaMover) return;
    await fetch(API + '/mover-cliente', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:clienteParaMover, rota}) });
    document.getElementById('modal-mover').classList.add('hidden');
    toast('✓ Movido para ' + rota);
    buscarCliente();
  }

  // CRIAR CLIENTE
  async function criarCliente() {
    const codigo = document.getElementById('cc-codigo').value.trim();
    const nome = document.getElementById('cc-nome').value.trim();
    const horario = document.getElementById('cc-horario').value;
    if (!codigo || !nome) { showMsg('msg-cc','Preencha código e nome','error'); return; }
    showMsg('msg-cc','Salvando...','loading');
    try {
      await fetch(API + '/clientes-base', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ numero_cliente: codigo, nome, horario: horario || '00:00' })
      });
      document.getElementById('cc-codigo').value = '';
      document.getElementById('cc-nome').value = '';
      document.getElementById('cc-horario').value = '';
      showMsg('msg-cc','✅ Cliente criado na base!','success');
    } catch(e) { showMsg('msg-cc','Erro: '+e.message,'error'); }
  }

  // ATIVAR/DESATIVAR
  async function buscarParaAtivar() {
    const q = document.getElementById('ativar-input').value.trim();
    if (!q) return;
    const el = document.getElementById('ativar-resultado');
    el.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
    try {
      const r = await fetch(API + '/clientes?todos=1&todos_dias=1');
      const d = await r.json();
      const ql = q.toLowerCase();
      const encontrados = (d.clientes||[]).filter(c => c.nome.toLowerCase().includes(ql) || String(c.numero_cliente).includes(q));
      if (!encontrados.length) { el.innerHTML = '<div class="empty">Nenhum cliente encontrado</div>'; return; }
      el.innerHTML = encontrados.slice(0,20).map(c => `
        <div class="list-item">
          <div class="list-item-row">
            <div class="list-item-name">${c.nome}</div>
            <div class="list-item-meta">Nº ${c.numero_cliente}</div>
            <span class="badge" style="${c.ativo ? 'background:#E1F5EE;color:#085041' : 'background:#FCEBEB;color:#791F1F'}">${c.ativo ? 'Ativo' : 'Inativo'}</span>
          </div>
          <div style="font-size:12px;color:#5A7A8F;margin-top:4px">📍 ${c.rota||'Sem rota'} · ${c.dia_semana||''}</div>
          <div class="list-item-actions">
            ${c.ativo
              ? `<button class="btn btn-danger" style="height:32px;font-size:12px" onclick="toggleAtivar(${c.id},0)">⛔ Desativar</button>`
              : `<button class="btn btn-primary" style="height:32px;font-size:12px" onclick="toggleAtivar(${c.id},1)">✅ Ativar</button>`
            }
          </div>
        </div>`).join('');
    } catch(e) { el.innerHTML = '<div class="empty" style="color:#A32D2D">Erro</div>'; }
  }

  async function toggleAtivar(id, ativo) {
    if (ativo) {
      await fetch(API + '/reativar-cliente', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id}) });
    } else {
      await fetch(API + '/clientes', { method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id}) });
    }
    toast(ativo ? '✅ Cliente ativado' : '⛔ Cliente desativado');
    buscarParaAtivar();
  }

  // RESET
  async function fazerReset() {
    if (!confirm('Tem certeza? Reseta TODOS os clientes.')) return;
    showMsg('msg-reset','Resetando...','loading');
    try {
      const r = await fetch(API + '/reset', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
      const d = await r.json();
      showMsg('msg-reset','✅ Reset feito! '+d.total+' clientes resetados.','success');
    } catch(e) { showMsg('msg-reset','Erro: '+e.message,'error'); }
  }

  async function resetConfirmacoes() {
    if (!confirm('Limpar todas as confirmações de hoje?')) return;
    await fetch(API + '/reset-confirmacoes', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    showMsg('msg-reset-conf','✅ Confirmações limpas!','success');
  }

  // HELPERS
  function abrirModal(id) { document.getElementById(id).classList.remove('hidden'); }
  function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = (type==='loading'?'<span class="spinner"></span>':'')+text;
    el.className = 'msg'+(type?' '+type:'');
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  // Init
  carregarRetiradas();
</script>
</body>
</html>
