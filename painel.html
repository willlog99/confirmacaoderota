<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Loglife</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Loglife Admin"/>
<link rel="apple-touch-icon" href="20050686-7618-4EE2-86F2-0E0E1EE012BE.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0F4F8;color:#0F4C7A;min-height:100vh}
    .topbar{background:linear-gradient(135deg,#1E9FD9,#0F7BB0);padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(15,75,122,0.25)}
    .topbar-left{display:flex;align-items:center;gap:1.5rem}
    .menu-btn{background:rgba(255,255,255,0.18);color:#fff;border:none;height:44px;padding:0 18px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .2s}
    .menu-btn:hover{background:rgba(255,255,255,0.28)}
    .topbar-logo{height:70px;width:auto;filter:brightness(0) invert(1)}
    .topbar-right{text-align:right;color:#fff}
    .topbar-titulo{font-size:13px;opacity:.7;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
    .topbar-data{font-size:17px;font-weight:700;margin-top:2px}
    .menu-overlay{position:fixed;inset:0;background:rgba(15,75,122,0.65);z-index:200;display:none}
    .menu-overlay.open{display:flex}
    .menu-side{background:#fff;width:300px;max-width:88vw;height:100%;display:flex;flex-direction:column;overflow-y:auto;box-shadow:4px 0 25px rgba(15,75,122,0.2)}
    .menu-header{background:linear-gradient(135deg,#1E9FD9,#0F7BB0);padding:1.5rem 1.25rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .menu-header img{height:40px;filter:brightness(0) invert(1)}
    .menu-close{background:rgba(255,255,255,0.2);border:none;color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:17px}
    .menu-cat{border-bottom:1px solid #EBF1F5}
    .menu-cat-btn{width:100%;padding:13px 1.25rem;background:#F7FBFD;border:none;text-align:left;font-size:11px;font-weight:700;color:#5A7A8F;cursor:pointer;display:flex;align-items:center;justify-content:space-between;text-transform:uppercase;letter-spacing:.7px}
    .menu-cat-btn:hover{background:#EBF1F5}
    .menu-cat-items{display:none}
    .menu-cat-items.open{display:block}
    .menu-item{display:block;width:100%;padding:13px 1.5rem;background:#fff;border:none;text-align:left;font-size:14px;font-weight:500;color:#0F4C7A;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
    .menu-item:hover{background:#F7FBFD;border-left-color:#BFE0F0}
    .menu-item.active{background:#E8F4FB;border-left-color:#1E9FD9;font-weight:700}
    .menu-item.danger{color:#A32D2D}
    .menu-item.danger:hover{background:#FCEBEB;border-left-color:#F09595}
    .content{padding:2rem;max-width:1400px;margin:0 auto}
    .view{display:none}
    .view.active{display:block}
    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.25rem;margin-bottom:2rem}
    .kpi{background:#fff;border-radius:16px;padding:1.5rem;text-align:center;box-shadow:0 2px 10px rgba(30,159,217,0.08);border-top:4px solid;transition:transform .2s,box-shadow .2s}
    .kpi:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(30,159,217,0.15)}
    .kpi.total{border-color:#1E9FD9}
    .kpi.feitas{border-color:#0F9B78}
    .kpi.pendentes{border-color:#F59E0B}
    .kpi.motoboys{border-color:#7C3AED}
    .kpi-icon{font-size:24px;margin-bottom:6px}
    .kpi-val{font-size:42px;font-weight:800;line-height:1}
    .kpi.total .kpi-val{color:#1E9FD9}
    .kpi.feitas .kpi-val{color:#0F9B78}
    .kpi.pendentes .kpi-val{color:#F59E0B}
    .kpi.motoboys .kpi-val{color:#7C3AED}
    .kpi-label{font-size:13px;color:#5A7A8F;margin-top:8px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
    .dash-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:1.5rem;align-items:start}
    @media(max-width:980px){
      .dash-grid{grid-template-columns:1fr}
      .kpi-grid{grid-template-columns:repeat(2,1fr)}
      .topbar-logo{height:48px}
      .content{padding:1rem}
    }
    .panel{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(30,159,217,0.08);overflow:hidden}
    .panel-header{padding:1.25rem 1.5rem;border-bottom:1px solid #EBF1F5;display:flex;align-items:center;justify-content:space-between;background:#F7FBFD}
    .panel-title{font-size:15px;font-weight:800;color:#0F4C7A;display:flex;align-items:center;gap:8px}
    .panel-badge{font-size:11px;background:#1E9FD9;color:#fff;padding:3px 9px;border-radius:99px;font-weight:700}
    .panel-live{display:flex;align-items:center;gap:6px;font-size:11px;color:#0F9B78;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    .live-dot{width:8px;height:8px;border-radius:50%;background:#0F9B78;animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes pulse2{0%,100%{opacity:1}50%{opacity:.2}}
    .leaflet-popup-content{margin:10px 14px!important;font-family:-apple-system,sans-serif}
    .panel-body{padding:1rem 1.5rem;max-height:400px;overflow-y:auto}
    .rota-card{background:#fff;border-radius:12px;padding:1rem 1.25rem;margin-bottom:10px;border:1.5px solid #EBF1F5;cursor:pointer;transition:all .2s;position:relative}
    .rota-card:hover{border-color:#1E9FD9;box-shadow:0 4px 12px rgba(30,159,217,0.12)}
    .rota-card.em-andamento{border-left:4px solid #1E9FD9}
    .rota-card.completa{border-left:4px solid #0F9B78;background:#F0FAF7}
    .rota-card.livre{border-left:4px solid #D6E5EE}
    .rota-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .rota-nome{font-size:15px;font-weight:800;color:#0F4C7A;flex:1}
    .rota-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px}
    .badge-andamento{background:#E8F4FB;color:#0F4C7A}
    .badge-completa{background:#E1F5EE;color:#085041}
    .badge-livre{background:#F0F4F8;color:#94A8B8}
    .rota-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:#5A7A8F;margin-bottom:8px}
    .rota-progress{display:flex;align-items:center;gap:10px}
    .progress-bar{flex:1;height:8px;border-radius:99px;background:#EBF1F5;overflow:hidden}
    .progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#1E9FD9,#0F7BB0);transition:width .6s}
    .rota-card.completa .progress-fill{background:linear-gradient(90deg,#0F9B78,#085041)}
    .progress-txt{font-size:13px;font-weight:800;color:#0F4C7A;flex-shrink:0;min-width:55px;text-align:right}
    .rota-preview{margin-top:10px;padding-top:10px;border-top:1px solid #EBF1F5;display:none;animation:fadeIn .2s}
    .rota-card.expanded .rota-preview{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
    .preview-sec{font-size:10px;font-weight:800;color:#5A7A8F;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
    .preview-cli{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;font-size:11px;margin-bottom:2px}
    .preview-cli.feito{background:#E1F5EE;color:#085041}
    .preview-cli.imp{background:#F0F4F8;color:#5A7A8F}
    .preview-cli.pend{background:#FEF9EC;color:#92400E}
    .preview-cli-ico{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
    .preview-cli.feito .preview-cli-ico{background:#0F9B78;color:#fff}
    .preview-cli.imp .preview-cli-ico{background:#5A7A8F;color:#fff}
    .preview-cli.pend .preview-cli-ico{background:#F59E0B;color:#fff}
    .preview-cli-nome{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
    .preview-cli-hora{font-weight:700;flex-shrink:0}
    .conf-progress{padding:1rem 1.5rem;background:linear-gradient(135deg,#E8F4FB,#F0FAFD);border-bottom:1px solid #EBF1F5}
    .conf-prog-val{font-size:32px;font-weight:800;color:#1E9FD9;line-height:1}
    .conf-prog-lbl{font-size:13px;color:#5A7A8F;margin:6px 0}
    .conf-bar{height:8px;border-radius:99px;background:#fff;overflow:hidden;border:1px solid #D6E5EE}
    .conf-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#1E9FD9,#0F7BB0);transition:width .6s}
    .conf-list{padding:0.75rem 1.5rem}
    .conf-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;margin-bottom:6px;border:1px solid;animation:slideIn .3s}
    @keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
    .conf-row.sim {background:#F0FAF7;border-color:#85DDBA}
    .conf-row.nao {background:#FEF4F4;border-color:#F09595}
    .conf-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
    .conf-row.sim .conf-ico{background:#0F9B78;color:#fff}
    .conf-row.nao .conf-ico{background:#DC2626;color:#fff}
    .conf-info{flex:1;min-width:0}
    .conf-uni{font-size:13px;font-weight:700;color:#0F4C7A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conf-obs{font-size:11px;color:#5A7A8F;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conf-hora{font-size:11px;color:#94A8B8;flex-shrink:0;font-weight:600}
    .detalhe-header{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
    .detalhe-back{background:#fff;color:#0F4C7A;border:1.5px solid #D6E5EE;height:42px;padding:0 16px;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
    .detalhe-back:hover{background:#F7FBFD}
    .detalhe-titulo{font-size:22px;font-weight:800;color:#0F4C7A;flex:1}
    .cli-item{background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:8px;border:1.5px solid #EBF1F5;display:flex;align-items:center;gap:12px;transition:all .15s}
    .cli-item:hover{box-shadow:0 2px 8px rgba(30,159,217,0.08)}
    .cli-item.feito{background:#F0FAF7;border-color:#85DDBA}
    .cli-item.improdutivo{background:#F5F6F8;border-color:#C5D0DA}
    .cli-item.chegou{background:#FEF9EC;border-color:#F2CC70}
    .cli-status{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:#EBF1F5;color:#94A8B8;font-weight:800}
    .cli-status.ok{background:#0F9B78;color:#fff}
    .cli-status.imp{background:#5A7A8F;color:#fff}
    .cli-status.ch{background:#F2CC70;color:#92400E}
    .cli-info{flex:1;min-width:0}
    .cli-nome{font-size:14px;font-weight:700;color:#0F4C7A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cli-meta{font-size:12px;color:#5A7A8F;margin-top:2px}
    .cli-hora{font-size:14px;font-weight:800;color:#1E9FD9;flex-shrink:0}
    .card{background:#fff;border-radius:14px;padding:1.5rem;box-shadow:0 2px 10px rgba(30,159,217,0.07);margin-bottom:1rem}
    .card-title{font-size:17px;font-weight:800;color:#0F4C7A;margin-bottom:1rem}
    .field{margin-bottom:.9rem}
    .field label{display:block;font-size:11px;font-weight:700;color:#5A7A8F;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
    .field input,.field select{width:100%;height:44px;border-radius:10px;border:1.5px solid #D6E5EE;font-size:14px;padding:0 12px;color:#0F4C7A;background:#fff;outline:none}
    .field input:focus,.field select:focus{border-color:#1E9FD9}
    .btn{height:44px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;border:none;padding:0 18px;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-primary{background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff}
    .btn-secondary{background:#fff;color:#0F4C7A;border:1.5px solid #D6E5EE}
    .btn-danger{background:#DC2626;color:#fff}
    .btn-warning{background:#F59E0B;color:#fff}
    .btn-block{width:100%;justify-content:center}
    .list-item{padding:14px;border-radius:11px;border:1.5px solid #D6E5EE;margin-bottom:8px;background:#fff}
    .list-item-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .list-item-name{font-size:14px;font-weight:700;color:#0F4C7A;flex:1;min-width:0}
    .list-item-meta{font-size:12px;color:#5A7A8F}
    .list-item-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
    .badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
    .search-row{display:flex;gap:8px;margin-bottom:1rem}
    .search-row input{flex:1;height:44px;border-radius:10px;border:1.5px solid #D6E5EE;padding:0 12px;font-size:14px;color:#0F4C7A;outline:none}
    .search-row input:focus{border-color:#1E9FD9}
    .modal-overlay{position:fixed;inset:0;background:rgba(15,75,122,0.5);z-index:300;display:flex;align-items:flex-end;justify-content:center}
    .modal-overlay.hidden{display:none}
    .modal{background:#fff;border-radius:20px 20px 0 0;padding:1.5rem;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
    .modal h2{font-size:17px;font-weight:700;color:#0F4C7A;margin-bottom:1rem}
    .modal-btns{display:flex;gap:8px;margin-top:1rem}
    .modal-btns .btn{flex:1;justify-content:center}
    .msg{padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;margin-top:10px;display:none;text-align:center}
    .msg.success{background:#E8F4FB;color:#0F4C7A;border:1.5px solid #1E9FD9;display:block}
    .msg.error{background:#FCEBEB;color:#791F1F;border:1.5px solid #F09595;display:block}
    .msg.loading{background:#F7FBFD;color:#5A7A8F;border:1.5px solid #D6E5EE;display:block}
    .spinner{display:inline-block;width:13px;height:13px;border:2px solid #D6E5EE;border-top-color:#1E9FD9;border-radius:50%;animation:spin .8s linear infinite;margin-right:5px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#0F4C7A;color:#fff;padding:11px 22px;border-radius:99px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 12px rgba(15,75,122,0.3)}
    .toast.show{opacity:1}
    .empty{text-align:center;padding:2rem;color:#94A8B8;font-size:13px}
  
    /* ══ NOVO LAYOUT ══ */
    :root{
      --az:#0F4C7A;--az2:#1E9FD9;--az3:#E8F4FB;
      --vd:#0F9B78;--vd2:#E8F8F0;
      --am:#F59E0B;--am2:#FEF9EC;
      --rd:#DC2626;--rd2:#FCEBEB;
      --bg:#F0F5FA;--card:#fff;
      --border:#D6E5EE;--border2:#EBF1F5;
      --txt:#0F2940;--mut:#5A7A8F;--mut2:#94A8B8;
      --sidebar-w:220px;
    }
    html,body{height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column}
    .app-layout{display:flex;flex:1;overflow:hidden;height:100vh}
    .app-sidebar{width:var(--sidebar-w);background:var(--az);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
    .sidebar-logo{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;display:flex;align-items:center;gap:10px;}
    .sidebar-logo img{height:32px;width:auto;filter:brightness(0) invert(1)}
    .sidebar-logo-txt{font-size:13px;font-weight:700;color:#fff}
    .sidebar-logo-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:1px}
    .sidebar-nav{flex:1;overflow-y:auto;padding:8px 0;scrollbar-width:none}
    .sidebar-nav::-webkit-scrollbar{display:none}
    .nav-group-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.12em;padding:10px 16px 4px;}
    .nav-item{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:13px;font-weight:500;color:rgba(255,255,255,.55);cursor:pointer;border-left:2px solid transparent;transition:.15s;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;text-align:left;font-family:inherit;}
    .nav-item:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.05)}
    .nav-item.active{color:#fff;background:rgba(30,159,217,.18);border-left-color:var(--az2);font-weight:600}
    .nav-ic{font-size:13px;width:18px;text-align:center;flex-shrink:0}
    .nav-badge-red{margin-left:auto;font-size:10px;font-weight:700;background:var(--rd);color:#fff;padding:1px 6px;border-radius:20px}
    .nav-tag{margin-left:auto;font-size:9px;color:rgba(255,255,255,.25);background:rgba(255,255,255,.07);padding:1px 5px;border-radius:3px}
    .nav-live{margin-left:auto;display:flex;align-items:center;gap:3px;font-size:9px;font-weight:700;color:#4ade80;background:rgba(74,222,128,.15);padding:2px 6px;border-radius:20px}
    .nav-live-dot{width:5px;height:5px;border-radius:50%;background:#4ade80;animation:pulse2 1.4s infinite}
    .sidebar-footer{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .sf-av{width:28px;height:28px;border-radius:50%;background:var(--az2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
    .sf-name{font-size:12px;font-weight:600;color:rgba(255,255,255,.8)}
    .sf-role{font-size:10px;color:rgba(255,255,255,.35)}
    .app-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
    .app-topbar{background:var(--card);border-bottom:1px solid var(--border2);padding:0 20px;height:48px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
    .tb-breadcrumb{font-size:11px;color:var(--mut)}
    .tb-breadcrumb b{color:var(--txt);font-weight:600}
    .tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
    .tb-btn{height:30px;padding:0 12px;border-radius:7px;border:1.5px solid var(--border);background:var(--card);font-size:11px;font-weight:600;color:var(--mut);cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;transition:.15s}
    .tb-btn:hover{border-color:var(--az2);color:var(--az)}
    .app-content{flex:1;overflow-y:auto;padding:16px 20px}
    .kpi-grid-new{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .kpi-new{background:var(--card);border-radius:12px;padding:.9rem;text-align:center;border:1px solid var(--border2);box-shadow:0 2px 8px rgba(30,159,217,.06);transition:.2s;cursor:default}
    .kpi-new:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(30,159,217,.1)}
    .kpi-ico{font-size:20px;margin-bottom:3px}
    .kpi-val{font-size:26px;font-weight:800;color:var(--az);line-height:1}
    .kpi-lbl{font-size:10px;color:var(--mut);font-weight:600;margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
    .ri{padding:9px 14px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:9px;cursor:pointer;transition:.15s}
    .ri:last-child{border-bottom:none}
    .ri:hover{background:#F7FBFD}
