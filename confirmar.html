<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loglife — Exportar IHP</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#E8F4FB 0%,#F0F4F8 100%);min-height:100vh;padding:2rem 1rem}
    .container{width:100%;max-width:800px;margin:0 auto}
    .card{background:#fff;border-radius:16px;padding:2rem;box-shadow:0 4px 20px rgba(30,159,217,0.12);margin-bottom:2rem}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#5A7A8F;cursor:pointer;margin-bottom:1.5rem;text-decoration:none;font-weight:500}
    .back-link:hover{color:#0F4C7A}
    h1{font-size:22px;font-weight:700;color:#0F4C7A;margin-bottom:1rem}
    .subtitle{font-size:14px;color:#5A7A8F;margin-bottom:1.5rem}
    .field{margin-bottom:1.5rem}
    label{font-size:13px;color:#0F4C7A;font-weight:600;display:block;margin-bottom:6px}
    select{width:100%;height:42px;border-radius:10px;border:1.5px solid #D6E5EE;font-size:14px;padding:0 12px;color:#111;background:#F7FBFD;cursor:pointer}
    select:focus{outline:none;border-color:#1E9FD9;background:#fff}
    .btn{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none;background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff;margin-bottom:8px;box-shadow:0 4px 12px rgba(30,159,217,0.3)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .msg{border-radius:11px;padding:12px 16px;font-size:13px;text-align:center;margin-bottom:1rem;display:none;font-weight:500}
    .msg.success{background:#E1F5EE;color:#085041;border:1.5px solid #5DCAA5;display:block}
    .msg.error{background:#FCEBEB;color:#791F1F;border:1.5px solid #F09595;display:block}
    .msg.loading{background:#E8F4FB;color:#0F4C7A;border:1.5px solid #BFE0F0;display:block}
    .info{font-size:12px;color:#5A7A8F;padding:10px;background:#F7FBFD;border-radius:8px;border-left:3px solid #1E9FD9;margin-top:1rem}
  </style>
</head>
<body>
<div class="container">
  <a class="back-link" href="painel.html">← Voltar</a>
  <div class="card">
    <h1>📊 Exportar Planilha IHP</h1>
    <p class="subtitle">Gere relatório com dados de coletas e atrasos</p>

    <div class="field">
      <label for="sel-dia">Selecione o dia</label>
      <select id="sel-dia">
        <option value="">Carregando...</option>
      </select>
    </div>

    <button class="btn" onclick="exportar()">📥 Gerar e baixar planilha</button>
    <div class="msg" id="msg"></div>

    <div class="info">
      ℹ️ A planilha terá 2 abas:<br/>
      • <strong>IHP</strong> — dados normais de coletas<br/>
      • <strong>Atrasos</strong> — clientes com atraso em vermelho
    </div>
  </div>
</div>

<script>
  const API = 'https://confirmacaoderota.willlog99.workers.dev';

  window.addEventListener('load', async () => {
    await carregarDias();
  });

  async function carregarDias() {
    try {
      const r = await fetch(API + '/rotas-disponiveis?todos_dias=1');
      const d = await r.json();
      const rotas = d.rotas || [];
      
      const dias = new Set();
      rotas.forEach(r => {
        if (r.data_abertura) {
          const data = r.data_abertura.split(' ')[0];
          dias.add(data);
        }
      });

      const diaArray = Array.from(dias).sort().reverse();
      const sel = document.getElementById('sel-dia');
      sel.innerHTML = diaArray.map(d => `<option value="${d}">${d}</option>`).join('');
      
      if (diaArray.length === 0) {
        sel.innerHTML = '<option value="">Nenhum dia disponível</option>';
      }
    } catch(e) {
      document.getElementById('sel-dia').innerHTML = '<option value="">Erro ao carregar</option>';
    }
  }

  async function exportar() {
    const dia = document.getElementById('sel-dia').value;
    if (!dia) { showMsg('Selecione um dia.', 'error'); return; }

    const btn = document.querySelector('.btn');
    btn.disabled = true;
    showMsg('Gerando planilha...', 'loading');

    try {
      const r = await fetch(API + '/historico?data=' + encodeURIComponent(dia));
      const d = await r.json();
      const historico = d.historico || [];

      // Agrupar por rota
      const porRota = {};
      historico.forEach(h => {
        if (!porRota[h.rota]) porRota[h.rota] = [];
        porRota[h.rota].push(h);
      });

      // Criar workbook
      const wb = XLSX.utils.book_new();

      // ABA 1: IHP (dados normais)
      const dadosIHP = [];
      Object.keys(porRota).sort().forEach(rota => {
        porRota[rota].forEach(h => {
          dadosIHP.push({
            'Rota': rota,
            'Cliente': h.nome,
            'Nº': h.numero_cliente,
            'Horário': h.horario,
            'Entrega': h.horario_entrega ? h.horario_entrega.split(' ').pop() : '—',
            'Status': h.produtividade === 'produtiva' ? 'Produtiva' : h.produtividade === 'improdutiva' ? 'Improdutiva' : 'Pendente',
            'Motivo': h.motivo_improdutiva || ''
          });
        });
      });

      const wsIHP = XLSX.utils.json_to_sheet(dadosIHP);
      XLSX.utils.book_append_sheet(wb, wsIHP, 'IHP');

      // ABA 2: Atrasos (em vermelho)
      const dadosAtrasos = [];
      Object.keys(porRota).sort().forEach(rota => {
        porRota[rota].forEach(h => {
          if (h.horario_entrega && h.horario) {
            const [hMarcada, mMarcada] = h.horario.split(':').map(Number);
            const horarioMarcado = new Date();
            horarioMarcado.setHours(hMarcada, mMarcada, 0);
            
            const dataEntrega = new Date(h.horario_entrega);
            const minAtrasado = Math.floor((dataEntrega - horarioMarcado) / 60000);
            
            if (minAtrasado > 30) {
              const horas = Math.floor(minAtrasado / 60);
              const mins = minAtrasado % 60;
              const tempoStr = horas > 0 ? `${horas}h ${mins}min` : `${mins}min`;
              
              dadosAtrasos.push({
                'Rota': rota,
                'Cliente': h.nome,
                'Nº': h.numero_cliente,
                'Hora Marcada': h.horario,
                'Hora Baixa': h.horario_entrega.split(' ').pop(),
                'Atraso': tempoStr
              });
            }
          }
        });
      });

      const wsAtrasos = XLSX.utils.json_to_sheet(dadosAtrasos);
      
      // Aplicar cor vermelha em negrito nos atrasos
      const range = XLSX.utils.decode_range(wsAtrasos['!ref'] || 'A1');
      for (let R = range.s.r; R <= range.e.r; ++R) {
        for (let C = range.s.c; C <= range.e.c; ++C) {
          const cellAddress = XLSX.utils.encode_col(C) + XLSX.utils.encode_row(R + 1);
          if (wsAtrasos[cellAddress]) {
            wsAtrasos[cellAddress].s = {
              font: { color: { rgb: 'FFCC0000' }, bold: true },
              alignment: { horizontal: 'left' }
            };
          }
        }
      }

      XLSX.utils.book_append_sheet(wb, wsAtrasos, 'Atrasos');

      // Baixar
      XLSX.writeFile(wb, `IHP_${dia}.xlsx`);
      showMsg('✓ Planilha gerada e baixada com sucesso!', 'success');
    } catch(e) {
      showMsg('Erro ao gerar planilha: ' + e.message, 'error');
    }
    btn.disabled = false;
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }
</script>
</body>
</html>
