<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loglife — Confirmação de Presença</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#E8F4FB 0%,#F0F4F8 100%);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
    .container{width:100%;max-width:460px}
    .card{background:#fff;border-radius:24px;padding:1.75rem;box-shadow:0 4px 20px rgba(30,159,217,0.12);margin-bottom:1rem}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#5A7A8F;cursor:pointer;margin-bottom:1.25rem;text-decoration:none;font-weight:500}
    .back-link:hover{color:#0F4C7A}
    .logo-area{text-align:center;margin-bottom:1.25rem}
    .logo-img{height:52px;width:auto}
    h1{font-size:20px;font-weight:700;color:#0F4C7A;margin-bottom:4px;text-align:center}
    .subtitle{font-size:14px;color:#5A7A8F;margin-bottom:1.5rem;text-align:center}
    .info-card{background:#E8F4FB;border:1.5px solid #1E9FD9;border-radius:12px;padding:14px;margin-bottom:1rem;text-align:center}
    .info-nome{font-size:16px;font-weight:700;color:#0F4C7A;margin-bottom:4px}
    .info-rota{font-size:13px;color:#5A7A8F}
    .info-label{font-size:11px;color:#94A8B8;text-transform:uppercase;font-weight:700;letter-spacing:.4px}
    .btn-group{display:flex;flex-direction:column;gap:10px;margin-bottom:1rem}
    .btn{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:0}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-sim{background:#E1F5EE;color:#085041;border:1.5px solid #5DCAA5}
    .btn-sim:hover:not(:disabled){background:#c8f0e0}
    .btn-nao{background:#FCEBEB;color:#791F1F;border:1.5px solid #F09595}
    .btn-nao:hover:not(:disabled){background:#fad5d5}
    .obs-area{display:none;margin-top:14px;animation:fadeIn .2s ease}
    .obs-area.visible{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
    textarea{width:100%;border-radius:11px;border:1.5px solid #D6E5EE;font-size:14px;font-family:inherit;padding:10px 12px;resize:vertical;min-height:80px;color:#111;margin-bottom:10px;background:#F7FBFD}
    textarea:focus{outline:none;border-color:#1E9FD9;background:#fff}
    label{font-size:13px;color:#0F4C7A;display:block;margin-bottom:6px;font-weight:600}
    .msg{border-radius:11px;padding:14px 16px;font-size:14px;text-align:center;margin-top:14px;display:none;font-weight:500}
    .msg.success{background:#E1F5EE;color:#085041;border:1.5px solid #5DCAA5;display:block}
    .msg.error{background:#FCEBEB;color:#791F1F;border:1.5px solid #F09595;display:block}
    .msg.loading{background:#E8F4FB;color:#0F4C7A;border:1.5px solid #BFE0F0;display:block}
    .footer{text-align:center;font-size:11px;color:#94A8B8;margin-top:.75rem}

    .modal-overlay{position:fixed;inset:0;background:rgba(15,75,122,0.6);z-index:200;display:flex;align-items:center;justify-content:center}
    .modal-overlay.hidden{display:none}
    .modal{background:#fff;border-radius:20px;padding:2rem 1.75rem;width:90%;max-width:340px;text-align:center;max-height:80vh;overflow-y:auto}
    .modal h2{font-size:18px;font-weight:700;color:#0F4C7A;margin-bottom:1rem}
    .modal p{font-size:14px;color:#5A7A8F;margin-bottom:1.5rem;line-height:1.5}
    .modal-btns{display:flex;flex-direction:column;gap:10px}
    .modal-btn{padding:13px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center}
    .modal-btn.primary{background:linear-gradient(135deg,#1E9FD9,#0F7BB0);color:#fff}
    .modal-btn.secondary{background:#fff;color:#5A7A8F;border:1.5px solid #D6E5EE}

    .rota-option{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:11px;border:1.5px solid #D6E5EE;background:#fff;margin-bottom:8px;cursor:pointer;transition:all .2s;text-align:left}
    .rota-option:hover{border-color:#1E9FD9;background:#F7FBFD;transform:translateY(-1px)}
    .rota-option-info{flex:1;min-width:0}
    .rota-name{font-size:14px;font-weight:700;color:#0F4C7A}
    .rota-arrow{color:#1E9FD9;font-size:18px;font-weight:bold;flex-shrink:0}
  </style>
</head>
<body>
<div class="container">
  <a class="back-link" href="index.html">← Voltar</a>
  <div class="card">
    <div class="logo-area"><img src="20050686-7618-4EE2-86F2-0E0E1EE012BE.png" alt="Loglife" class="logo-img"/></div>
    <h1>Confirmação de Presença</h1>
    <p class="subtitle">Confirme sua presença</p>
    
    <div class="info-card">
      <div class="info-label">Biocondutor</div>
      <div class="info-nome" id="info-nome">—</div>
    </div>

    <div class="btn-group">
      <button class="btn btn-sim" id="btn-sim" onclick="confirmarPresenca('sim')">✓ Confirmar presença</button>
      <button class="btn btn-nao" id="btn-nao" onclick="abrirMotivo()">✗ Não irei</button>
    </div>

    <div class="obs-area" id="obs-area">
      <label>Motivo <span style="color:#94A8B8;font-size:12px;font-weight:400">(opcional)</span></label>
      <textarea id="obs-text" placeholder="Ex: ficou doente, veículo quebrou..."></textarea>
      <button class="btn btn-nao" id="btn-send" onclick="confirmarPresenca('nao')">Confirmar não presença</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>
  <div class="footer">Loglife</div>
</div>

<!-- MODAL: SELEÇÃO DE ROTAS -->
<div class="modal-overlay hidden" id="modal-rotas">
  <div class="modal">
    <h2>🛣️ Selecione sua rota</h2>
    <p>Você tem múltiplas rotas. Escolha qual deseja abrir:</p>
    <div id="lista-rotas-modal"></div>
  </div>
</div>

<!-- MODAL: VOLTAR AO INICIO -->
<div class="modal-overlay hidden" id="modal-fim">
  <div class="modal">
    <h2>✓ Tudo pronto!</h2>
    <p id="msg-fim">Sua presença foi registrada.</p>
    <div class="modal-btns">
      <button class="modal-btn primary" onclick="voltarInicial()">← Voltar ao início</button>
    </div>
  </div>
</div>

<script>
  const API = 'https://confirmacaoderota.willlog99.workers.dev';
  let telefoneSalvo = null;
  let nomeUsuario = null;
  let rotasDisponivel = [];
  let rotasCarregadas = false;

  window.addEventListener('load', async () => {
    telefoneSalvo = localStorage.getItem('telefone_temp');
    nomeUsuario = localStorage.getItem('nome_temp');

    if (!telefoneSalvo || !nomeUsuario) {
      window.location.href = 'index.html';
      return;
    }

    document.getElementById('info-nome').textContent = nomeUsuario;

    // Buscar rotas com retry
    await carregarRotas();
  });

  async function carregarRotas() {
    try {
      const r = await fetch(API + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telefone: telefoneSalvo })
      });
      const d = await r.json();
      if (d.status === 'ok') {
        rotasDisponivel = (d.rotas_info || []).filter(r => r.status !== 'travada');
        rotasCarregadas = true;
      }
    } catch(e) {
      // Tenta de novo após 2 segundos
      setTimeout(carregarRotas, 2000);
    }
  }

  function abrirMotivo() {
    document.getElementById('obs-area').classList.add('visible');
    document.getElementById('obs-text').focus();
  }

  async function confirmarPresenca(resp) {
    const obs = resp === 'nao' ? (document.getElementById('obs-text').value || '').trim() : '';
    setBtns(true);
    showMsg('Enviando...', 'loading');
    
    try {
      const r = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ biocondutor: nomeUsuario, resposta: resp, obs })
      });
      const d = await r.json();
      
      if (d.status === 'ok') {
        localStorage.setItem('motoboy_tel', telefoneSalvo);
        localStorage.setItem('motoboy_nome', nomeUsuario);
        showMsg(resp === 'sim' ? '✓ Presença confirmada!' : '✗ Não confirmação registrada.', 'success');
        
        // Se rotas ainda não carregaram, tenta buscar agora
        if (!rotasCarregadas) await carregarRotas();
        
        setTimeout(() => {
          if (rotasDisponivel.length > 0) {
            mostrarSelecaoRotas();
          } else {
            mostrarFim(resp === 'sim' ? 'Sua presença foi confirmada.' : 'Sua não confirmação foi registrada.');
          }
        }, 800);

      } else if (d.status === 'duplicado') {
        // Já confirmou — mostra popup de rotas direto
        showMsg('Presença já registrada!', 'success');
        if (!rotasCarregadas) await carregarRotas();
        setTimeout(() => {
          if (rotasDisponivel.length > 0) mostrarSelecaoRotas();
          else mostrarFim('Sua presença já foi registrada.');
        }, 800);
      } else {
        showMsg('Erro ao enviar. Tente novamente.', 'error');
        setBtns(false);
      }
    } catch(e) {
      showMsg('Erro de conexão. Tente novamente.', 'error');
      setBtns(false);
    }
  }

  function mostrarSelecaoRotas() {
    if (rotasDisponivel.length === 1) {
      irParaRota(rotasDisponivel[0].rota);
      return;
    }

    const lista = document.getElementById('lista-rotas-modal');
    lista.innerHTML = rotasDisponivel.map(r => `
      <div class="rota-option" onclick="irParaRota('${r.rota.replace(/'/g,"\\'")}')" style="cursor:pointer">
        <div class="rota-option-info">
          <div class="rota-name">🚚 ${r.rota}</div>
        </div>
        <div class="rota-arrow">→</div>
      </div>
    `).join('');

    document.getElementById('modal-rotas').classList.remove('hidden');
  }

  function irParaRota(rota) {
    localStorage.setItem('motoboy_rota', rota);
    window.location.href = 'rota.html';
  }

  function mostrarFim(msg) {
    document.getElementById('msg-fim').textContent = msg;
    document.getElementById('modal-fim').classList.remove('hidden');
  }

  function voltarInicial() {
    localStorage.removeItem('telefone_temp');
    localStorage.removeItem('nome_temp');
    window.location.href = 'index.html';
  }

  function setBtns(disabled) {
    document.getElementById('btn-sim').disabled = disabled;
    document.getElementById('btn-nao').disabled = disabled;
    const s = document.getElementById('btn-send');
    if (s) s.disabled = disabled;
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }
</script>
</body>
</html>
